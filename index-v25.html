function persistForm(status){
  let p;
  if(F.editingId){
    p=DB.permits.find(x=>x.id===F.editingId);
    const fields=["building","floor","area","location","company","requestedBy","phone","email","foreman","foremanPhone","shift","startDate","goodThrough","startTime","endTime","description","equipment","workers","paperwork","jha","permitDocs","reviewer","notes"];
    fields.forEach(k=>p[k]=F[k]); p.answers={...F.answers};
    audit(p,"Permit updated by contractor","Resubmitted after Needs Update.");
    if(status==="Submitted") setStatus(p,"Under Review","Updated information provided — back with Jacobs.");
  } else {
    p={ id:uid(), ...F }; delete p.step; delete p.editingId;
    p.submittedBy=currentActor(); p.createdAt=new Date().toISOString();
    p.status = status==="Submitted" ? "Under Review" : status; // one step: submit lands straight in Jacobs review
    p.audit=[];
    p.number = p.number || nextPermitNumber(F.building,F.typeCode);
    audit(p, status==="Draft"?"Draft created":"Permit request created","");
    if(status==="Submitted"){ p.submittedAt=new Date().toISOString(); audit(p,"Status: Submitted → Under Review","Sent straight to Jacobs for review."); }
    DB.permits.unshift(p);
  }
  saveDB(); return p;
}
function submitForm(){
  for(let s=1;s<=5;s++){ F.step=s; const errs=validateStep();
    if(errs.length){ go("form",s); setTimeout(()=>{const b=document.getElementById("errBox"); if(b){b.style.display="block"; b.innerHTML="Please complete: "+errs.map(esc).join(" · ");}},30); window.scrollTo(0,0); return; } }
  const p=persistForm("Submitted");
  registerNewCompany(p.company, p.requestedBy);   // auto-add a typed-in company for admin follow-up
  if(!p.submittedAt){ p.submittedAt=new Date().toISOString(); saveDB(); }
  // companion permits — same task, same info, each with its own number
  if(F.needLinked==="Yes"&&F.linkedTypes.length){
    p.groupId=p.id;
    F.linkedTypes.forEach(code=>{
      const c=JSON.parse(JSON.stringify(p));
      c.id=uid(); c.typeCode=code; c.answers={}; c.groupId=p.id;
      c.number=nextPermitNumber(p.building,code);
      c.audit=[{at:new Date().toISOString(),by:currentActor(),role:ROLE,action:"Companion permit created",

        {at:new Date().toISOString(),by:currentActor(),role:ROLE,action:"Status: Submitted → Under Review",detail:"Sent straight to Jacobs for review."}];
      DB.permits.unshift(c);
    });
    audit(p,"Linked permits created",F.linkedTypes.map(code=>typeOf(code).name).join(", "));
    saveDB();
  }
  if(DB.settings.alerts&&"Notification" in window&&Notification.permission==="granted")
    new Notification("📥 New permit "+p.number,{body:typeOf(p.typeCode).name+" · "+p.company+" · for "+p.reviewer,tag:p.id});

}

function trackerHtml(p){
  if(DEAD.includes(p.status)){
    return `<div class="tracker dead">${TRACK.map((s,i)=>`${i?'<div class="tk-line"></div>':""}<div class="tk"><div class="cir">✕</div><span>${T(s)}</span></div>`).join("")}</div>
    <div class="center" style="margin-bottom:10px">${badge(p.status)}</div>`;
  }
  const idx=stageOf(p.status);
  const doneAll=p.status==="Completed";
  return `<div class="tracker">${TRACK.map((s,i)=>{
    const done=i<idx||(doneAll&&i<=idx), now=i===idx&&!doneAll;
    return `${i?`<div class="tk-line ${i<=idx?"done":""}"></div>`:""}
      <div class="tk ${done?"done":""} ${now?"now":""}">
      <div class="cir">${done?"✓":i+1}</div><span>${T(s)}</span></div>`;
  }).join("")}</div>
  ${p.status==="Needs Update"?`<div class="center" style="margin-bottom:8px">${badge("Needs Update")}</div>`:""}`;
}

let DASH_SEL="today", DASH_Da=today(), DASH_Db=today();
function dashShow(f){ DASH_SEL=f; route();
  setTimeout(()=>document.getElementById("histAnchor")?.scrollIntoView({behavior:"smooth",block:"start"}),80); }
function renderDashHist(){
  let list,title;
  if(DASH_SEL==="today"){ list=DB.permits.slice(); title="everything submitted (any current status)"; }
  else if(DASH_SEL==="DEAD"){ list=DB.permits.filter(p=>["Rejected","Void","Lost"].includes(p.status)); title="Rejected / Void / Lost"; }
  else { list=DB.permits.filter(p=>p.status===DASH_SEL); title=DASH_SEL; }
  // day or range — a week, a month, whatever; "All days" clears it
  if(DASH_Da||DASH_Db) list=list.filter(p=>inRange(p.submittedAt,DASH_Da,DASH_Db)||inRange(p.startDate+"T",DASH_Da,DASH_Db));
  const tt=document.getElementById("histTitle"); if(tt) tt.textContent=title+" ("+list.length+") — "+rangeLbl(DASH_Da,DASH_Db);
  const tb=document.getElementById("histBody"); if(!tb) return;
  tb.innerHTML=list.length? list.map(p=>{const x=typeOf(p.typeCode);return `<tr class="${urgCls(p)}">
    <td class="pnum">${esc(p.number)}</td><td>${x.ico} ${esc(x.code)}</td><td>${esc(p.company)}</td>
    <td>${esc(p.building)}</td><td>${esc(p.floor)}</td><td>${fmtDT(p.submittedAt)}</td>
    <td>${esc(p.approvedBy||"—")}</td><td>${p.closedAt?fmtDT(p.closedAt):"—"}</td><td>${badge(p.status)} ${ageChip(p)}</td>
    <td><button class="btn btn-line btn-sm" onclick="go('review','${p.id}')">Open</button></td></tr>`;}).join("")
  : `<tr><td colspan="10" class="empty">No permits in this category yet.</td></tr>`;
}
function dashType(c){ go("status"); setTimeout(()=>{const s=document.getElementById("fT"); if(s){s.value=c;applyStatusFilters();}},50); }
function applyDashFilters(){
  const q=(document.getElementById("dQ")?.value||"").toLowerCase();
  const b=document.getElementById("dB")?.value||"", tp=document.getElementById("dT")?.value||"";
  const co=document.getElementById("dCo")?.value||"", sh=document.getElementById("dSh")?.value||"", rv=document.getElementById("dRv")?.value||"";
  let list=DB.permits.filter(p=>["Submitted","Under Review","Needs Update"].includes(p.status));
  if(b) list=list.filter(p=>p.building===b);
  if(tp) list=list.filter(p=>p.typeCode===tp);
  if(co) list=list.filter(p=>p.company===co);
  if(sh) list=list.filter(p=>p.shift===sh);
  if(rv) list=list.filter(p=>p.reviewer===rv);
  if(q) list=list.filter(p=>[p.number,p.requestedBy,p.location,p.description,p.company].join(" ").toLowerCase().includes(q));
  const tb=document.getElementById("dashBody"); if(!tb) return;
  const r2=+DB.settings.remind2||30, r1=+DB.settings.remind1||15;
  list.sort((a,b)=>ageMin(b)-ageMin(a));
  const nAct=notifyActive();
  tb.innerHTML = list.length? list.map(p=>{const x=typeOf(p.typeCode);const m=ageMin(p);
    const started=escBase(p)&&escBase(p).getTime()<=Date.now();
    const rowCls=nAct&&started&&["Submitted","Under Review"].includes(p.status)?(m>=r2?"row-urgent":m>=r1?"row-warn":""):"";
    return `<tr class="${rowCls}">
    <td>${ageChip(p)||"—"}</td>
    <td class="pnum">${esc(p.number)}</td><td>${x.ico} ${esc(T(x.name))}</td><td>${esc(p.company)}</td>
    <td>${esc(p.building)}</td><td>${esc(p.floor)}${p.area?" · "+esc(p.area):""}</td><td>${esc(p.shift)}</td>
    <td>${fmtDT(p.submittedAt)}</td><td>${esc(p.reviewer)}</td><td>${badge(p.status)}</td>
    <td><button class="btn btn-b btn-sm" onclick="go('review','${p.id}')">Review</button></td></tr>`;}).join("")
  : `<tr><td colspan="11" class="empty">🎉 Nothing waiting on Jacobs right now.</td></tr>`;
}
function dashBreakdowns(){
  const groups=[["Trade Partner",p=>p.company],["Permit Type",p=>typeOf(p.typeCode).name],["Building",p=>bldOf(p.building).name],["Floor",p=>p.floor],["Shift",p=>p.shift],["Jacobs Reviewer",p=>p.reviewer]];
  const open=DB.permits.filter(p=>OPEN_STATUSES.includes(p.status));
  return groups.map(([label,fn])=>{
    const m={}; open.forEach(p=>{const k=fn(p)||"—"; m[k]=(m[k]||0)+1;});
    const items=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8);
    return `<div style="margin-bottom:10px"><b style="font-size:13px">${label}:</b> ${items.length?items.map(([k,v])=>`<span class="tag">${esc(k)} · ${v}</span>`).join(""):'<span class="tag">no open permits</span>'}</div>`;
  }).join("");
}

function grabReview(p){
  p.paperworkSubmitted=document.getElementById("rvPS")?.value||p.paperworkSubmitted;
  p.paperworkApproved=document.getElementById("rvPA")?.value||p.paperworkApproved;
  p.reviewComments=document.getElementById("rvC")?.value??p.reviewComments;
  p.approvalConditions=document.getElementById("rvCond")?.value??p.approvalConditions;
}
function rerenderReview(){ window._keepScroll=true; route(); }
function saveReviewNotes(id){ const p=DB.permits.find(x=>x.id===id); grabReview(p);
  audit(p,"Review notes saved",""); saveDB(); toast("💾 Review notes saved for <b>"+esc(p.number)+"</b>","t-blue"); rerenderReview(); }
function actStatus(id,st,detail){ const p=DB.permits.find(x=>x.id===id); grabReview(p); setStatus(p,st,detail||"");
  toast((st==="Active"?"🟢":"👀")+" <b>"+esc(p.number)+"</b> is now "+st.toUpperCase(),st==="Active"?"t-green":"t-blue"); rerenderReview(); }
function actApprove(id){
  const p=DB.permits.find(x=>x.id===id); grabReview(p);
  if(["Approved","Active"].includes(p.status)){ toast("Already approved — <b>"+esc(p.number)+"</b> is "+p.status,"t-dark"); return; }
  if(p.paperworkSubmitted!=="Yes"){ if(!confirm("Paperwork is not marked as submitted. Approve anyway?")) return; }
  setStatus(p,"Active",(p.approvalConditions?("Approved & activated. Conditions: "+p.approvalConditions):"Approved & activated — work may proceed."));
  toast("✅ <b>"+esc(p.number)+"</b> APPROVED &amp; ACTIVE — work may proceed. Notify the contractor below.","t-green");
  rerenderReview();
}
function foremanComplete(id){
  const p=DB.permits.find(x=>x.id===id); if(!p) return;
  if(!confirm("Confirm the work on "+p.number+" is finished? This closes the permit.")) return;
  setStatus(p,"Completed","Work finished — marked complete by foreman/requester in the field.");
  toast("🏁 <b>"+esc(p.number)+"</b> "+T("Completed").toUpperCase()+" — "+T("thank you"),"t-blue");
  route();
}
function actNeedsUpdate(id){
  const p=DB.permits.find(x=>x.id===id); grabReview(p);
  if(!p.reviewComments||!p.reviewComments.trim()){ toast("✏️ Enter Review Comments first — tell the contractor exactly what to fix.","t-orange");
    document.getElementById("rvC")?.focus(); return; }
  setStatus(p,"Needs Update","Jacobs: "+p.reviewComments);
  toast("✏️ <b>"+esc(p.number)+"</b> sent back — NEEDS UPDATE","t-orange"); rerenderReview();
}
function actComplete(id){
  if(!confirm("Mark this permit as Completed? This closes the permit.")) return;
  const p=DB.permits.find(x=>x.id===id); grabReview(p); setStatus(p,"Completed","Work complete — permit closed.");
  toast("🏁 <b>"+esc(p.number)+"</b> COMPLETED — permit closed","t-blue"); rerenderReview();
}
function actReason(id,st,label){
  const r=prompt(label); if(r===null) return;
  if(!r.trim()){ toast("A reason is required.","t-red"); return; }
  const p=DB.permits.find(x=>x.id===id); grabReview(p);
  if(st==="Rejected") p.rejectReason=r;
  setStatus(p,st,r);
  toast((st==="Rejected"?"❌":st==="Void"?"⛔":"⚠️")+" <b>"+esc(p.number)+"</b> marked "+st.toUpperCase(),"t-red"); rerenderReview();
}

/* ---- SIMOPS: other work in the same area, same dates ---- */
function simopsPanel(p){
  if(DEAD.includes(p.status)||p.status==="Completed") return "";
  const overlap=DB.permits.filter(o=>o.id!==p.id && o.building===p.building && o.floor===p.floor
    && OPEN_STATUSES.includes(o.status)
    && o.startDate&&p.startDate && o.startDate<=p.goodThrough && o.goodThrough>=p.startDate);
  if(!overlap.length) return `<div class="pill-hint">🗺️ SIMOPS check: no other open permits on ${esc(bldOf(p.building).name)} · ${esc(p.floor)} for these dates.</div>`;
  const risky=overlap.some(o=>typeOf(o.typeCode).hr)||typeOf(p.typeCode).hr;
  return `<div class="card" style="border:2px solid ${risky?"var(--red)":"var(--orange)"}">
    <div class="section-t">${risky?"🚨":"⚠️"} SIMOPS Check — other work in this area, same dates</div>
    <p style="font-size:14px;margin-bottom:10px">${overlap.length} other open permit${overlap.length>1?"s":""} on <b>${esc(bldOf(p.building).name)} · ${esc(p.floor)}</b> overlapping these dates. Confirm the activities are compatible before approving${risky?" — <b style='color:var(--red)'>high-risk combination present</b>":""}.</p>
    ${overlap.map(o=>{const x=typeOf(o.typeCode);return `
      <div class="list-row"><div class="grow"><b>${x.ico} <span class="pnum">${esc(o.number)}</span> — ${esc(x.name)}${x.hr?' <span class="tag" style="background:#fde2e0;color:#b3140a">HIGH-RISK</span>':""}</b>
      <small>${esc(o.company)} · ${esc(o.description||"")} · ${fmtD(o.startDate)} → ${fmtD(o.goodThrough)} · ${badge(o.status)}</small></div>
      <button class="btn btn-line btn-sm" onclick="go('review','${o.id}')">Open</button></div>`;}).join("")}
  </div>`;
}

    <span class="daterange"><span class="dr-lbl">📅 From</span><input class="f-in datein" id="bDa" type="date" onchange="applyBoardFilters()" title="From date"><span class="dr-arrow">→</span><span class="dr-lbl">To</span><input class="f-in datein" id="bDb" type="date" onchange="applyBoardFilters()" title="To date"><button class="btn btn-line btn-sm" onclick="document.getElementById('bDa').value='';document.getElementById('bDb').value='';applyBoardFilters()">Clear</button></span>
  </div>
  <div id="boardHost"></div>`;

function applyBoardFilters(){
  const t=today();
  const g=document.getElementById("bG")?.value||"";
  const st=document.getElementById("bSt")?.value||"";
  let list=DB.permits.slice();
  if(ROLE==="safety") list=list.filter(p=>p.company===MYCO); // safety managers see ONLY their own company
  if(st==="LIVE") list=list.filter(p=>["Approved","Active"].includes(p.status)&&(!p.goodThrough||p.goodThrough>=t));
  else if(st) list=list.filter(p=>p.status===st);
  const f=(id,fn)=>{const v=document.getElementById(id)?.value||""; if(v) list=list.filter(p=>fn(p)===v);};
  f("bB",p=>p.building); f("bF",p=>p.floor); f("bCo",p=>p.company); f("bT",p=>p.typeCode); f("bSh",p=>p.shift);
  const da=document.getElementById("bDa")?.value||"", db=document.getElementById("bDb")?.value||"";
  if(da||db) list=list.filter(p=>inRange(p.startDate, da, db));   // date range — From-only = that day onward, To-only = up to that day
  const host=document.getElementById("boardHost"); if(!host) return;
  if(!list.length){ host.innerHTML=`<div class="empty"><div class="big-icon">📋</div>No permits match these filters.</div>`; return; }
  const rows=l=>`<div class="tblwrap"><table class="tbl"><thead><tr>
    <th>Permit #</th><th>Type</th><th>Trade Partner</th><th>Bldg</th><th>Floor / Area</th><th>Shift</th><th>Start</th><th>Good Through</th><th>Reviewer</th><th>Status</th><th></th></tr></thead>
    <tbody>${l.map(p=>{const x=typeOf(p.typeCode);return `<tr class="${urgCls(p)}">
      <td class="pnum">${esc(p.number)}</td><td>${x.ico} ${esc(T(x.name))}</td><td>${esc(p.company)}</td>
      <td>${esc(p.building)}</td><td>${esc(p.floor)}${p.area?" · "+esc(p.area):""}</td><td>${esc(p.shift)}</td>
      <td>${fmtD(p.startDate)}</td><td>${fmtD(p.goodThrough)}</td><td>${esc(p.reviewer)}</td><td>${badge(p.status)} ${ageChip(p)}</td>
      <td><button class="btn ${urgCls(p)==="row-urgent"?"btn-r":"btn-line"} btn-sm" onclick="go('${ROLE==="jacobs"||ROLE==="admin"?"review":"view"}','${p.id}')">View</button></td></tr>`;}).join("")}</tbody></table></div>`;
  if(!g){ host.innerHTML=rows(list); return; }
  const keyFn={building:p=>bldOf(p.building).name,floor:p=>p.floor,type:p=>typeOf(p.typeCode).name,company:p=>p.company}[g];
  const m={}; list.forEach(p=>{const k=keyFn(p)||"—";(m[k]=m[k]||[]).push(p);});
  host.innerHTML=Object.keys(m).sort().map(k=>`<div class="grp-h">${esc(k)} — ${m[k].length} permit${m[k].length>1?"s":""}</div>${rows(m[k])}`).join("");
}

let PF_IMG={};
function pfLoadImg(key,input){
  const file=input.files&&input.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=e=>{ const img=new Image(); img.onload=()=>{
    const maxW=1500; let w=img.width,h=img.height; if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(img,0,0,w,h);
    PF_IMG[key]=cv.toDataURL("image/jpeg",0.72);
    const prev=document.getElementById("pfimg_prev_"+key);
    if(prev){ const im=document.createElement("img"); im.src=PF_IMG[key]; im.className="pf-preview"; im.id="pfimg_prev_"+key; prev.replaceWith(im); }
    const rm=document.getElementById("pfimg_rm_"+key); if(rm) rm.style.display="";
  }; img.src=e.target.result; };
  rd.readAsDataURL(file);
}
function pfClearImg(key){ PF_IMG[key]=""; const prev=document.getElementById("pfimg_prev_"+key);
  if(prev){ const dv=document.createElement("div"); dv.className="pf-preview empty"; dv.id="pfimg_prev_"+key; dv.textContent=T("No drawing yet"); prev.replaceWith(dv); }
  const rm=document.getElementById("pfimg_rm_"+key); if(rm) rm.style.display="none";
  const inp=document.getElementById("pf_"+key); if(inp) inp.value="";
}
function promptFields(title,fields,cb){

  modal(`<h3>${esc(title)}</h3>${fields.map(f=>`<div class="f-group"><label class="f-label">${esc(f.label)}</label>

    :f.type==="select"?(()=>{ const opts=(f.opts||[]).slice(); if(f.value&&opts.indexOf(f.value)<0) opts.unshift(f.value);
        return `<select class="f-in" id="pf_${f.key}"><option value="">${esc(f.placeholder||"— none —")}</option>${opts.map(o=>`<option ${f.value===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`; })()

    :f.type==="toggle"?`<label class="switch"><input type="checkbox" id="pf_${f.key}" ${f.value?"checked":""}><span class="sl"></span><span class="switch-tx" id="pf_txt_${f.key}">${f.value?esc(f.onLabel||T("On")):esc(f.offLabel||T("Off"))}</span></label>`
    :f.type==="image"?`<div id="pfimg_wrap_${f.key}">

        <input type="file" accept="image/*" class="f-in" id="pf_${f.key}" onchange="pfLoadImg('${f.key}',this)" style="padding:8px">

    ${f.hint?`<div class="hint">${f.hint}</div>`:""}</div>`).join("")}

    <div class="hint center" style="margin-top:8px">Press <b>Enter</b> to save.</div>`);

function saveBuildingEditor(i){
  const name=document.getElementById("bld_name").value.trim();
  const code=document.getElementById("bld_code").value.trim().toUpperCase();
  if(!name||!code){ alert(T("A building needs a name and a code.")); return; }
  const snap = ROLE==="admin" ? configSnapshot() : "";
  const data={ name, code, floorLeadsOn:document.getElementById("bld_flo").checked, cm:document.getElementById("bld_cm").value, lead:document.getElementById("bld_lead").value,
    gsOverride:document.getElementById("bld_gsov").checked,
    escalateGS:document.getElementById("bld_escgs").checked, escalateCM:document.getElementById("bld_esccm").checked,
    weekendLeadSat:document.getElementById("bld_sat").value, weekendLeadSun:document.getElementById("bld_sun").value,
    safLead:document.getElementById("bld_safn").value.trim(), safPhone:document.getElementById("bld_safp").value.trim(), safEmail:document.getElementById("bld_safe").value.trim() };
  let b, oldCode=null;
  if(i!=null){ b=DB.buildings[i]; oldCode=b.code; Object.assign(b,data); }
  else { b=Object.assign({active:true},data); DB.buildings.push(b); }
  if(oldCode&&oldCode!==code) DB.floors.forEach(f=>{ if(f.b===oldCode) f.b=code; });   // keep levels linked if code renamed
  // rebuild this building's floors in the EXACT order shown in the editor (so reordering sticks)
  const levels=BLD_LEVELS.filter(lv=>lv&&lv.name&&lv.name.trim());
  const others=DB.floors.filter(f=>f.b!==code);
  const rebuilt=levels.map(lv=>{ const nm=lv.name.trim(); const areas=lv.areas?lv.areas.split("\n").map(s=>s.trim()).filter(Boolean):[];
    const f=DB.floors.find(x=>x.b===code&&x.name===nm);
    if(f){ f.lead=lv.lead||""; f.plan=lv.plan||""; f.areas=areas; f.active=true; return f; }
    return {id:uid(), b:code, name:nm, lead:lv.lead||"", plan:lv.plan||"", areas, active:true};
  });
  DB.floors=others.concat(rebuilt);
  closeModal();
  if(ROLE==="admin") logChange(i!=null?"Edit Building":"Add Building", name, snap);
  saveDB(); route();
}

function restoreJSON(inp){

}

  </div>
  <div id="eqList"></div>`;
};
function applyEqSearch(){
  const host=document.getElementById("eqList"); if(!host) return;
  const q=(document.getElementById("eqQ")?.value||"").trim().toLowerCase();
  const co=document.getElementById("eqCo")?.value||"", tp=document.getElementById("eqT")?.value||"", st=document.getElementById("eqS")?.value||"";
  let list=(DB.equipment||[]).slice();
  if(co) list=list.filter(e=>e.company===co);
  if(tp) list=list.filter(e=>e.type===tp);
  if(st) list=list.filter(e=>e.status===st);
  if(q) list=list.filter(e=>[e.serial,e.name,e.company,e.responsible,e.type,e.location].join(" ").toLowerCase().includes(q));
  // exact serial match floats to top with a FOUND flash
  list.sort((a,b)=>{
    const am=q&&(a.serial||"").toLowerCase()===q?-1:0, bm=q&&(b.serial||"").toLowerCase()===q?-1:0;
    return am-bm || (a.company||"").localeCompare(b.company||"");
  });
  if(!list.length){
    host.innerHTML=`<div class="empty"><div class="big-icon">🛰️</div>${q?T("No match — that serial isn't registered yet. Add it so next time it takes 5 seconds."):T("No equipment registered yet. Tap + Add Equipment to start the registry.")}</div>`;
    return;
  }
  host.innerHTML=list.map(e=>{
    const hit=q&&(e.serial||"").toLowerCase()===q;
    const dd=e.inspDue? Math.ceil((new Date(e.inspDue+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000) : null;
    const od=dd!==null&&dd<0;
    const inspHtml = dd===null? "—"
      : od? `<span style="color:var(--red);font-weight:800">${fmtD(e.inspDue)} ⚠ ${T("OVERDUE")}</span>`
      : dd<=15? `<span style="color:var(--orange);font-weight:800">${fmtD(e.inspDue)} · ${T("due in")} ${dd} ${T("days")}</span>`
      : dd<=30? `<span style="color:#8a6400;font-weight:800">${fmtD(e.inspDue)} · ${T("due in")} ${dd} ${T("days")}</span>`
      : fmtD(e.inspDue);
    return `<div class="pcard eq-card ${hit?"eq-hit":""}">
      ${hit?`<div class="eq-found">✔ ${T("FOUND — this is your machine")}</div>`:""}
      <div class="top">
        <div style="display:flex;align-items:center;gap:10px"><span style="font-size:24px">${eqIco(e.type)}</span>
          <div><b style="font-size:16px">${esc(e.name||e.type)}</b>
          <div style="font-size:13px;color:var(--muted);font-weight:700">${esc(e.type)} · <span class="pnum">SN ${esc(e.serial)}</span></div></div></div>
        <span class="badge ${e.status==="Out of Service"?"st-Rejected":"st-Active"}">${esc(T(e.status||"In Service"))}</span>
      </div>
      <div class="meta">
        <div>${T("Belongs to")}: <b>${esc(e.company)}</b></div>
        <div>${T("Responsible")}: <b>${esc(e.responsible||"—")}</b></div>
        <div>${T("Location")}: <b>${esc(e.location||"—")}</b></div>
        <div>${T("Inspection due")}: <b>${inspHtml}</b></div>
      </div>
      <div class="btnrow" style="margin-top:12px">
        ${e.phone?`<a class="btn btn-dark btn-sm" href="tel:${esc(e.phone)}">📞 ${T("Call")} ${esc(e.responsible||e.company)}</a>`:""}
        ${e.phone?`<a class="btn btn-line btn-sm" href="${smsHref(e.phone,T("Your equipment needs to be moved")+": "+(e.name||e.type)+" (SN "+e.serial+") — "+(e.location||""))}">📱 ${T("Text: please move it")}</a>`:""}
        <button class="btn btn-line btn-sm" onclick="eqTag('${e.id}')">🏷️ ${T("QR Tag")}</button>
        ${canEditEq(e)?`<button class="btn btn-line btn-sm" onclick="eqEdit('${e.id}')">Edit</button>
        <button class="btn btn-line btn-sm btn-cancel" onclick="eqDel('${e.id}')">Delete</button>`:""}
      </div>
    </div>`;
  }).join("");
}
const EQ_FIELDS=e=>[
  {key:"type",label:"Equipment Type",type:"combo",opts:EQUIP_TYPES.map(t=>t[0]),value:e?.type,hint:"Pick from the list or type your own."},
  {key:"name",label:"Make / Model (e.g., Genie GS-1930)",value:e?.name},
  {key:"serial",label:"Serial Number",value:e?.serial,hint:"The number on the machine's plate or sticker — this is how people will find it."},
  {key:"company",label:"Trade Partner (owner)",type:"combo",opts:DB.contractors.map(c=>c.name),value:e?.company||((ROLE==="contractor"||ROLE==="safety")?MYCO:""),hint:"Start typing — your company will appear; or type a new one."},
  {key:"responsible",label:"Person Responsible",value:e?.responsible},
  {key:"phone",label:"Their Cell Phone",value:e?.phone},
  {key:"location",label:"Usual Location (building / floor / area)",value:e?.location},
  {key:"status",label:"Status",type:"select",opts:["In Service","Out of Service"],value:e?.status||"In Service"},
  {key:"inspDue",label:"Next Inspection Due (optional)",type:"date",value:e?.inspDue,hint:"Tap to pick from the calendar. The card turns yellow 30 days out, orange 15 days out, red when overdue."},
  {key:"notes",label:"Notes",type:"textarea",value:e?.notes}];
function eqTouch(){ DB.cfgU=Date.now(); }
function eqAdd(){
  promptFields("Add Equipment",EQ_FIELDS(),o=>{
    if(!o.serial||!o.company){ toast("Serial number and trade partner are required.","t-red"); return; }
    const dup=(DB.equipment||[]).find(x=>x.serial.toLowerCase()===o.serial.toLowerCase());
    if(dup){ toast("⚠ SN "+esc(o.serial)+" is already registered to "+esc(dup.company)+".","t-orange"); return; }
    DB.equipment.push({id:uid(),...o,addedBy:currentActor(),addedAt:new Date().toISOString()});
    eqTouch(); toast("🏗️ "+esc(o.name||o.type)+" (SN "+esc(o.serial)+") registered for "+esc(o.company),"t-green");
  });
}
function eqEdit(id){
  const e=DB.equipment.find(x=>x.id===id); if(!e||!canEditEq(e)) return;
  promptFields("Edit Equipment — SN "+e.serial,EQ_FIELDS(e),o=>{
    if(o.inspDue!==e.inspDue){ delete e.n30; delete e.n15; delete e.nOD; } // new date → reminders re-arm
    Object.assign(e,o); eqTouch();
  });
}
function eqDel(id){
  const e=DB.equipment.find(x=>x.id===id); if(!e||!canEditEq(e)) return;
  if(!confirm("Remove "+(e.name||e.type)+" (SN "+e.serial+") from the registry?")) return;
  DB.equipment=DB.equipment.filter(x=>x.id!==id);
  eqTouch(); if(ROLE==="admin") logChange("Equipment removed: SN "+e.serial,e.company);
  saveDB(); route();
}
function eqTag(id){
  const e=DB.equipment.find(x=>x.id===id); if(!e) return;
  const co=DB.contractors.find(c=>c.name===e.company)||{};
  const base=location.origin==="null"||location.protocol==="file:"? location.href.split("#")[0].split("?")[0] : location.origin+location.pathname;
  const url=base+"?eq="+encodeURIComponent(e.serial)+"#/equipment";
  modal(`<h3 style="display:flex;justify-content:space-between;align-items:center">🏷️ ${T("Equipment QR Tag")}
    <button class="btn btn-line btn-sm" onclick="closeModal()">✕</button></h3>

      <div style="font-size:14px;font-weight:800;margin-bottom:6px">${esc(e.company)}</div>

        <div><b>1. ${T("Person Responsible")}:</b> ${esc(e.responsible||"—")}${e.phone?" · 📞 "+esc(e.phone):""}</div>
        <div><b>2. ${T("Safety Manager")}:</b> ${co.safName?esc(co.safName)+(co.safPhone?" · 📞 "+esc(co.safPhone):""):"— <span style='color:var(--orange)'>("+T("add one in Admin → Trade Partners")+")</span>"}</div>
      </div>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=340x340&data=${encodeURIComponent(url)}" alt="QR" style="width:210px;height:210px;display:block;margin:8px auto 4px">
      <div class="lnk">${T("Scan to see who owns this machine")}</div>
    </div>
    <div class="warn-hint noprint" style="font-size:12px;margin-top:8px">📋 ${T("Heads up: the phone numbers above print on the sticker and will be visible to anyone near the machine. Use work cell numbers.")}</div>
    <div class="btnrow"><button class="btn btn-dark" onclick="window.print()">🖨️ ${T("Print sticker")}</button></div>`);
}

let REPORT_LIST=[];
function reportFilter(){
  let list=DB.permits.slice().filter(p=>p.status!=="Draft"||true);
  const v=id=>document.getElementById(id)?.value||"";
  if(v("rFrom")) list=list.filter(p=>(p.startDate||"")>=v("rFrom"));
  if(v("rTo")) list=list.filter(p=>(p.startDate||"")<=v("rTo"));
  if(v("rB")) list=list.filter(p=>p.building===v("rB"));
  if(v("rCo")) list=list.filter(p=>p.company===v("rCo"));
  if(v("rT")) list=list.filter(p=>p.typeCode===v("rT"));
  if(v("rS")) list=list.filter(p=>p.status===v("rS"));
  if(v("rSh")) list=list.filter(p=>p.shift===v("rSh"));
  if(v("rRv")) list=list.filter(p=>p.reviewer===v("rRv"));
  return list;
}
function applyReport(){
  const list=REPORT_LIST=reportFilter();
  const cnt=s=>list.filter(p=>p.status===s).length;
  const typeCount={}; list.forEach(p=>typeCount[p.typeCode]=(typeCount[p.typeCode]||0)+1);

}

/* ============================================================
   LIVE CLOUD SYNC — every device sees the same permits
   (Supabase REST; localStorage stays as the offline cache)
   ============================================================ */
const CLOUD={ url:"https://ltjvpodpdlmwvjmwuygm.supabase.co", key:"sb_publishable_DiH5dXOI8BpuPIvtClmZhg_ZDZjVTi3",
  portalKey:"ppp_AqooN2cKftT9KxzpSg1Y0RDmolFaQRJB" }; // row-level security gate — DB rejects requests without it
const cloudOn=()=> CLOUD.url.startsWith("https://");
const sbH=()=>({apikey:CLOUD.key,Authorization:"Bearer "+CLOUD.key,"x-portal-key":CLOUD.portalKey,"Content-Type":"application/json"});
let lastPush=+(localStorage.getItem("ppp_lastpush")||0);
let SYNC_STATE=cloudOn()?"sync":"off";
let syncTimer=null, syncBusy=false;
function scheduleSync(){ if(!cloudOn()) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(), 1200); }
function updateSyncBadge(){
  const el=document.getElementById("syncBadge"); if(!el) return;
  el.innerHTML = SYNC_STATE==="ok" ? '<span style="color:var(--green)">🟢 Live — synced across all devices</span>'
    : SYNC_STATE==="sync" ? '⏳ Syncing…'
    : SYNC_STATE==="err" ? '<span style="color:var(--red)">🔴 Sync issue — retrying (changes saved on this device)</span>'
    : '⚪ Offline mode — data saved on this device only';
}
function mergeLogs(a,b,cap){
  const seen=new Set(), out=[];
  [...(a||[]),...(b||[])].forEach(e=>{ const k=JSON.stringify([e.at,e.action||e.role,e.name||e.by]); if(!seen.has(k)){seen.add(k);out.push(e);} });
  out.sort((x,y)=> (y.at||"").localeCompare(x.at||""));
  return out.slice(0,cap);
}
async function syncPush(){
  const rows=[
    ...DB.permits.filter(p=>(p._u||0)>lastPush).map(p=>({id:p.id,updated:p._u||Date.now(),deleted:false,data:p})),
    ...DB.trash.filter(p=>(p._u||0)>lastPush).map(p=>({id:p.id,updated:p._u||Date.now(),deleted:true,data:p}))
  ];
  if(rows.length){
    const r=await fetch(CLOUD.url+"/rest/v1/permits",{method:"POST",
      headers:{...sbH(),Prefer:"resolution=merge-duplicates"},body:JSON.stringify(rows)});
    if(!r.ok) throw new Error("push "+r.status);
  }
  if((DB.cfgU||0)>lastPush){
    const cfg={cfg:JSON.parse(configSnapshot()),counters:DB.counters,accessLog:DB.accessLog.slice(0,300),adminLog:DB.adminLog};
    const r=await fetch(CLOUD.url+"/rest/v1/portal_config",{method:"POST",
      headers:{...sbH(),Prefer:"resolution=merge-duplicates"},body:JSON.stringify([{id:1,updated:DB.cfgU,data:cfg}])});
    if(!r.ok) throw new Error("cfg push "+r.status);
  }
  lastPush=Date.now(); localStorage.setItem("ppp_lastpush",String(lastPush));
}
async function syncPull(){
  const r=await fetch(CLOUD.url+"/rest/v1/permits?select=id,updated,deleted,data",{headers:sbH()});
  if(!r.ok) throw new Error("pull "+r.status);
  const rows=await r.json();
  let changed=false;
  rows.forEach(row=>{
    const lu=(DB.permits.find(p=>p.id===row.id)?._u)||(DB.trash.find(p=>p.id===row.id)?._u)||0;
    if((row.updated||0)>lu){
      changed=true;
      DB.permits=DB.permits.filter(p=>p.id!==row.id);
      DB.trash=DB.trash.filter(p=>p.id!==row.id);
      if(row.deleted) DB.trash.unshift(row.data); else DB.permits.unshift(row.data);
    }
  });
  const rc=await fetch(CLOUD.url+"/rest/v1/portal_config?select=updated,data&id=eq.1",{headers:sbH()});
  if(rc.ok){
    const cfgRow=(await rc.json())[0];
    if(cfgRow&&(cfgRow.updated||0)>(DB.cfgU||0)){
      changed=true;
      const c=cfgRow.data||{};
      if(c.cfg){ Object.assign(DB,{buildings:c.cfg.buildings,floors:c.cfg.floors,contractors:c.cfg.contractors,
        permitTypes:c.cfg.permitTypes,reviewers:c.cfg.reviewers,permitDocs:c.cfg.permitDocs,safetyUsers:c.cfg.safetyUsers||[],
        equipment:c.cfg.equipment||DB.equipment||[]});
        DB.settings={...DB.settings,...c.cfg.settings}; }
      Object.entries(c.counters||{}).forEach(([k,v])=>{ DB.counters[k]=Math.max(DB.counters[k]||0,v); });
      DB.accessLog=mergeLogs(DB.accessLog,c.accessLog,500);
      DB.adminLog=mergeLogs(DB.adminLog,c.adminLog,40);
      DB.cfgU=cfgRow.updated;
    }
  }
  if(changed){
    saveDBLocal();
    // refresh the screen unless the user is mid-form or has a pop-up open
    if(!F&&!document.querySelector(".modal-bk")){ window._keepScroll=true; route(); }
  }
}
async function syncNow(){
  if(!cloudOn()||syncBusy) return;
  syncBusy=true; SYNC_STATE="sync"; updateSyncBadge();
  try{ await syncPull(); await syncPush(); SYNC_STATE="ok"; }
  catch(e){ SYNC_STATE="err"; }
  syncBusy=false; updateSyncBadge();
}
async function cloudDeleteRow(id){
  if(!cloudOn()) return;
  try{ await fetch(CLOUD.url+"/rest/v1/permits?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:sbH()}); }catch(e){}
}

function showIntro(){

    `${T("WE BUILD")} <em>${T("TOGETHER")}</em>.`,

  d.innerHTML=`${SKYLINE_SVG("intro-sky","rgba(255,184,28,.55)")}
    ${words.map((w,i)=>`<div class="intro-word" id="iw${i}">${w}</div>`).join("")}

}
