<style>
:root{
  --navy:#0c1524; --navy2:#132238; --charcoal:#22303f;
  --yellow:#ffb81c; --yellow-d:#e6a400;
  --green:#12762f; --green-d:#0f6f32;   /* darkened to clear WCAG AA 4.5:1 on light backgrounds */
  --blue:#1a73e8; --blue-d:#174ea6;
  --orange:#e8710a; --red:#d93025; --gray:#8a94a0; --gray-l:#e9edf2;
  --bg:#eef1f6; --card:#ffffff; --text:#141d29; --muted:#5b6773;
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-pill:99px;
  --radius:18px;
  --shadow:0 1px 2px rgba(13,22,38,.05),0 6px 18px rgba(13,22,38,.07);
  --shadow-lg:0 2px 4px rgba(13,22,38,.06),0 14px 40px rgba(13,22,38,.13);
  --gold-grad:linear-gradient(135deg,#ffc94a,#ffb81c 55%,#f0a500);
  --navy-grad:linear-gradient(160deg,#16263f 0%,#0c1524 70%);
  --body2:#44505c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:
  radial-gradient(1200px 500px at 85% -10%, #dfe7f3 0%, transparent 60%),
  radial-gradient(900px 420px at -10% 0%, #e8ecf5 0%, transparent 55%),
  var(--bg);
  color:var(--text);font-size:16px;line-height:1.45;min-height:100vh;font-feature-settings:"cv02","cv03"}
::selection{background:#ffb81c55}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:var(--blue);text-decoration:none}

/* ===== Header ===== */
header{background:var(--navy-grad);color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 20px rgba(4,10,20,.35);border-bottom:1px solid rgba(255,184,28,.28)}
.hdr-in{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:11px;cursor:pointer}
.logo{padding:5px 10px 5px 5px;border-radius:var(--r-lg);transition:background .15s}
.logo:hover{background:rgba(255,255,255,.07)}
.logo-badge{width:40px;height:40px;border-radius:var(--r-md);background:var(--gold-grad);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;letter-spacing:-.5px;flex:none;box-shadow:0 3px 10px rgba(255,184,28,.35),inset 0 1px 0 rgba(255,255,255,.45);position:relative}
.logo-badge::before{content:"";position:absolute;inset:-4px;border-radius:var(--r-lg);overflow:hidden;padding:2px;
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  background:conic-gradient(from 0deg, transparent 0 78%, #9dffc4 90%, transparent 100%);
  animation:logoOrbit 3s linear infinite}
@keyframes logoOrbit{to{transform:rotate(360deg)}}
.logo-badge::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#35e07c;box-shadow:0 0 8px #35e07c;animation:agePulse 1.8s infinite}
/* header safety motto */
.hdr-motto-wrap{display:flex;justify-content:center;align-items:center;min-width:0}
.hdr-motto{text-align:center;line-height:1.25;padding:0 10px}
.hdr-motto b{display:block;font-size:11px;letter-spacing:1.6px;color:var(--yellow);font-weight:900;white-space:nowrap}
.hdr-motto span{display:block;font-size:11px;color:#9fb0c6;font-weight:600;letter-spacing:.4px;white-space:nowrap}
@media(max-width:1120px){.hdr-motto{display:none}}
/* hero personalized welcome */
.hero-welcome{position:absolute;top:20px;right:22px;z-index:4;max-width:290px;text-align:right;background:rgba(255,255,255,.06);border:1px solid rgba(255,184,28,.3);border-radius:var(--r-lg);padding:9px 14px;backdrop-filter:blur(6px)}
.hero-welcome{font-size:13px;color:#e8eef7;font-weight:700}
.hero-welcome b{color:var(--yellow)}
.hero-welcome span{display:block;font-size:12px;color:#b9c5d6;font-weight:600;margin-top:2px}
@media(max-width:700px){.hero-welcome{position:static;max-width:none;text-align:left;margin-bottom:14px}}
/* glowing how-to button */
.howto-btn{position:relative;display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#27a04a,#0f6f32);color:#fff;font-weight:800;font-size:16px;border:none;border-radius:var(--r-lg);padding:15px 30px;min-height:52px;cursor:pointer;box-shadow:0 6px 20px rgba(30,142,62,.35);transition:transform .1s}
.howto-btn:hover{transform:translateY(-1px)}
.howto-ring{position:absolute;inset:-4px;border-radius:var(--r-xl);padding:3px;overflow:hidden;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0)}
.howto-ring::before{content:"";position:absolute;inset:-60%;background:conic-gradient(transparent 0 72%, #9dffc4 86%, transparent 100%);animation:logoOrbit 2.4s linear infinite}
@media (prefers-reduced-motion: reduce){.howto-ring::before,.logo-badge::before,.logo-badge::after{animation:none}}
.logo h1{font-size:18px;font-weight:800;line-height:1.15;letter-spacing:-.2px}
.logo small{display:block;font-size:11px;font-weight:600;color:#9fb0c6;letter-spacing:1.6px;text-transform:uppercase;margin-top:1px}
.hdr-sp{flex:1}
.rolewrap{display:flex;align-items:center;gap:8px}
.themebtn{background:var(--navy2);border:1px solid #2c3e57;border-radius:99px;width:44px;height:44px;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:filter .15s}
.themebtn:hover{filter:brightness(1.3)}
.langwrap{display:flex;gap:0;border:1px solid #2c3e57;border-radius:99px;overflow:hidden}
.langwrap .lang{background:var(--navy2);color:#8fa0b8;border:none;padding:0 14px;min-height:44px;font-size:13px;font-weight:800;letter-spacing:.5px}
.langwrap .lang.on{background:var(--gold-grad);color:var(--navy)}
.rolebtn{background:var(--navy2);color:#cfd8e3;border:1px solid #2c3e57;border-radius:99px;padding:0 16px;min-height:44px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.rolebtn .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow)}
nav.mainnav{background:var(--navy2);border-top:1px solid #24334a}
.nav-in{max-width:1200px;margin:0 auto;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav-in a{color:#aab6c6;padding:12px 15px;font-size:14px;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;transition:color .12s}
.nav-in a.on{color:var(--yellow);border-bottom-color:var(--yellow);background:linear-gradient(180deg,transparent 40%,rgba(255,184,28,.14));font-weight:800}
.nav-in a:hover{color:#fff}
.nav-in a:active{background:rgba(255,255,255,.06)}

/* ===== Layout ===== */
main{max-width:1200px;margin:0 auto;padding:20px 14px 90px;animation:pgIn .28s ease both}
@keyframes pgIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.narrow{max-width:680px;margin:0 auto}
.mid{max-width:860px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px;border:1px solid rgba(19,34,56,.055);transition:box-shadow .18s}
.card.tight{padding:15px 17px}
h2.page{font-size:24px;font-weight:800;margin:4px 0 4px;letter-spacing:-.4px}
p.sub{color:var(--muted);font-size:15px;margin-bottom:16px}
.section-t{font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:4px 0 10px}
hr.div{border:none;border-top:1px solid var(--gray-l);margin:16px 0}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--r-md);font-weight:700;font-size:16px;padding:14px 22px;min-height:52px;transition:transform .08s, filter .15s, box-shadow .18s;text-align:center;letter-spacing:-.1px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn-y{background:var(--gold-grad);color:var(--navy);box-shadow:0 4px 14px rgba(255,184,28,.38),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-y:hover{filter:brightness(1.04);box-shadow:0 7px 20px rgba(255,184,28,.48),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-dark{background:var(--navy-grad);color:#fff;box-shadow:0 4px 14px rgba(12,21,36,.3)}
.btn-g{background:linear-gradient(135deg,#27a04a,#1e8e3e);color:#fff;box-shadow:0 4px 14px rgba(30,142,62,.32)}
.btn-o{background:linear-gradient(135deg,#f5821f,#e8710a);color:#fff;box-shadow:0 4px 14px rgba(232,113,10,.3)}
.btn-r{background:linear-gradient(135deg,#e4453a,#d93025);color:#fff;box-shadow:0 4px 14px rgba(217,48,37,.3)}
.btn-b{background:linear-gradient(135deg,#3585f2,#1a73e8);color:#fff;box-shadow:0 4px 14px rgba(26,115,232,.3)}
.btn-line{background:#fff;color:var(--text);border:2px solid #d5dbe3}
.btn-line:hover{border-color:var(--navy);box-shadow:var(--shadow)}
.btn-cancel:hover{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
.btn-ghost{background:transparent;color:var(--muted);border:none;font-weight:600}
.btn-sm{min-height:38px;padding:7px 14px;font-size:14px;border-radius:var(--r-sm)}
.btn-block{display:flex;width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1;min-width:150px}

/* ===== Status badges ===== */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:4px 11px;border-radius:99px;white-space:nowrap;letter-spacing:.2px}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-Draft{background:#eef1f5;color:#5b6773}
.st-Submitted{background:#fff3cd;color:#8a6400}
.st-UnderReview{background:#e2edfd;color:#174ea6}
.st-NeedsUpdate{background:#fdebd9;color:#a4520a}
.st-Approved{background:#e0f2e5;color:#0f6f32}
.st-Active{background:#1e8e3e;color:#fff}
.st-Completed{background:#dbe4f7;color:#1f3a72}
.st-Expired{background:#e5e8ec;color:#6b7684}
.st-Void{background:#3a4450;color:#e6e9ee}
.st-Lost{background:#fde2e0;color:#b3140a}
.st-Rejected{background:#fde2e0;color:#b3140a}

/* ===== Forms ===== */
.f-group{margin-bottom:15px}
.f-label{display:block;font-size:14px;font-weight:700;margin-bottom:6px;color:#33404d}
.f-label .req{color:var(--red);margin-left:2px}
.f-in,select.f-in,textarea.f-in{width:100%;border:2px solid #d5dbe3;border-radius:var(--r-md);padding:13px 14px;min-height:50px;background:#fff;color:var(--text)}
.f-in:focus{outline:none;border-color:var(--blue)}
/* Keyboard focus — visible ring for everyone tabbing through (mouse clicks stay clean) */
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:var(--r-xs)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.f-in.err{border-color:var(--red);background:#fff7f6}
textarea.f-in{min-height:90px;resize:vertical}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.f-row{grid-template-columns:1fr}}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;min-height:52px;border:2px solid #d5dbe3;background:#fff;border-radius:var(--r-md);font-weight:700;font-size:15px;color:var(--muted)}
.seg button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.seg.yn button.on.yes{border-color:var(--green);background:var(--green)}
.seg.yn button.on.no{border-color:var(--gray);background:var(--gray)}
.linkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.linkopt{border:2px solid #d5dbe3;background:#fff;border-radius:var(--r-md);padding:11px 12px;font-weight:600;font-size:14px;text-align:left;color:var(--muted);transition:all .12s}
.linkopt.on{border-color:var(--navy);background:var(--navy);color:#fff;box-shadow:0 3px 10px rgba(12,21,36,.25)}
.hint{font-size:13px;color:var(--muted);margin-top:5px}
.errbox{background:#fde2e0;color:#8f1007;border-radius:var(--r-md);padding:12px 14px;font-size:14px;font-weight:600;margin-bottom:14px;display:none}

/* ===== Stepper ===== */
.steps{display:flex;gap:4px;margin-bottom:18px}
.steps .stp{flex:1;text-align:center}
.steps .stp.clickable{cursor:pointer}
.steps .stp.clickable:hover span{color:var(--text)}
.steps .stp.clickable:hover .bar{filter:brightness(1.1)}
.steps .bar{height:5px;border-radius:99px;background:#dfe4ea;margin-bottom:6px}
.steps .on .bar{background:var(--yellow)}
.steps .done .bar{background:var(--green)}
.steps span{font-size:11px;font-weight:700;color:#98a2ad;text-transform:uppercase;letter-spacing:.4px}
.steps .on span{color:var(--text)}

/* ===== Permit type grid ===== */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{background:#fff;border:2px solid #e3e8ee;border-radius:var(--radius);padding:16px;cursor:pointer;display:flex;gap:13px;align-items:flex-start;transition:border-color .14s, box-shadow .18s, transform .12s;text-align:left}
.tcard:hover{border-color:var(--yellow);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.tcard .ico{font-size:26px;width:48px;height:48px;flex:none;background:#f2f5f9;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center}
.tcard b{font-size:16px;display:block}
.tcard .code{display:inline-block;font-size:11px;font-weight:800;background:var(--navy);color:var(--yellow);border-radius:var(--r-sm);padding:1px 7px;margin:3px 0 5px}
.tcard p{font-size:13px;color:var(--muted);line-height:1.4}
.tcard.hr-flag{border-left:5px solid var(--yellow)}

/* ===== Tracker ===== */
.tracker{display:flex;align-items:center;margin:14px 0;overflow-x:auto;padding-bottom:4px}
.tk{display:flex;flex-direction:column;align-items:center;min-width:74px;flex:1}
.tk .cir{width:30px;height:30px;border-radius:50%;background:#dfe4ea;color:#98a2ad;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;z-index:1}
.tk.done .cir{background:var(--green);color:#fff}
.tk.now .cir{background:var(--yellow);color:var(--navy);box-shadow:0 0 0 4px #ffb81c40}
.tk span{font-size:11px;font-weight:700;color:#98a2ad;margin-top:5px;text-align:center}
.tk.done span,.tk.now span{color:var(--text)}
.tk-line{height:3px;flex:1;background:#dfe4ea;margin:0 -18px;position:relative;top:-13px;min-width:12px}
.tk-line.done{background:var(--green)}
.tracker.dead{opacity:.45}

/* ===== Summary cards ===== */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.sum{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 15px;cursor:pointer;border:2px solid rgba(19,34,56,.05);transition:box-shadow .18s, transform .12s, border-color .14s}
.sum:hover{border-color:#c9d2dd;box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.sum.on{border-color:var(--navy)}
.sum b{font-size:27px;display:block;line-height:1.1;letter-spacing:-.8px;font-weight:800}
.sum span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.sum .tick{width:26px;height:4px;border-radius:99px;display:block;margin-top:7px}
.sumgrid.compact{grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.sumgrid.compact .sum{padding:10px 11px;border-radius:var(--r-md)}
.sumgrid.compact .sum b{font-size:21px}
.sumgrid.compact .sum span{font-size:10px;letter-spacing:.2px}
.sumgrid.compact .sum .tick{margin-top:5px;height:3px}

/* ===== Tables & permit cards ===== */
.tblwrap{overflow-x:auto;border-radius:var(--r-md);box-shadow:var(--shadow);background:#fff}
table.tbl{width:100%;border-collapse:collapse;min-width:760px}
table.tbl th{background:var(--navy-grad);color:#cfd8e3;font-size:11px;text-transform:uppercase;letter-spacing:.7px;text-align:left;padding:12px;white-space:nowrap}
table.tbl td{padding:11px 12px;border-top:1px solid #eef1f5;font-size:14px;vertical-align:middle}
table.tbl tr:hover td{background:#f7f9fc}
.pnum{font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px}
.pcard{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.pcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pcard .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:14px;color:var(--muted)}
.pcard .meta b{color:var(--text);font-weight:600}
.kv{display:grid;grid-template-columns:190px 1fr;gap:7px 14px;font-size:15px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{font-weight:600}
@media(max-width:560px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px;font-size:13px;text-transform:uppercase;letter-spacing:.3px}}

/* ===== Filters ===== */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.filters .f-in{width:auto;min-width:130px;flex:1;min-height:44px;padding:8px 12px;font-size:14px}
.filters input.f-in{min-width:170px}

/* ===== Hero (landing) — animated construction site ===== */
.hero{border-radius:var(--r-xl);padding:42px 34px 100px;color:#fff;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
  background:
    repeating-linear-gradient(0deg, rgba(122,160,220,.075) 0 1px, transparent 1px 36px),
    repeating-linear-gradient(90deg, rgba(122,160,220,.075) 0 1px, transparent 1px 36px),
    radial-gradient(560px 300px at 90% -10%, rgba(255,184,28,.17), transparent 60%),
    radial-gradient(500px 320px at -8% 110%, rgba(26,115,232,.22), transparent 60%),
    linear-gradient(158deg,#17293f 0%, #0c1524 62%, #0a1220 100%)}
.hero::before{content:"";position:absolute;top:-80px;right:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,184,28,.24),transparent 70%);animation:heroGlow 6s ease-in-out infinite}
@keyframes heroGlow{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
/* marching caution-stripe frame */
.hero-frame{position:absolute;inset:0;border-radius:var(--r-xl);padding:8px;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(45deg,var(--yellow) 0 13px,#141d2b 13px 26px);
  background-size:auto;
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0)}
/* --- living construction scene --- */
.hero-site{position:absolute;bottom:0;left:0;right:0;width:100%;height:150px;pointer-events:none}
.hs-win{animation:winOn 9s linear infinite;opacity:0}
@keyframes winOn{0%,12%{opacity:0}18%,88%{opacity:1}94%,100%{opacity:0}}
.hs-hook{animation:hookDrop 7s ease-in-out infinite}
@keyframes hookDrop{0%,100%{transform:translateY(0)}45%,60%{transform:translateY(34px)}}
.hs-arm{transform-origin:920px 14px;animation:armSway 11s ease-in-out infinite}
@keyframes armSway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3.5deg)}}
.hs-drone{animation:droneFly 18s linear infinite}
@keyframes droneFly{0%{transform:translateX(-160px)}100%{transform:translateX(1360px)}}
.hs-bob{animation:droneBob 3.4s ease-in-out infinite}
@keyframes droneBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.hs-cargo{animation:cargoSway 3.4s ease-in-out infinite;transform-origin:0 34px}
@keyframes cargoSway{0%,100%{transform:rotate(2.5deg)}50%{transform:rotate(-2.5deg)}}
.hs-spark{animation:sparkle 1.6s ease-in-out infinite;transform-origin:center}
@keyframes sparkle{0%,100%{opacity:.15}50%{opacity:1}}
.hs-rise{animation:blockRise 9s ease-out infinite}
@keyframes blockRise{0%,8%{opacity:0;transform:translateY(16px)}22%,86%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateY(16px)}}
@media (prefers-reduced-motion: reduce){.hs-win,.hs-hook,.hs-arm,.hs-drone,.hs-spark,.hs-rise,.hero::before{animation:none;opacity:1}}
/* colored stat + action tiles */
.hero-tile .ht-ico{width:46px;height:46px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.hero-tile:nth-child(1) .ht-ico{background:linear-gradient(135deg,#e2edfd,#c3dafc)}
.hero-tile:nth-child(2) .ht-ico{background:linear-gradient(135deg,#e0f2e5,#c2e5cc)}
.hero-strip>div:nth-child(1){background:linear-gradient(160deg,#eaf1fe,#dbe7fb);border-color:#c3d7f5}
.hero-strip>div:nth-child(1) b{color:#174ea6}
.hero-strip>div:nth-child(2){background:linear-gradient(160deg,#e9f7ee,#d8efe0);border-color:#bfe3cc}
.hero-strip>div:nth-child(2) b{color:#0f6f32}
.hero-strip>div:nth-child(3){background:linear-gradient(160deg,#fdf3e2,#fae7c6);border-color:#f0d49a}
.hero-strip>div:nth-child(3) b{color:#8a5a00}
.hero-kicker{display:inline-flex;align-items:center;gap:7px;background:rgba(255,184,28,.13);border:1px solid rgba(255,184,28,.45);color:var(--yellow);font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;border-radius:99px;padding:7px 15px;margin-bottom:16px;box-shadow:0 0 22px rgba(255,184,28,.15)}
.hero h2{font-size:34px;font-weight:900;line-height:1.1;letter-spacing:-.9px;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.hero h2 em{font-style:normal;color:var(--yellow);text-shadow:0 0 28px rgba(255,184,28,.45)}
.hero p{color:#bcc8da;font-size:15px;margin-top:13px;max-width:460px}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:520px){.hero-row{grid-template-columns:1fr}}
.hero-tile{background:#fff;border:2px solid rgba(19,34,56,.07);border-radius:var(--r-xl);padding:18px 16px;text-align:left;box-shadow:var(--shadow);transition:transform .12s, box-shadow .18s, border-color .14s;cursor:pointer}
.hero-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--yellow)}
.hero-tile .ht-ico{font-size:26px;display:block;margin-bottom:8px}
.hero-tile b{font-size:16px;display:block;letter-spacing:-.2px}
.hero-tile small{color:var(--muted);font-size:13px;font-weight:600}
.hero-strip{display:flex;gap:10px;margin-top:14px}
.hero-strip>div{flex:1;background:rgba(255,255,255,.66);backdrop-filter:blur(8px);border:1px solid rgba(19,34,56,.07);border-radius:var(--r-lg);padding:12px 8px;text-align:center}
.hero-strip b{font-size:22px;font-weight:800;display:block;letter-spacing:-.5px;color:var(--navy)}
.hero-strip span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

/* ===== Cinematic intro sequence ===== */
#intro{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  background:
    repeating-linear-gradient(0deg, rgba(122,160,220,.06) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(90deg, rgba(122,160,220,.06) 0 1px, transparent 1px 42px),
    radial-gradient(700px 420px at 50% 115%, rgba(255,184,28,.14), transparent 65%),
    linear-gradient(165deg,#152841 0%, #0c1524 55%, #080f1a 100%);
  transition:transform .85s cubic-bezier(.7,0,.3,1), opacity .85s}
#intro.lift{transform:translateY(-102%);opacity:.4}
.intro-word{position:absolute;left:0;right:0;text-align:center;color:#fff;font-size:clamp(34px,7.5vw,72px);font-weight:900;letter-spacing:-1.5px;opacity:0;padding:0 20px;text-shadow:0 4px 40px rgba(0,0,0,.5)}
.intro-word em{font-style:normal;color:var(--yellow);text-shadow:0 0 40px rgba(255,184,28,.5)}
.intro-word.in{animation:wIn 1.6s cubic-bezier(.2,.7,.2,1) both}
.intro-word.gone{animation:wOut .8s ease both}
@keyframes wIn{from{opacity:0;transform:translateY(34px) scale(.96);filter:blur(6px)}30%{filter:blur(0)}to{opacity:1;transform:none}}
@keyframes wOut{from{opacity:1}to{opacity:0;transform:translateY(-26px);filter:blur(4px)}}
.intro-brand{position:absolute;left:0;right:0;text-align:center;opacity:0;padding:0 20px}
.intro-brand.in{animation:wIn 1s cubic-bezier(.2,.7,.2,1) both}
.intro-brand .ib-badge{width:64px;height:64px;border-radius:var(--r-lg);background:var(--gold-grad);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;box-shadow:0 8px 40px rgba(255,184,28,.45);margin-bottom:14px}
.intro-brand h1{color:#fff;font-size:clamp(26px,5vw,44px);font-weight:900;letter-spacing:-1px}
.intro-brand p{color:var(--yellow);font-size:13px;font-weight:800;letter-spacing:3.5px;text-transform:uppercase;margin-top:8px}
.intro-sky{position:absolute;bottom:0;left:0;right:0;width:100%;height:30vh;min-height:170px;opacity:.9}
.intro-sky path,.intro-sky line,.intro-sky rect{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 3.4s ease forwards .25s}
@keyframes draw{to{stroke-dashoffset:0}}
#introSkip{position:absolute;top:20px;right:20px;background:var(--gold-grad);border:none;color:var(--navy);border-radius:99px;padding:13px 26px;font-weight:800;font-size:15px;box-shadow:0 6px 24px rgba(255,184,28,.45);animation:skipPulse 2.4s ease-in-out infinite;cursor:pointer;z-index:5}
#introSkip:hover{filter:brightness(1.06);transform:scale(1.04)}
@keyframes skipPulse{0%,100%{box-shadow:0 6px 24px rgba(255,184,28,.45)}50%{box-shadow:0 6px 34px rgba(255,184,28,.75)}}
/* ===== Marquee band (landing) ===== */
.marquee{overflow:hidden;background:var(--navy-grad);border:1px solid rgba(255,184,28,.28);border-radius:var(--r-lg);margin-top:14px;position:relative;padding:13px 0}
.marquee::before,.marquee::after{content:"";position:absolute;top:0;bottom:0;width:46px;z-index:2;pointer-events:none}
.marquee::before{left:0;background:linear-gradient(90deg,#0c1524,transparent)}
.marquee::after{right:0;background:linear-gradient(270deg,#0c1524,transparent)}
.marquee-track{display:flex;width:max-content;animation:mq 26s linear infinite;white-space:nowrap}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-track span{color:#8fa0b8;font-weight:900;font-size:15px;letter-spacing:2.5px;text-transform:uppercase;padding:0 18px}
.marquee-track span em{font-style:normal;color:var(--yellow)}
.marquee-track b{color:var(--yellow);padding:0 4px}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.marquee-track{animation:none}}
.hero-sky{position:absolute;bottom:6px;left:0;right:0;width:100%;height:90px;opacity:.5;pointer-events:none}
@media (prefers-reduced-motion: reduce){#intro{display:none}}

/* ===== Equipment finder — futuristic scan ===== */
.finder{position:relative;overflow:hidden;border:2px solid rgba(255,184,28,.35)!important;background:var(--navy-grad)!important}
.finder .finder-in{background:rgba(255,255,255,.06);border-color:rgba(255,184,28,.4);color:#fff;font-size:18px;min-height:58px;font-weight:700;letter-spacing:.5px}
.finder .finder-in::placeholder{color:#8fa0b8}
.finder .finder-in:focus{border-color:var(--yellow);box-shadow:0 0 0 4px rgba(255,184,28,.18),0 0 30px rgba(255,184,28,.25)}
.finder .hint{color:#8fa0b8}
.finder-scan{position:absolute;top:0;bottom:0;width:90px;background:linear-gradient(90deg,transparent,rgba(255,184,28,.10),transparent);animation:scanX 3.2s linear infinite;pointer-events:none}
@keyframes scanX{from{left:-15%}to{left:110%}}
.eq-card{transition:transform .12s}
.eq-hit{border:2px solid var(--green);background:#f2faf4;box-shadow:0 6px 26px rgba(30,142,62,.25);animation:hitPop .4s cubic-bezier(.2,.8,.3,1.2)}
@keyframes hitPop{from{transform:scale(.97);opacity:.5}to{transform:none;opacity:1}}
.eq-found{display:inline-block;background:var(--green);color:#fff;font-size:12px;font-weight:900;letter-spacing:1.4px;border-radius:99px;padding:4px 13px;margin-bottom:10px}
/* staggered entrances — everything glides in */
.sumgrid .sum,.tgrid>*,.pcard{animation:pgIn .45s ease both}
.sumgrid .sum:nth-child(2),.tgrid>*:nth-child(2){animation-delay:.05s}
.sumgrid .sum:nth-child(3),.tgrid>*:nth-child(3){animation-delay:.1s}
.sumgrid .sum:nth-child(4),.tgrid>*:nth-child(4){animation-delay:.15s}
.sumgrid .sum:nth-child(5),.tgrid>*:nth-child(5){animation-delay:.2s}
.sumgrid .sum:nth-child(6),.tgrid>*:nth-child(6){animation-delay:.25s}
.sumgrid .sum:nth-child(7),.tgrid>*:nth-child(7){animation-delay:.3s}
.sumgrid .sum:nth-child(8),.tgrid>*:nth-child(8){animation-delay:.35s}
.grp-h{position:relative;overflow:hidden}
.grp-h::after{content:"";position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(255,184,28,.14),transparent);animation:scanX 4.5s linear infinite}

/* ===== Toasts ===== */
#toastHost{position:fixed;bottom:56px;left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--navy-grad);color:#fff;border-radius:var(--r-lg);padding:14px 22px;font-size:15px;font-weight:700;box-shadow:0 10px 34px rgba(4,10,20,.4);opacity:0;transform:translateY(16px) scale(.97);transition:opacity .3s,transform .3s;max-width:92vw;text-align:center;border:1px solid rgba(255,255,255,.14)}
.toast.show{opacity:1;transform:none}
.toast.t-green{background:linear-gradient(135deg,#27a04a,#0f6f32);border-color:rgba(255,255,255,.25)}
.toast.t-orange{background:linear-gradient(135deg,#f5821f,#c95f05)}
.toast.t-red{background:linear-gradient(135deg,#e4453a,#b3140a)}
.toast.t-blue{background:linear-gradient(135deg,#3585f2,#174ea6)}

/* ===== Aging / escalation chips ===== */
.age{display:inline-flex;align-items:center;font-size:12px;font-weight:800;border-radius:99px;padding:4px 10px;white-space:nowrap;letter-spacing:.2px}
.age.ok{background:#e6f0e9;color:#1e6b38}
.age.neu{background:#eef1f5;color:#5b6773}
.age.sch{background:#e2edfd;color:#174ea6}
.age.yel{background:#fff3cd;color:#8a6400;animation:agePulse 2.2s infinite}
.age.red{background:var(--red);color:#fff;animation:agePulse 1.2s infinite}
@keyframes agePulse{0%,100%{opacity:1}50%{opacity:.65}}
tr.row-warn td{background:#fffaf0!important}
tr.row-urgent td{background:#fff2f1!important}
tr.row-urgent td:first-child{box-shadow:inset 4px 0 0 var(--red)}
.pcard.pc-row-warn{border:2px solid #f5b400;background:#fffdf5}
.pcard.pc-row-urgent{border:2px solid var(--red);background:#fff7f6;box-shadow:0 4px 18px rgba(217,48,37,.18)}
a.btn{text-decoration:none}

/* ===== Ticket (confirmation) ===== */
.ticket{background:var(--navy-grad);border-radius:var(--r-xl);padding:20px 16px 18px;position:relative;overflow:hidden;border:1px solid rgba(255,184,28,.3)}
.ticket::after{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--gold-grad)}
.ticket .tk-lbl{font-size:11px;font-weight:800;color:#9fb0c6;text-transform:uppercase;letter-spacing:1.6px}
.ticket .tk-num{font-size:38px;color:var(--yellow);text-shadow:0 2px 14px rgba(255,184,28,.35);margin:4px 0 10px}

/* ===== Misc ===== */
.big-icon{font-size:52px;margin-bottom:8px}
.center{text-align:center}
.pill-hint{background:#eef4ff;color:var(--blue-d);border-radius:var(--r-md);padding:11px 14px;font-size:14px;font-weight:600;margin-bottom:14px}
.warn-hint{background:#fff8e6;color:#7a5b00;border-radius:var(--r-md);padding:11px 14px;font-size:14px;font-weight:600}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
@media(max-width:560px){.daygrid{grid-template-columns:repeat(7,1fr);gap:3px}}
.daychip{border:1.5px solid #d5dbe3;background:#fff;border-radius:var(--r-sm);padding:5px 1px;text-align:center;cursor:pointer;transition:all .12s;font-family:inherit}
.daychip:hover{border-color:var(--navy)}
.daychip .dc-day{display:block;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.1px;white-space:nowrap}
.daychip .dc-date{display:block;font-size:13px;font-weight:800;color:var(--text);margin-top:1px}
.daychip.on{border-color:var(--navy);background:var(--navy)}
.daychip.on .dc-day,.daychip.on .dc-date{color:#fff}
.daychip.wknd{border-color:#f0c46a;background:#fffaf0}
.daychip.wknd .dc-day{color:#a4780a}
.daychip.wknd.on{border-color:#e8710a;background:#e8710a}
.daychip.wknd.on .dc-day,.daychip.wknd.on .dc-date{color:#fff}
.daychip.istoday{box-shadow:inset 0 -3px 0 var(--blue)}
.daychip.istoday.on{box-shadow:none}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .sl{position:relative;width:52px;height:30px;background:#c7ced8;border-radius:var(--r-pill);transition:.18s;flex:0 0 auto}
.switch .sl:before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked + .sl{background:var(--green,#1f9d55)}
.switch input:checked + .sl:before{transform:translateX(22px)}
.switch-tx{font-weight:700;font-size:14px}
.pf-preview{display:block;width:100%;max-height:220px;object-fit:contain;border:1px solid #dfe4ea;border-radius:var(--r-md);margin-bottom:8px;background:#f4f6f9}
.pf-preview.empty{display:flex;align-items:center;justify-content:center;height:90px;color:var(--muted);font-size:13px}
.wknd-fld{background:#fff7e0;border:1.5px solid #f0c46a;border-radius:var(--r-md);padding:10px 12px;margin-bottom:12px}
.wknd-fld .f-label{color:#9a6a00}
body.dark .wknd-fld{background:#2a2213;border-color:#7a5f1e}
body.dark .wknd-fld .f-label{color:#e6b449}
.lvl-row{border:1.5px solid #dfe4ea;border-radius:var(--r-md);padding:12px;margin-bottom:12px;background:#fafbfc}
.lvl-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px}
.lvl-name{flex:1;min-width:0;font-weight:700}
.lvl-btns{display:flex;gap:4px;flex-shrink:0}
.lvl-btns .btn{padding:8px 11px;font-weight:700}
.lvl-btns .btn[disabled]{opacity:.35;cursor:default}
.tab-badge{display:inline-block;background:#e8710a;color:#fff;border-radius:var(--r-pill);padding:1px 8px;font-size:11px;font-weight:800;margin-left:4px;vertical-align:middle}
/* Date fields — make them obviously clickable and the calendar icon noticeable */
.datein{cursor:pointer;border-color:var(--blue)!important}
input[type=date]{cursor:pointer}
input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:1;width:20px;height:20px;padding:2px;border-radius:var(--r-sm);background-color:var(--yellow);margin-left:4px}
body.dark input[type=date]::-webkit-calendar-picker-indicator{filter:none}
.daterange{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.dr-lbl{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.dr-arrow{font-weight:800;color:var(--muted)}
.btn-openprint:hover{background:var(--green,#1f9d55)!important;border-color:var(--green,#1f9d55)!important;color:#fff!important}
.lbl-edit{background:#fff3d6;border:1px solid #e6b449;border-radius:var(--r-sm);padding:1px 6px;font-size:12px;cursor:pointer;margin-left:4px;line-height:1.4}
.lbl-edit:hover{background:#ffe7a8}
body.dark .lbl-edit{background:#3a2f12;border-color:#7a5f1e}
.f-label.sm{font-size:13px;margin-top:8px;display:block}
body.dark .lvl-row{background:#132540;border-color:#314566}
body.dark .pf-preview{background:#0f1c31;border-color:#314566}
body.dark .switch .sl{background:#3a4a63}
body.dark .daychip{background:#0f1c31;border-color:#314566}
body.dark .daychip .dc-date{color:var(--text)}
body.dark .daychip.wknd{background:#2a2213;border-color:#7a5f1e}
body.dark .daychip.on{background:var(--navy);border-color:#4a6ea8}
.audit{border-left:3px solid var(--gray-l);padding-left:14px}
.audit .ev{margin-bottom:12px;position:relative}
.audit .ev::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--navy);position:absolute;left:-20.5px;top:4px;border:2px solid #fff}
.audit .ev b{font-size:14px}
.audit .ev .when{font-size:12px;color:var(--muted)}
.audit .ev .det{font-size:14px;color:var(--body2);margin-top:2px;white-space:pre-wrap}
.tag{display:inline-block;background:#eef1f5;border-radius:var(--r-sm);font-size:12px;font-weight:700;padding:2px 8px;margin:2px 3px 2px 0;color:var(--body2)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty .big-icon{opacity:.6}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(19,34,56,.08);padding:8px 14px;text-align:center;font-size:12px;color:var(--muted);z-index:40}
.modal-bk{position:fixed;inset:0;background:rgba(10,18,30,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:var(--r-lg);max-width:480px;width:100%;padding:22px;max-height:88vh;overflow-y:auto}
.modal h3{font-size:18px;margin-bottom:10px}
.qrbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.qrcell{background:#fff;border:2px solid #e3e8ee;border-radius:var(--r-md);padding:14px;text-align:center}
.qrcell img{width:150px;height:150px;margin:6px auto}
.qrcell b{font-size:14px;display:block}
.qrcell .lnk{font-size:11px;color:var(--muted);word-break:break-all;margin-top:6px}
.admin-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.admin-tabs button{border:2px solid #d5dbe3;background:#fff;border-radius:99px;padding:9px 16px;font-weight:700;font-size:14px;color:var(--muted)}
.admin-tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.list-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid #eef1f5;flex-wrap:wrap}
.list-row:first-child{border-top:none}

<footer><span id="syncBadge">⚪ Offline mode — data saved on this device only</span> &nbsp;·&nbsp; All permits require Jacobs review and approval before work begins.</footer>
<div id="modalHost"></div>
<script>
"use strict";
/* ============================================================
   PROJECT PERMIT PORTAL — Pilot / Beta
   Single-file app. Data persists in this browser (localStorage).
   ============================================================ */

/* ---------- Safety question sets (aligned with Project Aura HSE Plan Rev 2 / Master SSOW) ---------- */
const QSETS={
HW:["Will sparks, heat, or open flame be generated?","Has the area been inspected for combustibles?","Is a fire extinguisher available?","Is fire watch required?","Has fire watch been assigned?"],
CS:["Has the space been evaluated?","Is atmospheric monitoring required?","Is rescue planning required?","Is an attendant assigned?"],
NCS:["Has the space been evaluated and classified non-permit?","Could conditions change during the work?","Is ventilation adequate?","Is communication established with workers inside?"],
LOTO:["Has the energy source been identified?","Has an isolation plan been reviewed?","Is verification of zero energy required?","Are all affected parties notified?"],
ES:["Is the energized work justified (no de-energized option)?","Are only qualified electrical workers performing the task?","Is arc-flash PPE selected for the incident energy?","Are barriers and approach boundaries established?"],
EXC:["Have utilities been located and marked (811 / scans)?","Is a protective system (sloping, shoring, box) in place?","Is a competent person on site?","Are spoil piles at least 2 ft from the edge?","Is ladder access within 25 ft of workers?"],
OHPL:["Has the minimum approach distance been established?","Is a dedicated spotter assigned?","Are the lines de-energized or insulated/guarded?","Has equipment reach/height been checked against clearances?"],
OP:["Has the area been scanned or reviewed?","Have drawings been reviewed?","Are barricades required?","Are exposed edges or floor openings protected?"],
RA:["Is roof access authorized and controlled?","Is fall protection in place for work near edges?","Are weather conditions acceptable?","Is a warning line / perimeter established?"],
GFG:["Is the area below and around barricaded?","Is fall protection in use while the surface is removed?","Will the opening be covered or guarded when unattended?","Will reinstallation be verified before closing the permit?"],
LB:["Has the line been identified?","Has pressure been relieved?","Has the system been drained or flushed?","Are chemical or stored-energy hazards present?"],
CL:["Has the lift plan been reviewed and approved?","Is the crane inspection current?","Has all rigging been inspected?","Is an exclusion zone established under the load path?","Are wind and weather within limits?"],
PT:["Is the correct gauge installed (right range, current calibration)?","Is a pressure relief valve installed and set correctly?","Is the test area barricaded off?","Have Jacobs and the client been notified?","Has the test procedure been reviewed?"],
PAT:["Is the operator trained and certified for the tool?","Has the tool been inspected before use?","Is the correct charge/load selected for the material?","Is the area behind and adjacent to the work clear?"],
RAD:["Is the controlled area barricaded and posted?","Has the RSO / Jacobs been notified?","Are warning signals and lights working?","Have non-essential personnel been cleared?"],
WC:["Has the walkable vs non-walkable area been verified on the plan?","Are weight limits confirmed for the work?","Is fall protection in place where required?","Are ceiling openings protected?"],
BP:["Is the blast plan approved?","Have warning signals been communicated to the site?","Is the exclusion zone cleared and controlled?","Is the blaster licensed and authorized?"],
ELEV:["Is fall protection required for this task?","Will workers be tied off 100% at height?","Is the equipment inspection current (MEWP / scaffold tag)?","Are ground conditions and outriggers verified?","Is a rescue plan in place for workers at height?"],
EL:["Is fall protection maintained 100% during the transfer?","Is the landing point rated and safe to step onto?","Is the basket secured against movement?","Is a rescue plan in place?"],
EL_NEW:["Is fall protection maintained 100% during the transfer?","Is the landing point rated and safe to step onto?","Is the basket secured against movement?","Is a rescue plan in place?"],
BR:["Has the rigging plan been reviewed?","Is all rigging gear inspected and tagged?","Is the load path clear of personnel?","Are attachment points rated for the load?"]
};

/* ---------- Seed data (from real DSM-4 master permit log) ---------- */
const SEED = {
  settings:{ pin:"1234", project:"DSM Project", remind1:15, remind2:30, adminName:"Permit Office", adminEmail:"", adminPhone:"", alerts:false },
  buildings:[
    {code:"D4", name:"DSM-4", active:true},
    {code:"D3", name:"DSM-3", active:true},
    {code:"HB", name:"Head Block", active:true},
    {code:"CUB", name:"CUB", active:true}
  ],
  floors:[
    {id:"f1", b:"D4", name:"Ground Floor (GF)", active:true},
    {id:"f2", b:"D4", name:"First Floor (FF)", active:true},
    {id:"f3", b:"D4", name:"Second Floor (SF)", active:true},
    {id:"f4", b:"D4", name:"Roof", active:true},
    {id:"f5", b:"D4", name:"Waste Pit", active:true},
    {id:"f6", b:"D4", name:"Exterior / Site", active:true},
    {id:"f7", b:"D3", name:"Ground Floor (GF)", active:true},
    {id:"f8", b:"D3", name:"First Floor (FF)", active:true},
    {id:"f9", b:"D3", name:"Second Floor (SF)", active:true},
    {id:"f10", b:"D3", name:"Roof", active:true},
    {id:"f11", b:"HB", name:"All Levels", active:true},
    {id:"f12", b:"CUB", name:"All Levels", active:true}
  ],
  contractors:[
    "DH Griffin","Wayne Brothers","SIC","Amico","Merit","PureClean","InServ","FPI",
    "Graycor","BMWC","UPSI","Ameco"
  ].map((n,i)=>({id:"c"+(i+1), name:n, contact:"", phone:"", email:"", active:true})),
  reviewers:[
    "JJ Jaramillo","Lorena Vickery","Drew Foster","Mike Fitzpatrick","Gary Workman","Shawn Patterson","Building HSE/CM (any available)"
  ].map((n,i)=>({id:"r"+(i+1), name:n, email:"", phone:"", active:true})),
  permitTypes:[ // one type per real permit form in the w4rw4 folder
    {code:"HW", name:"Hot Work Permit", ico:"🔥", hr:true, desc:"Sparks, open flame, welding, cutting, grinding, or any spark-producing work."},
    {code:"CS", name:"Confined Space Permit", ico:"🕳️", hr:true, desc:"Entry into tanks, pits, vessels, or excavations over 4 ft deep."},
    {code:"NCS", name:"Non-Permit CSE (Data Sheet)", ico:"📋", hr:false, desc:"Entry into a space evaluated as non-permit confined space."},
    {code:"LOTO", name:"Lockout / Tagout Permit", ico:"🔒", hr:true, desc:"Isolating or shutting off electrical, mechanical, pneumatic, or hydraulic energy."},
    {code:"ES", name:"Energized Electrical Permit", ico:"⚡", hr:true, desc:"Work on or near energized electrical equipment or live exposure."},
    {code:"EXC", name:"Excavation and Trenching", ico:"⛏️", hr:false, desc:"Digging, trenching, grading, or any soil disturbance."},
    {code:"OP", name:"Opening and Penetration Permit", ico:"🧱", hr:true, desc:"Core drilling, cutting, or penetrating floors, walls, or ceilings."},
    {code:"RA", name:"Roof Access Permit", ico:"🏠", hr:false, desc:"Accessing the roof or performing work on roof areas."},
    {code:"GFG", name:"Grating / Floor Plate / Guardrail Removal", ico:"🚧", hr:false, desc:"Removing grating, floor plates, guardrails, or other walking/fall protection."},
    {code:"LB", name:"Line Break Permit", ico:"🔧", hr:true, desc:"Opening pipes, tubing, hoses, or vessels that may hold pressure or chemicals."},
    {code:"CL", name:"Critical Lift", ico:"🏗️", hr:true, desc:"Crane lifts requiring a critical lift / rigging / lifting plan."},
    {code:"PT", name:"Pressure Testing", ico:"🌡️", hr:true, desc:"Pressure or leak testing of piping and systems — stored energy hazard."},
    {code:"ELEV", name:"Elevated Work Permit", ico:"🧗", hr:true, desc:"Work at height on scaffolds, platforms, MEWPs, or elevated surfaces."},
    {code:"EL", name:"Man-Basket Exiting Permit", ico:"🧺", hr:true, desc:"Exiting a man basket / aerial platform at height onto a structure."},
    {code:"BR", name:"Bull Rigging Lift Permit", ico:"⛓️", hr:false, desc:"Rigging and moving loads without a crane — bull rigging operations."}
  ].map(t=>({...t, q:QSETS[t.code]||[], active:true})),
  permits:[], counters:{}
};

const STATUSES=["Draft","Submitted","Under Review","Needs Update","Approved","Active","Completed","Expired","Void","Lost","Rejected"];
const OPEN_STATUSES=["Submitted","Under Review","Needs Update","Approved","Active"];
const TRACK=["Under Review","Active","Completed"];
const stageOf=st=> st==="Completed"?2 : ["Approved","Active"].includes(st)?1 : 0;
const DEAD=["Void","Lost","Rejected","Expired"];

/* ---------- DB ---------- */
const KEY="ppp_db_v1";
let DB;
function loadDB(){
  try{ DB = JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ DB=null; }
  if(!DB){ DB = JSON.parse(JSON.stringify(SEED)); saveDB(); }
  // forward-fill new seed keys
  for(const k of Object.keys(SEED)) if(DB[k]===undefined) DB[k]=JSON.parse(JSON.stringify(SEED[k]));
  DB.settings={...SEED.settings,...DB.settings};
  migrate();
}
const D4_AREAS=["Sector A","Sector B","Sector C","Sector D","Upstream","Downstream","Waste Pit","CIP Room","AHU Room","Electrical Room","Mechanical Room","Temp Power Skid","Storm Drain","Corridor","Stairwell","Loading Dock"];
function migrate(){
  if((DB._v||1)<3){
    const addF=(b,name)=>{ if(!DB.floors.some(f=>f.b===b&&f.name===name)) DB.floors.push({id:uid(),b,name,active:true}); };
    addF("D4","Ground Floor Interstitial"); addF("D4","First Floor Interstitial"); addF("D4","Second Floor Interstitial");
    DB.floors.forEach(f=>{ if(f.lead===undefined) f.lead=""; if(!f.areas) f.areas=(f.b==="D4"?D4_AREAS.slice():[]); });
    if(DB.settings.notifyOn===undefined) DB.settings.notifyOn=true;
    if(!DB.settings.notifyDays) DB.settings.notifyDays=[0,1,2,3,4,5,6];
    if(!DB.permitDocs) DB.permitDocs=[
      {n:"Project Aura — HSE Plan Rev 2",u:"Project Aura - HSE Plan Rev 2.pdf",g:"Reference"},
      {n:"MASTER Safe System of Work (SSOW) Rev 3",u:"w4rw4/250613 Aura - MASTER Safe System of Work - English - Rev3.pdf",g:"Reference"},
      {n:"DSM-4 Floor Plans & Walkable Ceiling",u:"DSM4 floor plans and walkable ceiling plain.pdf",g:"Reference"},
      {n:"Hot Work Permit",u:"w4rw4/Hot Work Permit(2).pdf",g:"Permit Forms"},
      {n:"Hot Work Permit (with Extension)",u:"w4rw4/Hot Work Permit(with EXT).pdf",g:"Permit Forms"},
      {n:"Confined Space Entry Assessment & Permit Rev 2",u:"w4rw4/Jacobs Confined Space Entry Assessment and Permit Rev2.pdf",g:"Permit Forms"},
      {n:"Confined Space Rescue Plan Template",u:"w4rw4/Confined-space-rescue-plan Template(2).pdf",g:"Permit Forms"},
      {n:"Non-Permit CSE Data Sheet Template",u:"w4rw4/Non Permit CSE Data Sheet Template.pdf",g:"Permit Forms"},
      {n:"Complex Lockout Tagout Plan (Packet)",u:"w4rw4/PACKET-Project Aura Complex Lockout Tagout Plan.pdf",g:"Permit Forms"},
      {n:"Energized Electrical Permit & Checklist (Packet)",u:"w4rw4/PACKET-Corporate_Site Energized Electrical Permit_Checklist.pdf",g:"Permit Forms"},
      {n:"Excavation and Trenching Permit Rev 2",u:"w4rw4/FDBN-Excavation and Trenching Permit Rev2.pdf",g:"Permit Forms"},
      {n:"Line Break Permit",u:"w4rw4/Line Break Permit.pdf",g:"Permit Forms"},
      {n:"Opening & Penetration Checklist",u:"w4rw4/Opening Penetration Checklist  Final.pdf",g:"Permit Forms"},
      {n:"Roof Access Permit (Pink)",u:"w4rw4/Roof Access Permit(pink)(FDBN).pdf",g:"Permit Forms"},
      {n:"Grating / Floor Plate / Guardrail Removal Checklist & Permit",u:"w4rw4/Grating-Floor-Plate-Guardrail Removal Checklist and Permit.pdf",g:"Permit Forms"},
      {n:"Work at Height Permit Rev 2",u:"w4rw4/Work at Height Permit Rev2.pdf",g:"Permit Forms"},
      {n:"Pressure Test Risk Assessment",u:"w4rw4/Pressure Test Risk Assessment.pdf",g:"Permit Forms"},
      {n:"Crane Critical Lift / Rigging / Lifting Plan",u:"w4rw4/Crane Critical lift-Rigging-Lifting-Plan.pdf",g:"Permit Forms"},
      {n:"Bull Rigging Lift Permit Rev 2",u:"w4rw4/Bull Rigging Lift Permit Rev2.pdf",g:"Permit Forms"},
      {n:"Man Basket Exiting Permit (Gold) Rev 2",u:"w4rw4/Man Basket Exiting Permit(gold) Rev2.pdf",g:"Permit Forms"},
      {n:"Greenlift",u:"w4rw4/Greenlift.pdf",g:"Permit Forms"},
      {n:"Material Unload / Handling",u:"w4rw4/Material Unload Handling.pdf",g:"Permit Forms"},
      {n:"Ladder Use Justification",u:"w4rw4/Ladder Use Justification FDBN.pdf",g:"Permit Forms"}
    ];
    DB._v=3; saveDB();
  }
  if((DB._v||1)<4){
    // rename Elevator Work → Elevated Work Permit
    const el=DB.permitTypes.find(t=>t.code==="ELEV");
    if(el){ el.name="Elevated Work Permit"; el.ico="🧗"; el.hr=true; el.desc="Work at height on platforms, scaffolds, MEWPs, or elevated surfaces."; }
    // every permit type gets its safety question set (keeps any admin-customized sets)
    DB.permitTypes.forEach(t=>{ if((!t.q||!t.q.length)&&QSETS[t.code]) t.q=QSETS[t.code].slice(); });
    DB._v=4; saveDB();
  }
  if((DB._v||1)<5){
    // trade partner safety managers
    DB.contractors.forEach(c=>{ if(c.safName===undefined){ c.safName=""; c.safPhone=""; c.safEmail=""; } });
    // Jacobs building safety leads
    DB.buildings.forEach(b=>{ if(b.safLead===undefined){ b.safLead=""; b.safPhone=""; b.safEmail=""; } });
    // permits requiring Jacobs Safety sign-off (admin-adjustable)
    DB.permitTypes.forEach(t=>{ if(t.safetyReq===undefined) t.safetyReq=["CS","PT","RA","ELEV","EL"].includes(t.code); });
    // multiple admin users, each with their own PIN
    if(!DB.settings.admins||!DB.settings.admins.length) DB.settings.admins=[{name:"BDiaz",pin:DB.settings.pin||"1234"}];
    DB._v=5; saveDB();
  }
  if((DB._v||1)<6){
    if(!DB.safetyUsers) DB.safetyUsers=[];           // trade partner safety managers with view-only PINs
    if(!DB.accessLog) DB.accessLog=[];               // who signed in, when, as what
    if(!DB.adminLog) DB.adminLog=[];                 // what admins changed, with restore points
    if(!DB.settings.owner) DB.settings.owner={name:"Owner",pin:"7777"}; // level above admin — sees the Activity Log
    DB._v=6; saveDB();
  }
  if((DB._v||1)<7){
    if(!DB.trash) DB.trash=[];                          // deleted permits — owner can restore
    if(!DB.settings.notifyMode) DB.settings.notifyMode="manual"; // "auto" = text opens ready-to-send on submit
    DB._v=7; saveDB();
  }
  if((DB._v||1)<8){
    if(!DB.equipment) DB.equipment=[];                  // site equipment registry — synced to the cloud
    DB._v=8; saveDB();
  }
  if((DB._v||1)<9){
    // permit types must match the real permit forms — remove types with no form
    DB.permitTypes=DB.permitTypes.filter(t=>!["WC","OHPL","RAD","BP","PAT"].includes(t.code));
    const el=DB.permitTypes.find(t=>t.code==="EL");
    if(el){ el.name="Man-Basket Exiting Permit"; el.ico="🧺"; el.hr=true; el.desc="Exiting a man basket / aerial platform at height onto a structure."; el.q=QSETS.EL_NEW.slice(); }
    const ncs=DB.permitTypes.find(t=>t.code==="NCS"); if(ncs) ncs.name="Non-Permit CSE (Data Sheet)";
    const es=DB.permitTypes.find(t=>t.code==="ES"); if(es) es.name="Energized Electrical Permit";
    DB._v=9; saveDB();
  }
  if((DB._v||1)<10){
    // custom drawn icons that actually look like the equipment
    Object.entries(SVGICONS).forEach(([code,svg])=>{ const t=DB.permitTypes.find(x=>x.code===code); if(t) t.ico=svg; });
    DB._v=10; saveDB();
  }
  if((DB._v||1)<11){
    // each trade partner can have an assigned Jacobs superintendent (company-based routing)
    DB.contractors.forEach(c=>{ if(c.reviewer===undefined) c.reviewer=""; });
    DB._v=11; saveDB();
  }
  if((DB._v||1)<12){
    // weekend coverage — who reviews on Saturday/Sunday
    DB.contractors.forEach(c=>{ if(c.weekendReviewer===undefined) c.weekendReviewer=""; });
    DB.floors.forEach(f=>{ if(f.weekendLead===undefined) f.weekendLead=""; });
    DB.buildings.forEach(b=>{ if(b.weekendLead===undefined) b.weekendLead=""; });
    DB._v=12; saveDB();
  }
  if((DB._v||1)<13){
    // optional building-wide weekday lead — supersedes floor & company when set
    DB.buildings.forEach(b=>{ if(b.lead===undefined) b.lead=""; });
    DB._v=13; saveDB();
  }
  if((DB._v||1)<14){
    // floor-leads ON/OFF per building + separate Saturday & Sunday reviewers + per-floor drawings
    DB.buildings.forEach(b=>{
      if(b.floorLeadsOn===undefined) b.floorLeadsOn=true;              // DSM-4 style: floor leads active by default
      if(b.weekendLeadSat===undefined) b.weekendLeadSat=b.weekendLead||"";
      if(b.weekendLeadSun===undefined) b.weekendLeadSun=b.weekendLead||"";
    });
    DB.floors.forEach(f=>{
      if(f.weekendLeadSat===undefined) f.weekendLeadSat=f.weekendLead||"";
      if(f.weekendLeadSun===undefined) f.weekendLeadSun=f.weekendLead||"";
      if(f.plan===undefined) f.plan="";                               // uploaded drawing (data URL)
    });
    DB.contractors.forEach(c=>{
      if(c.weekendReviewerSat===undefined) c.weekendReviewerSat=c.weekendReviewer||"";
      if(c.weekendReviewerSun===undefined) c.weekendReviewerSun=c.weekendReviewer||"";
    });
    DB._v=14; saveDB();
  }
  if((DB._v||1)<15){
    // Reunite DSM-4's floors that got split across the old "D4" code and the current code,
    // then stamp the built-in DSM-4 drawings onto every level (nothing is deleted).
    const b4 = DB.buildings.find(x=>/^dsm-?4$/i.test(x.name)) || DB.buildings.find(x=>x.code==="DSM4"||x.code==="D4");
    if(b4){
      const code=b4.code;
      DB.floors.forEach(f=>{ if(f.b==="D4" && code!=="D4") f.b=code; });   // relink orphaned originals
      const seen={};
      DB.floors=DB.floors.filter(f=>{
        if(f.b!==code) return true;
        const k=f.name;
        if(!seen[k]){ seen[k]=f; return true; }
        const keep=seen[k];                                            // merge duplicate into the first, newest values win
        if(f.lead) keep.lead=f.lead;
        if(f.plan) keep.plan=f.plan;
        if(f.areas&&f.areas.length) keep.areas=f.areas;
        return false;
      });
      DB.floors.forEach(f=>{ if(f.b===code && !f.plan && DSM4PLANS[f.name]) f.plan=DSM4PLANS[f.name]; });
    }
    DB._v=15; saveDB();
  }
  if((DB._v||1)<16){
    // put DSM-4's levels in natural order (ground → interstitial → level 1 → …); admins can reorder freely after this
    const b4=DB.buildings.find(x=>/^dsm-?4$/i.test(x.name));
    if(b4){
      const code=b4.code;
      const order=["Ground Floor (GF)","Ground Floor Interstitial","First Floor (FF)","First Floor Interstitial","Second Floor (SF)","Second Floor Interstitial","Roof","Exterior / Outside DSM4"];
      const rank=n=>{ const i=order.indexOf(n); return i<0?900:i; };
      const others=DB.floors.filter(f=>f.b!==code);
      const mine=DB.floors.filter(f=>f.b===code).sort((a,b)=>rank(a.name)-rank(b.name));
      DB.floors=others.concat(mine);
    }
    DB._v=16; saveDB();
  }
  if((DB._v||1)<17){
    // Repair every building whose code was renamed but whose floors kept the old code.
    DB.buildings.forEach(b=>{ (LEGACY_CODES[b.code]||[]).forEach(oc=>{
      DB.floors.forEach(f=>{ if(f.b===oc) f.b=b.code; });   // adopt orphaned floors into the current code
    }); });
    DB._v=17; saveDB();
  }
  if((DB._v||1)<18){
    // Bring existing permits, their numbers, and the counters onto the current building codes (D4→DSM4, etc.).
    DB.permits.forEach(p=>{ const legacy=p.building; const cur=curCodeOf(legacy);
      if(cur&&cur!==legacy){
        if(p.number&&p.number.indexOf(legacy+"-")===0) p.number=cur+p.number.slice(legacy.length);
        p.building=cur;
      }
    });
    const nc={};
    Object.entries(DB.counters||{}).forEach(([k,v])=>{ let nk=k;
      DB.buildings.forEach(b=>{ (LEGACY_CODES[b.code]||[]).forEach(oc=>{ if(k.indexOf(oc+"-")===0) nk=b.code+k.slice(oc.length); }); });
      nc[nk]=Math.max(nc[nk]||0,v); });
    DB.counters=nc;
    DB._v=18; saveDB();
  }
}

function ownerDeletePermit(id){
  if(!IS_OWNER){ toast("Only the Owner can delete permits.","t-red"); return; }
  const i=DB.permits.findIndex(x=>x.id===id); if(i<0) return;
  const p=DB.permits[i];
  if(!confirm("Move permit "+p.number+" to the Trash?\n\nYou can restore it any time from Admin → 🗑 Trash. Its number will NOT be reused.")) return;
  p.deletedAt=new Date().toISOString(); p.deletedBy=currentActor(); p._u=Date.now();
  DB.trash.unshift(p); DB.permits.splice(i,1);
  logChange("🗑 Permit moved to Trash: "+p.number, typeOf(p.typeCode).name+" · "+p.company);
  saveDB(); toast("🗑 <b>"+esc(p.number)+"</b> moved to Trash — restore it from Admin → Trash.","t-dark");
  go("status"); route();
}
function trashRestore(i){
  const p=DB.trash[i]; if(!p) return;
  delete p.deletedAt; delete p.deletedBy; p._u=Date.now();
  DB.permits.unshift(p); DB.trash.splice(i,1);
  logChange("♻ Permit restored from Trash: "+p.number,"");
  saveDB(); toast("♻ <b>"+esc(p.number)+"</b> restored.","t-green"); route();
}
function trashForever(i){
  const p=DB.trash[i]; if(!p) return;

}

function nextPermitNumber(bCode,tCode){
  const k=bCode+"-"+tCode;
  const used = DB.permits.filter(p=>p.number&&p.number.startsWith(k+"-")).map(p=>parseInt(p.number.split("-").pop(),10)||0);
  const cur = Math.max(DB.counters[k]||0, ...(used.length?used:[0]));
  DB.counters[k]=cur+1;
  return k+"-"+String(cur+1).padStart(3,"0");
}

"Say where you're working":"Diga dónde va a trabajar","Pick the building and floor. Tap “View Floor Plan” to see the drawing and find your sector or room. The floor's Jacobs lead is selected for you automatically.":"Elija el edificio y el piso. Toque “Ver Plano del Piso” para ver el dibujo y encontrar su sector o cuarto. El líder de Jacobs del piso se selecciona automáticamente.",
"Your info":"Sus datos","Company, your name, and phone. If you're also the foreman, tap “Foreman is the same person as the requester” — done, no retyping.":"Compañía, su nombre y teléfono. Si usted también es el capataz, toque “El capataz es la misma persona” — listo, sin volver a escribir.",
"When and what":"Cuándo y qué","Day or night shift, start date, permit good-through date, start time, and describe the work in plain words: “welding pipe supports on the mezzanine.”":"Turno de día o noche, fecha de inicio, fecha de vencimiento, hora de inicio, y describa el trabajo en palabras sencillas: “soldando soportes de tubería en el mezzanine.”",
"Answer the safety questions":"Responda las preguntas de seguridad","Quick Yes/No taps — fire extinguisher available? Area checked? They match the project safety plan.":"Toques rápidos de Sí/No — ¿hay extintor disponible? ¿Se revisó el área? Corresponden al plan de seguridad del proyecto.",
"You instantly get a permit number like D4-HW-028 on a gold ticket. Write it on your hard-copy permit. Then tap “Text” to send it to the Jacobs reviewer — the message is already written for you.":"Al instante recibe un número de permiso como D4-HW-028 en un boleto dorado. Escríbalo en su permiso físico. Luego toque “Texto” para enviarlo al revisor de Jacobs — el mensaje ya está escrito.",
"Track it":"Sígalo","“My Permits” shows where your request is — three steps: Under Review → Active → Completed. The moment Jacobs approves, it goes Active and you can work. When the job's done, YOU mark it complete right from your phone.":"“Mis Permisos” muestra su solicitud en tres pasos: En Revisión → Activo → Completado. En cuanto Jacobs aprueba, pasa a Activo y puede trabajar. Cuando termine el trabajo, USTED lo marca completado desde su teléfono.",
"Tomorrow: copy it":"Mañana: cópielo","Same job tomorrow? Tap “Copy This Permit” — everything fills in, you just confirm the date. 30 seconds.":"¿El mismo trabajo mañana? Toque “Copiar Este Permiso” — todo se llena solo, usted solo confirma la fecha. 30 segundos.",

/* ---------- Auto-expiration (daily permits) ---------- */
function expireSweep(){
  const t=today(); let n=0;
  DB.permits.forEach(p=>{
    if(["Approved","Active"].includes(p.status) && p.goodThrough && p.goodThrough < t){
      p.status="Expired";
      p.audit.push({at:new Date().toISOString(), by:"System", role:"system", action:"Status: auto-expired", detail:"Permit good-through date "+p.goodThrough+" passed without completion."});
      p._u=Date.now();
      n++;
    }
  });
  if(n) saveDB();
  return n;
}

    ${notifyBtns(p.phone,p.email,"Permit "+p.status+": "+p.number,msgForContractor(p),p.requestedBy)}

/* Escalation timers — clock starts at scheduled work start (or submission, whichever is later) */
function notifyActive(){
  const s=DB.settings;
  if(!s.notifyOn) return false;
  return (s.notifyDays||[0,1,2,3,4,5,6]).includes(new Date().getDay());
}
// Master switch for the "who reviews / who gets notified" layer.
// ON  → floor leads, superintendents, safety managers are assigned, shown, and notified.
// OFF → pure record-keeping: permit numbers only, no reviewer assignment, no names shown, no alerts.
function routingOn(){ return DB.settings.notifyOn!==false; }
function escBase(p){
  if(!p.submittedAt) return null;
  let base=new Date(p.submittedAt);
  if(p.startDate){
    const st=new Date(p.startDate+"T"+(p.startTime&&/^\d\d:\d\d/.test(p.startTime)?p.startTime:"07:00"));
    if(!isNaN(st)&&st>base) base=st;
  }
  return base;
}
function ageMin(p){ const b=escBase(p); return b? Math.max(0,Math.floor((Date.now()-b.getTime())/60000)) : 0; }
function ageChip(p){
  if(!["Submitted","Under Review"].includes(p.status)) return "";
  const b=escBase(p); if(!b) return "";
  if(b.getTime()>Date.now()) return `<span class="age sch">🕐 Clock starts ${fmtDT(b.toISOString())}</span>`;
  const m=ageMin(p), r1=+DB.settings.remind1||15, r2=+DB.settings.remind2||30;
  const lbl=m>=60? Math.floor(m/60)+"h "+(m%60)+"m" : m+" min";
  if(!notifyActive()) return `<span class="age neu">⏱ ${lbl}</span>`;
  if(m>=r2) return `<span class="age red">⏱ ${lbl} — URGENT</span>`;
  if(m>=r1) return `<span class="age yel">⏱ ${lbl} — reminder</span>`;
  return `<span class="age ok">⏱ ${lbl}</span>`;
}
/* Toasts — instant feedback for every action */
function toast(msg,kind){
  let h=document.getElementById("toastHost");
  if(!h){ h=document.createElement("div"); h.id="toastHost"; document.body.appendChild(h); }
  const t=document.createElement("div"); t.className="toast "+(kind||"t-dark"); t.innerHTML=msg;
  h.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{ t.classList.remove("show"); setTimeout(()=>t.remove(),450); },4500);
}
function enableAlerts(){
  if(!("Notification" in window)){ toast("This browser doesn't support pop-up alerts.","t-red"); return; }
  if(DB.settings.alerts&&Notification.permission==="granted"){
    DB.settings.alerts=false; saveDB(); toast("🔕 Pop-ups OFF for this device.","t-dark"); route(); return;
  }
  Notification.requestPermission().then(perm=>{
    if(perm==="granted"){ DB.settings.alerts=true; saveDB();
      new Notification("Permit Portal alerts on ✔",{body:"Keep this tab open — you'll get pop-ups for new and overdue permits."});
      toast("🔔 Pop-ups ON — this device will chime when permits arrive or wait too long.","t-green");
      route();
    } else toast("Pop-ups were blocked — allow notifications for this site in your browser settings.","t-red");
  });
}
function alertSweep(){
  if(!notifyActive()) return;
  if(!DB.settings.alerts||!("Notification" in window)||Notification.permission!=="granted") return;
  const r1=+DB.settings.remind1||15, r2=+DB.settings.remind2||30; let dirty=false;
  DB.permits.forEach(p=>{
    if(!["Submitted","Under Review"].includes(p.status)) return;
    const m=ageMin(p);
    const rv=DB.reviewers.find(x=>x.name===p.reviewer)||{};
    if(m>=r2&&!p.n2){ p.n2=1; dirty=true; new Notification("🚨 URGENT — "+p.number+" waiting "+m+" min",{body:"Notify the permit office. "+typeOf(p.typeCode).name+" · "+p.company+" · reviewer "+p.reviewer,tag:p.id+"u"}); }
    else if(m>=r1&&!p.n1){ p.n1=1; dirty=true; new Notification("⏰ Escalate — "+p.number+" waiting "+m+" min",{body:(p.reviewer||"Reviewer")+" hasn't approved."+(rv.supName?" Text supervisor "+rv.supName+" from the permit page.":""),tag:p.id+"r"}); }
  });
  // equipment inspection reminders — 30 days, 15 days, and overdue
  (DB.equipment||[]).forEach(e=>{
    if(!e.inspDue) return;
    const dd=Math.ceil((new Date(e.inspDue+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000);
    const tag=(e.name||e.type)+" (SN "+e.serial+") — "+e.company;
    if(dd<0&&!e.nOD){ e.nOD=1; dirty=true; new Notification("🔴 Inspection OVERDUE: "+tag,{body:"Was due "+fmtD(e.inspDue)+". Responsible: "+(e.responsible||"—"),tag:e.id+"od"}); }
    else if(dd>=0&&dd<=15&&!e.n15){ e.n15=1; dirty=true; new Notification("🟠 Inspection due in "+dd+" days: "+tag,{body:"Due "+fmtD(e.inspDue),tag:e.id+"15"}); }
    else if(dd>15&&dd<=30&&!e.n30){ e.n30=1; dirty=true; new Notification("🟡 Inspection coming up: "+tag,{body:"Due "+fmtD(e.inspDue),tag:e.id+"30"}); }
  });
  if(dirty) saveDB();
}

/* ---------- Router ---------- */
const VIEWS={};
function go(view,arg){ location.hash = "#/"+view+(arg?("/"+encodeURIComponent(arg)):""); }
function route(){
  const h=location.hash.replace(/^#\/?/,"");
  const [v,arg]=h.split("/");
  const qs=new URLSearchParams(location.search);
  // 🔒 SECURITY GATE — no view renders until the person has signed in (company + name). Cannot be bypassed.
  if(!signedIn()){ if(!document.querySelector(".modal-bk")) openRoleModal(null,true); return; }
  expireSweep();
  const fn=VIEWS[v||"home"]||VIEWS.home;
  // role guards
  if(["dashboard","review","board","myreviews","forms"].includes(v) && ROLE==="contractor"){ openRoleModal("Jacobs sign-in required for that page."); return; }
  if(["dashboard","review","myreviews","types","form"].includes(v) && ROLE==="safety"){ openRoleModal("Safety managers have view access — permits are submitted by supervisors."); return; }
  // equipment is open to every role — anyone on site can look up a machine
  if(["admin","reports"].includes(v) && ROLE!=="admin"){ openRoleModal("Admin sign-in required for that page."); return; }
  const keep=window._keepScroll; window._keepScroll=false;
  const y=window.scrollY;
  document.getElementById("app").innerHTML = fn(decodeURIComponent(arg||""), qs);
  if(keep) window.scrollTo(0,y); else { window.scrollTo(0,0); animateNums(); }
  const NAV_ALIAS={form:"types",help:"types",confirm:"status",view:"status",copy:"home",review:"dashboard",howto:ROLE==="contractor"?"howto":"dashboard"};
  renderNav(NAV_ALIAS[v]||v||"home");
  if(window._afterRender){ const f=window._afterRender; window._afterRender=null; f(); }
}
window.addEventListener("hashchange",route);

document.addEventListener("click",e=>{ const el=e.target; if(el&&el.tagName==="INPUT"&&el.type==="date"&&typeof el.showPicker==="function"){ try{ el.showPicker(); }catch(_){}} });

/* ---------- Animated counters (futuristic count-up) ---------- */
function animateNums(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll("[data-cnt]").forEach(el=>{
    const end=+el.dataset.cnt; if(isNaN(end)||end<=0) return;
    const t0=performance.now(), dur=650;
    const step=n=>{ const p=Math.min(1,(n-t0)/dur);
      el.textContent=Math.round(end*(1-Math.pow(1-p,3)));
      if(p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

  `<div class="modal-bk"${locked?"":` onclick="if(event.target===this)closeModal()"`}><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal(){ if(!signedIn()) return;   // can't dismiss the sign-in gate

function openRoleModal(msg, locked){

        <button data-r="admin" class="${ROLE==="admin"?"on":""}" style="min-width:46%">⚙️ Admin<br><small style="font-weight:600">Full access</small></button>

      <select class="f-in" id="roleCo" onchange="document.getElementById('roleCoNewWrap').style.display=this.value==='__NEW__'?'block':'none';if(this.value==='__NEW__')setTimeout(()=>document.getElementById('roleCoNew').focus(),40)">

    <div class="f-group"><label class="f-label">My name</label>
      <input class="f-in" id="roleName" value="${esc(MYNAME)}" placeholder="Your name"></div>
    <div class="f-group" id="pinWrap" style="display:none"><label class="f-label">PIN</label>
      <input class="f-in" id="rolePin" type="password" inputmode="numeric" placeholder="Enter PIN">
      <div class="hint" id="pinHint"></div></div>
    <div class="btnrow">
      <button class="btn btn-g" id="roleGo" onclick="applyRole()">✓ ${T("Continue")}</button>
      ${locked?"":`<button class="btn btn-line btn-cancel" onclick="closeModal()">${T("Cancel")}</button>`}
    </div>
    <div class="hint center" style="margin-top:8px">${locked?"🔒 "+T("Your company and name are required to continue."):"Press <b>Enter</b> to continue."}</div>`, locked);
  const seg=document.getElementById("roleSeg");
  let sel=ROLE;
  const sync=()=>{ const needsPin=["jacobs","admin","safety"].includes(sel), needsCo=sel==="contractor";
                   document.getElementById("pinWrap").style.display = needsPin?"block":"none";
                   document.getElementById("coWrap").style.display = needsCo?"block":"none";
                   const ph=document.getElementById("pinHint"); if(ph) ph.textContent =
                     sel==="admin"?"Your personal admin PIN (managed in Admin → Admin Users)."
                     :sel==="safety"?"Your safety access PIN — ask the permit office (Admin → Safety Access)."
                     :"Jacobs reviewer PIN (set in Admin → Settings).";
                   setTimeout(()=>{(needsPin?document.getElementById("rolePin"):document.getElementById("roleName"))?.focus();},60); };
  seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{ seg.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); sel=b.dataset.r; sync(); });
  sync();
  document.querySelector(".modal").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); applyRole(); } });
  window.applyRole=()=>{
    let name=document.getElementById("roleName").value.trim();
    IS_OWNER=false; sessionStorage.removeItem("ppp_owner");
    if(sel==="jacobs"){
      const pin=document.getElementById("rolePin").value;
      if(pin!==DB.settings.pin){ alert("Incorrect PIN."); return; }
      if(!name){ alert("Please enter your name — sign-ins are recorded."); return; }
    } else if(sel==="admin"){
      const pin=document.getElementById("rolePin").value;
      const own=DB.settings.owner||{};
      if(pin===own.pin){ IS_OWNER=true; sessionStorage.setItem("ppp_owner","1"); if(!name) name=own.name||"Owner"; }
      else{
        const adm=(DB.settings.admins||[]).find(a=>a.pin===pin);
        if(!adm){ alert("Incorrect PIN."); return; }
        if(!name) name=adm.name;
      }
    } else if(sel==="safety"){
      const pin=document.getElementById("rolePin").value;
      const su=(DB.safetyUsers||[]).find(u=>u.pin===pin);
      if(!su){ alert("Incorrect safety PIN. Ask the permit office to set you up under Admin → Safety Access."); return; }
      MYCO=su.company; sessionStorage.setItem("ppp_company",MYCO);
      if(!name) name=su.name;
    } else {
      let co=document.getElementById("roleCo").value;
      if(co==="__NEW__"){ co=(document.getElementById("roleCoNew").value||"").trim();
        if(!co){ alert("Type your company name."); return; }
        registerNewCompany(co, name);   // add it to Trade Partners for an admin to complete
      }
      MYCO=co; sessionStorage.setItem("ppp_company",MYCO);
      if(!name){ alert("Please enter your name — sign-ins are recorded."); return; }
    }
    if(!name){ alert("Please enter your name — sign-ins are recorded."); return; }   // final safety net for every role
    sessionStorage.setItem("ppp_signedin","1");   // ✅ signed in — the gate can now close and the portal unlocks
    closeModal();
    logAccess(sel==="admin"&&IS_OWNER?"owner":sel, name, ["contractor","safety"].includes(sel)?MYCO:"");
    setRole(sel,name);
  };
}

/* ---- Form (5 steps) ---- */
let F=null; // working form state
function blankForm(tCode){
  const qs=new URLSearchParams(location.search);
  // Resolve the starting building to a REAL current code (fixes empty floor list on first open).
  let bcode=qs.get("b")||"";
  if(bcode && !DB.buildings.some(b=>b.code===bcode)){                 // old/legacy code from a QR link → map to current
    const cur=DB.buildings.find(b=>(LEGACY_CODES[b.code]||[]).indexOf(bcode)>=0);
    bcode=cur?cur.code:"";
  }
  if(!bcode) bcode=(DB.buildings.find(b=>b.active)||{}).code||"";     // default to the first active building
  return { typeCode:tCode, building:bcode, floor:qs.get("f")||"", area:"", location:"",
    company:MYCO||"", requestedBy:MYNAME||"", phone:"", email:"", foreman:"", foremanPhone:"",
    shift:"Days", startDate:today(), goodThrough:today(), startTime:"", endTime:"",
    description:"", equipment:"", workers:"", paperwork:"", jha:"", permitDocs:"",
    reviewer:"", notes:"", answers:{}, needLinked:"", linkedTypes:[], step:1, editingId:null };
}
function startForm(tCode){ F=blankForm(tCode); go("form",1); }
function goStep(n){ if(F){ go("form",n); } }   // clickable tabs jump to any step for review
function copyPermit(id){
  const p=DB.permits.find(x=>x.id===id); if(!p) return;
  F={...blankForm(p.typeCode), building:p.building, floor:p.floor, area:p.area, location:p.location,
     company:p.company, requestedBy:p.requestedBy, phone:p.phone, email:p.email, foreman:p.foreman, foremanPhone:p.foremanPhone,
     shift:p.shift, startDate:today(), goodThrough:today(), startTime:p.startTime, endTime:p.endTime,
     description:p.description, equipment:p.equipment, workers:p.workers, paperwork:p.paperwork, jha:p.jha,
     permitDocs:p.permitDocs, reviewer:p.reviewer, notes:p.notes, answers:{...(p.answers||{})}};
  go("form");
}
function editPermit(id){ // Needs Update flow
  const p=DB.permits.find(x=>x.id===id); if(!p) return;
  F={...JSON.parse(JSON.stringify(p)), step:1, editingId:id};
  go("form");
}

/* ---------- Who reviews this permit? One simple chain ----------
   WEEKEND (Sat/Sun) supersedes everything — set once per building, Saturday and Sunday can differ:
       building's Saturday lead   (or Sunday lead)
   WEEKDAY (floor leads come FIRST — they override contractor superintendents):
       [General Superintendent override — ONLY if turned on] → level's floor lead (when the building's floor-leads switch is ON) → contractor's Jacobs superintendent
   (each step falls to the next when empty; nothing assigned → requester picks) --------------------------- */
function autoReviewer(){
  const co=DB.contractors.find(c=>c.name===F.company);
  const fo=floorObj(F.building,F.floor);
  const b=bldOf(F.building);
  const g=dowOf(F.startDate); const isSat=g===6, isSun=g===0;
  if((isSat||isSun) && b){
    const n=(isSat?b.weekendLeadSat:b.weekendLeadSun)||b.weekendLead||"";
    if(n) return {name:n, src:"bldg-wknd", label:"🗓️ "+(isSat?"Saturday":"Sunday")+" lead for "+esc(b.name)};
  }
  // General Superintendent overrides floor leads ONLY when the admin explicitly turns the override on
  if(b&&b.gsOverride&&b.lead) return {name:b.lead, src:"building", label:"general superintendent for "+esc(b.name)};
  const floorLeadsOn = b ? (b.floorLeadsOn!==false) : true;
  if(floorLeadsOn && fo && fo.lead) return {name:fo.lead, src:"floor", label:"floor lead for "+esc(F.floor)};   // floor lead beats contractor superintendent
  if(co&&co.reviewer) return {name:co.reviewer, src:"company", label:esc(co.name)+"'s assigned Jacobs superintendent"};
  return null;   // nothing assigned → requester picks on the review step
}
function dayChips(){
  const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  let out="";
  for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()+i);
    const ds=ymd(d), dow=d.getDay(), wknd=(dow===0||dow===6);
    out+=`<button class="daychip ${F.startDate===ds?"on":""} ${wknd?"wknd":""} ${i===0?"istoday":""}" onclick="pickDay('${ds}')" type="button" title="${i===0?T('today'):esc(T(names[dow]))}">
      <span class="dc-day">${T(names[dow])}</span>
      <span class="dc-date">${d.getMonth()+1}/${d.getDate()}</span></button>`;
  }
  return out;
}

function validateStep(){
  const errs=[];
  const need=(v,l)=>{ if(!v||!String(v).trim()) errs.push(l); };
  if(F.step===1){ need(F.building,"Building"); need(F.floor,"Floor / Level"); need(F.location,"Specific Work Location"); }
  if(F.step===2){ need(F.company,"Contractor Company"); need(F.requestedBy,"Requested By"); need(F.phone,"Requester Phone"); }
  if(F.step===3){ need(F.startDate,"Start Date"); need(F.goodThrough,"Permit Good Through"); need(F.description,"What work are you doing?");
    if(F.startDate&&F.goodThrough&&F.goodThrough<F.startDate) errs.push("Permit Good Through cannot be before the Start Date"); }
  if(F.step===4){ need(F.paperwork,"Required paperwork submitted?"); need(F.jha,"JHA / SSOW available?");
    const t=typeOf(F.typeCode); (t.q||[]).forEach((q,i)=>{ if(!F.answers["q:"+i]) errs.push("Safety question: "+q); }); }
  if(F.step===5){ if(routingOn()) need(F.reviewer,"Requested Jacobs Reviewer"); }
  return errs;
}
