<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f1b2d">
<title>Project Permit Portal — Request. Review. Approve. Track.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0c1524; --navy2:#132238; --charcoal:#22303f;
  --yellow:#ffb81c; --yellow-d:#e6a400;
  --green:#1e8e3e; --green-d:#0f6f32;
  --blue:#1a73e8; --blue-d:#174ea6;
  --orange:#e8710a; --red:#d93025; --gray:#8a94a0; --gray-l:#e9edf2;
  --bg:#eef1f6; --card:#ffffff; --text:#141d29; --muted:#5b6773;
  --radius:18px;
  --shadow:0 1px 2px rgba(13,22,38,.05),0 6px 18px rgba(13,22,38,.07);
  --shadow-lg:0 2px 4px rgba(13,22,38,.06),0 14px 40px rgba(13,22,38,.13);
  --gold-grad:linear-gradient(135deg,#ffc94a,#ffb81c 55%,#f0a500);
  --navy-grad:linear-gradient(160deg,#16263f 0%,#0c1524 70%);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:
  radial-gradient(1200px 500px at 85% -10%, #dfe7f3 0%, transparent 60%),
  radial-gradient(900px 420px at -10% 0%, #e8ecf5 0%, transparent 55%),
  var(--bg);
  color:var(--text);font-size:16px;line-height:1.45;min-height:100vh;font-feature-settings:"cv02","cv03"}
::selection{background:#ffb81c55}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:var(--blue);text-decoration:none}

/* ===== Header ===== */
header{background:var(--navy-grad);color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 20px rgba(4,10,20,.35);border-bottom:1px solid rgba(255,184,28,.28)}
.hdr-in{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:11px;cursor:pointer}
.logo-badge{width:40px;height:40px;border-radius:11px;background:var(--gold-grad);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;letter-spacing:-.5px;flex:none;box-shadow:0 3px 10px rgba(255,184,28,.35),inset 0 1px 0 rgba(255,255,255,.45)}
.logo h1{font-size:17.5px;font-weight:800;line-height:1.15;letter-spacing:-.2px}
.logo small{display:block;font-size:10.5px;font-weight:600;color:#9fb0c6;letter-spacing:1.6px;text-transform:uppercase;margin-top:1px}
.hdr-sp{flex:1}
.rolewrap{display:flex;align-items:center;gap:8px}
.themebtn{background:var(--navy2);border:1px solid #2c3e57;border-radius:99px;width:38px;height:34px;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:filter .15s}
.themebtn:hover{filter:brightness(1.3)}
.langwrap{display:flex;gap:0;border:1px solid #2c3e57;border-radius:99px;overflow:hidden}
.langwrap .lang{background:var(--navy2);color:#8fa0b8;border:none;padding:7px 13px;font-size:12.5px;font-weight:800;letter-spacing:.5px}
.langwrap .lang.on{background:var(--gold-grad);color:var(--navy)}
.rolebtn{background:var(--navy2);color:#cfd8e3;border:1px solid #2c3e57;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.rolebtn .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow)}
nav.mainnav{background:var(--navy2);border-top:1px solid #24334a}
.nav-in{max-width:1200px;margin:0 auto;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav-in a{color:#aab6c6;padding:12px 15px;font-size:13.5px;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;transition:color .12s}
.nav-in a.on{color:var(--yellow);border-bottom-color:var(--yellow);background:linear-gradient(180deg,transparent 40%,rgba(255,184,28,.14));font-weight:800}
.nav-in a:hover{color:#fff}
.nav-in a:active{background:rgba(255,255,255,.06)}

/* ===== Layout ===== */
main{max-width:1200px;margin:0 auto;padding:20px 14px 90px;animation:pgIn .28s ease both}
@keyframes pgIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.narrow{max-width:680px;margin:0 auto}
.mid{max-width:860px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px;border:1px solid rgba(19,34,56,.055);transition:box-shadow .18s}
.card.tight{padding:15px 17px}
h2.page{font-size:24px;font-weight:800;margin:4px 0 4px;letter-spacing:-.4px}
p.sub{color:var(--muted);font-size:14.5px;margin-bottom:16px}
.section-t{font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:4px 0 10px}
hr.div{border:none;border-top:1px solid var(--gray-l);margin:16px 0}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:13px;font-weight:700;font-size:16px;padding:14px 22px;min-height:52px;transition:transform .08s, filter .15s, box-shadow .18s;text-align:center;letter-spacing:-.1px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn-y{background:var(--gold-grad);color:var(--navy);box-shadow:0 4px 14px rgba(255,184,28,.38),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-y:hover{filter:brightness(1.04);box-shadow:0 7px 20px rgba(255,184,28,.48),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-dark{background:var(--navy-grad);color:#fff;box-shadow:0 4px 14px rgba(12,21,36,.3)}
.btn-g{background:linear-gradient(135deg,#27a04a,#1e8e3e);color:#fff;box-shadow:0 4px 14px rgba(30,142,62,.32)}
.btn-o{background:linear-gradient(135deg,#f5821f,#e8710a);color:#fff;box-shadow:0 4px 14px rgba(232,113,10,.3)}
.btn-r{background:linear-gradient(135deg,#e4453a,#d93025);color:#fff;box-shadow:0 4px 14px rgba(217,48,37,.3)}
.btn-b{background:linear-gradient(135deg,#3585f2,#1a73e8);color:#fff;box-shadow:0 4px 14px rgba(26,115,232,.3)}
.btn-line{background:#fff;color:var(--text);border:2px solid #d5dbe3}
.btn-line:hover{border-color:var(--navy);box-shadow:var(--shadow)}
.btn-cancel:hover{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
.btn-ghost{background:transparent;color:var(--muted);border:none;font-weight:600}
.btn-sm{min-height:38px;padding:7px 14px;font-size:13.5px;border-radius:9px}
.btn-block{display:flex;width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1;min-width:150px}

/* ===== Status badges ===== */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:99px;white-space:nowrap;letter-spacing:.2px}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-Draft{background:#eef1f5;color:#5b6773}
.st-Submitted{background:#fff3cd;color:#8a6400}
.st-UnderReview{background:#e2edfd;color:#174ea6}
.st-NeedsUpdate{background:#fdebd9;color:#a4520a}
.st-Approved{background:#e0f2e5;color:#0f6f32}
.st-Active{background:#1e8e3e;color:#fff}
.st-Completed{background:#dbe4f7;color:#1f3a72}
.st-Expired{background:#e5e8ec;color:#6b7684}
.st-Void{background:#3a4450;color:#e6e9ee}
.st-Lost{background:#fde2e0;color:#b3140a}
.st-Rejected{background:#fde2e0;color:#b3140a}

/* ===== Forms ===== */
.f-group{margin-bottom:15px}
.f-label{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px;color:#33404d}
.f-label .req{color:var(--red);margin-left:2px}
.f-in,select.f-in,textarea.f-in{width:100%;border:2px solid #d5dbe3;border-radius:11px;padding:13px 14px;min-height:50px;background:#fff;color:var(--text)}
.f-in:focus{outline:none;border-color:var(--blue)}
.f-in.err{border-color:var(--red);background:#fff7f6}
textarea.f-in{min-height:90px;resize:vertical}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.f-row{grid-template-columns:1fr}}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;min-height:52px;border:2px solid #d5dbe3;background:#fff;border-radius:11px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.seg.yn button.on.yes{border-color:var(--green);background:var(--green)}
.seg.yn button.on.no{border-color:var(--gray);background:var(--gray)}
.linkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.linkopt{border:2px solid #d5dbe3;background:#fff;border-radius:11px;padding:11px 12px;font-weight:600;font-size:13.5px;text-align:left;color:var(--muted);transition:all .12s}
.linkopt.on{border-color:var(--navy);background:var(--navy);color:#fff;box-shadow:0 3px 10px rgba(12,21,36,.25)}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.errbox{background:#fde2e0;color:#8f1007;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:600;margin-bottom:14px;display:none}

/* ===== Stepper ===== */
.steps{display:flex;gap:4px;margin-bottom:18px}
.steps .stp{flex:1;text-align:center}
.steps .bar{height:5px;border-radius:99px;background:#dfe4ea;margin-bottom:6px}
.steps .on .bar{background:var(--yellow)}
.steps .done .bar{background:var(--green)}
.steps span{font-size:10.5px;font-weight:700;color:#98a2ad;text-transform:uppercase;letter-spacing:.4px}
.steps .on span{color:var(--text)}

/* ===== Permit type grid ===== */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{background:#fff;border:2px solid #e3e8ee;border-radius:var(--radius);padding:16px;cursor:pointer;display:flex;gap:13px;align-items:flex-start;transition:border-color .14s, box-shadow .18s, transform .12s;text-align:left}
.tcard:hover{border-color:var(--yellow);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.tcard .ico{font-size:26px;width:48px;height:48px;flex:none;background:#f2f5f9;border-radius:11px;display:flex;align-items:center;justify-content:center}
.tcard b{font-size:15.5px;display:block}
.tcard .code{display:inline-block;font-size:11px;font-weight:800;background:var(--navy);color:var(--yellow);border-radius:5px;padding:1px 7px;margin:3px 0 5px}
.tcard p{font-size:12.8px;color:var(--muted);line-height:1.4}
.tcard.hr-flag{border-left:5px solid var(--yellow)}

/* ===== Tracker ===== */
.tracker{display:flex;align-items:center;margin:14px 0;overflow-x:auto;padding-bottom:4px}
.tk{display:flex;flex-direction:column;align-items:center;min-width:74px;flex:1}
.tk .cir{width:30px;height:30px;border-radius:50%;background:#dfe4ea;color:#98a2ad;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;z-index:1}
.tk.done .cir{background:var(--green);color:#fff}
.tk.now .cir{background:var(--yellow);color:var(--navy);box-shadow:0 0 0 4px #ffb81c40}
.tk span{font-size:10.5px;font-weight:700;color:#98a2ad;margin-top:5px;text-align:center}
.tk.done span,.tk.now span{color:var(--text)}
.tk-line{height:3px;flex:1;background:#dfe4ea;margin:0 -18px;position:relative;top:-13px;min-width:12px}
.tk-line.done{background:var(--green)}
.tracker.dead{opacity:.45}

/* ===== Summary cards ===== */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.sum{background:#fff;border-radius:15px;box-shadow:var(--shadow);padding:14px 15px;cursor:pointer;border:2px solid rgba(19,34,56,.05);transition:box-shadow .18s, transform .12s, border-color .14s}
.sum:hover{border-color:#c9d2dd;box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.sum.on{border-color:var(--navy)}
.sum b{font-size:27px;display:block;line-height:1.1;letter-spacing:-.8px;font-weight:800}
.sum span{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.sum .tick{width:26px;height:4px;border-radius:99px;display:block;margin-top:7px}
.sumgrid.compact{grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.sumgrid.compact .sum{padding:10px 11px;border-radius:12px}
.sumgrid.compact .sum b{font-size:21px}
.sumgrid.compact .sum span{font-size:9.8px;letter-spacing:.2px}
.sumgrid.compact .sum .tick{margin-top:5px;height:3px}

/* ===== Tables & permit cards ===== */
.tblwrap{overflow-x:auto;border-radius:12px;box-shadow:var(--shadow);background:#fff}
table.tbl{width:100%;border-collapse:collapse;min-width:760px}
table.tbl th{background:var(--navy-grad);color:#cfd8e3;font-size:11px;text-transform:uppercase;letter-spacing:.7px;text-align:left;padding:12px;white-space:nowrap}
table.tbl td{padding:11px 12px;border-top:1px solid #eef1f5;font-size:13.8px;vertical-align:middle}
table.tbl tr:hover td{background:#f7f9fc}
.pnum{font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px}
.pcard{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.pcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pcard .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.pcard .meta b{color:var(--text);font-weight:600}
.kv{display:grid;grid-template-columns:190px 1fr;gap:7px 14px;font-size:14.5px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{font-weight:600}
@media(max-width:560px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px}}

/* ===== Filters ===== */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.filters .f-in{width:auto;min-width:130px;flex:1;min-height:44px;padding:8px 12px;font-size:14px}
.filters input.f-in{min-width:170px}

/* ===== Hero (landing) — animated construction site ===== */
.hero{border-radius:22px;padding:38px 30px 96px;color:#fff;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
  border:7px solid transparent;
  border-image:repeating-linear-gradient(45deg,var(--yellow) 0 13px,#141d2b 13px 26px) 7;
  background:
    repeating-linear-gradient(0deg, rgba(122,160,220,.075) 0 1px, transparent 1px 36px),
    repeating-linear-gradient(90deg, rgba(122,160,220,.075) 0 1px, transparent 1px 36px),
    radial-gradient(560px 300px at 90% -10%, rgba(255,184,28,.17), transparent 60%),
    radial-gradient(500px 320px at -8% 110%, rgba(26,115,232,.22), transparent 60%),
    linear-gradient(158deg,#17293f 0%, #0c1524 62%, #0a1220 100%)}
.hero::before{content:"";position:absolute;top:-80px;right:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,184,28,.24),transparent 70%);animation:heroGlow 6s ease-in-out infinite}
@keyframes heroGlow{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
/* --- living construction scene --- */
.hero-site{position:absolute;bottom:0;left:0;right:0;width:100%;height:150px;pointer-events:none}
.hs-win{animation:winOn 9s linear infinite;opacity:0}
@keyframes winOn{0%,12%{opacity:0}18%,88%{opacity:1}94%,100%{opacity:0}}
.hs-hook{animation:hookDrop 7s ease-in-out infinite}
@keyframes hookDrop{0%,100%{transform:translateY(0)}45%,60%{transform:translateY(34px)}}
.hs-arm{transform-origin:920px 14px;animation:armSway 11s ease-in-out infinite}
@keyframes armSway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3.5deg)}}
.hs-drone{animation:droneFly 16s linear infinite}
@keyframes droneFly{0%{transform:translateX(-140px)}100%{transform:translateX(1340px)}}
.hs-spark{animation:sparkle 1.6s ease-in-out infinite;transform-origin:center}
@keyframes sparkle{0%,100%{opacity:.15}50%{opacity:1}}
.hs-rise{animation:blockRise 9s ease-out infinite}
@keyframes blockRise{0%,8%{opacity:0;transform:translateY(16px)}22%,86%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateY(16px)}}
@media (prefers-reduced-motion: reduce){.hs-win,.hs-hook,.hs-arm,.hs-drone,.hs-spark,.hs-rise,.hero::before{animation:none;opacity:1}}
/* colored stat + action tiles */
.hero-tile .ht-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.hero-tile:nth-child(1) .ht-ico{background:linear-gradient(135deg,#e2edfd,#c3dafc)}
.hero-tile:nth-child(2) .ht-ico{background:linear-gradient(135deg,#e0f2e5,#c2e5cc)}
.hero-strip>div:nth-child(1){background:linear-gradient(160deg,#eaf1fe,#dbe7fb);border-color:#c3d7f5}
.hero-strip>div:nth-child(1) b{color:#174ea6}
.hero-strip>div:nth-child(2){background:linear-gradient(160deg,#e9f7ee,#d8efe0);border-color:#bfe3cc}
.hero-strip>div:nth-child(2) b{color:#0f6f32}
.hero-strip>div:nth-child(3){background:linear-gradient(160deg,#fdf3e2,#fae7c6);border-color:#f0d49a}
.hero-strip>div:nth-child(3) b{color:#8a5a00}
.hero-kicker{display:inline-flex;align-items:center;gap:7px;background:rgba(255,184,28,.13);border:1px solid rgba(255,184,28,.45);color:var(--yellow);font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;border-radius:99px;padding:7px 15px;margin-bottom:16px;box-shadow:0 0 22px rgba(255,184,28,.15)}
.hero h2{font-size:34px;font-weight:900;line-height:1.1;letter-spacing:-.9px;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.hero h2 em{font-style:normal;color:var(--yellow);text-shadow:0 0 28px rgba(255,184,28,.45)}
.hero p{color:#bcc8da;font-size:15px;margin-top:13px;max-width:460px}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:520px){.hero-row{grid-template-columns:1fr}}
.hero-tile{background:#fff;border:2px solid rgba(19,34,56,.07);border-radius:18px;padding:18px 16px;text-align:left;box-shadow:var(--shadow);transition:transform .12s, box-shadow .18s, border-color .14s;cursor:pointer}
.hero-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--yellow)}
.hero-tile .ht-ico{font-size:26px;display:block;margin-bottom:8px}
.hero-tile b{font-size:15.5px;display:block;letter-spacing:-.2px}
.hero-tile small{color:var(--muted);font-size:12.5px;font-weight:600}
.hero-strip{display:flex;gap:10px;margin-top:14px}
.hero-strip>div{flex:1;background:rgba(255,255,255,.66);backdrop-filter:blur(8px);border:1px solid rgba(19,34,56,.07);border-radius:15px;padding:12px 8px;text-align:center}
.hero-strip b{font-size:22px;font-weight:800;display:block;letter-spacing:-.5px;color:var(--navy)}
.hero-strip span{font-size:10.8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

/* ===== Cinematic intro sequence ===== */
#intro{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  background:
    repeating-linear-gradient(0deg, rgba(122,160,220,.06) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(90deg, rgba(122,160,220,.06) 0 1px, transparent 1px 42px),
    radial-gradient(700px 420px at 50% 115%, rgba(255,184,28,.14), transparent 65%),
    linear-gradient(165deg,#152841 0%, #0c1524 55%, #080f1a 100%);
  transition:transform .85s cubic-bezier(.7,0,.3,1), opacity .85s}
#intro.lift{transform:translateY(-102%);opacity:.4}
.intro-word{position:absolute;left:0;right:0;text-align:center;color:#fff;font-size:clamp(34px,7.5vw,72px);font-weight:900;letter-spacing:-1.5px;opacity:0;padding:0 20px;text-shadow:0 4px 40px rgba(0,0,0,.5)}
.intro-word em{font-style:normal;color:var(--yellow);text-shadow:0 0 40px rgba(255,184,28,.5)}
.intro-word.in{animation:wIn 1.6s cubic-bezier(.2,.7,.2,1) both}
.intro-word.gone{animation:wOut .8s ease both}
@keyframes wIn{from{opacity:0;transform:translateY(34px) scale(.96);filter:blur(6px)}30%{filter:blur(0)}to{opacity:1;transform:none}}
@keyframes wOut{from{opacity:1}to{opacity:0;transform:translateY(-26px);filter:blur(4px)}}
.intro-brand{position:absolute;left:0;right:0;text-align:center;opacity:0;padding:0 20px}
.intro-brand.in{animation:wIn 1s cubic-bezier(.2,.7,.2,1) both}
.intro-brand .ib-badge{width:64px;height:64px;border-radius:16px;background:var(--gold-grad);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;box-shadow:0 8px 40px rgba(255,184,28,.45);margin-bottom:14px}
.intro-brand h1{color:#fff;font-size:clamp(26px,5vw,44px);font-weight:900;letter-spacing:-1px}
.intro-brand p{color:var(--yellow);font-size:13px;font-weight:800;letter-spacing:3.5px;text-transform:uppercase;margin-top:8px}
.intro-sky{position:absolute;bottom:0;left:0;right:0;width:100%;height:30vh;min-height:170px;opacity:.9}
.intro-sky path,.intro-sky line,.intro-sky rect{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 3.4s ease forwards .25s}
@keyframes draw{to{stroke-dashoffset:0}}
#introSkip{position:absolute;top:20px;right:20px;background:var(--gold-grad);border:none;color:var(--navy);border-radius:99px;padding:13px 26px;font-weight:800;font-size:15px;box-shadow:0 6px 24px rgba(255,184,28,.45);animation:skipPulse 2.4s ease-in-out infinite;cursor:pointer;z-index:5}
#introSkip:hover{filter:brightness(1.06);transform:scale(1.04)}
@keyframes skipPulse{0%,100%{box-shadow:0 6px 24px rgba(255,184,28,.45)}50%{box-shadow:0 6px 34px rgba(255,184,28,.75)}}
/* ===== Marquee band (landing) ===== */
.marquee{overflow:hidden;background:var(--navy-grad);border:1px solid rgba(255,184,28,.28);border-radius:16px;margin-top:14px;position:relative;padding:13px 0}
.marquee::before,.marquee::after{content:"";position:absolute;top:0;bottom:0;width:46px;z-index:2;pointer-events:none}
.marquee::before{left:0;background:linear-gradient(90deg,#0c1524,transparent)}
.marquee::after{right:0;background:linear-gradient(270deg,#0c1524,transparent)}
.marquee-track{display:flex;width:max-content;animation:mq 26s linear infinite;white-space:nowrap}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-track span{color:#8fa0b8;font-weight:900;font-size:15px;letter-spacing:2.5px;text-transform:uppercase;padding:0 18px}
.marquee-track span em{font-style:normal;color:var(--yellow)}
.marquee-track b{color:var(--yellow);padding:0 4px}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.marquee-track{animation:none}}
.hero-sky{position:absolute;bottom:6px;left:0;right:0;width:100%;height:90px;opacity:.5;pointer-events:none}
@media (prefers-reduced-motion: reduce){#intro{display:none}}

/* ===== Equipment finder — futuristic scan ===== */
.finder{position:relative;overflow:hidden;border:2px solid rgba(255,184,28,.35)!important;background:var(--navy-grad)!important}
.finder .finder-in{background:rgba(255,255,255,.06);border-color:rgba(255,184,28,.4);color:#fff;font-size:18px;min-height:58px;font-weight:700;letter-spacing:.5px}
.finder .finder-in::placeholder{color:#8fa0b8}
.finder .finder-in:focus{border-color:var(--yellow);box-shadow:0 0 0 4px rgba(255,184,28,.18),0 0 30px rgba(255,184,28,.25)}
.finder .hint{color:#8fa0b8}
.finder-scan{position:absolute;top:0;bottom:0;width:90px;background:linear-gradient(90deg,transparent,rgba(255,184,28,.10),transparent);animation:scanX 3.2s linear infinite;pointer-events:none}
@keyframes scanX{from{left:-15%}to{left:110%}}
.eq-card{transition:transform .12s}
.eq-hit{border:2px solid var(--green);background:#f2faf4;box-shadow:0 6px 26px rgba(30,142,62,.25);animation:hitPop .4s cubic-bezier(.2,.8,.3,1.2)}
@keyframes hitPop{from{transform:scale(.97);opacity:.5}to{transform:none;opacity:1}}
.eq-found{display:inline-block;background:var(--green);color:#fff;font-size:11.5px;font-weight:900;letter-spacing:1.4px;border-radius:99px;padding:4px 13px;margin-bottom:10px}
/* staggered entrances — everything glides in */
.sumgrid .sum,.tgrid>*,.pcard{animation:pgIn .45s ease both}
.sumgrid .sum:nth-child(2),.tgrid>*:nth-child(2){animation-delay:.05s}
.sumgrid .sum:nth-child(3),.tgrid>*:nth-child(3){animation-delay:.1s}
.sumgrid .sum:nth-child(4),.tgrid>*:nth-child(4){animation-delay:.15s}
.sumgrid .sum:nth-child(5),.tgrid>*:nth-child(5){animation-delay:.2s}
.sumgrid .sum:nth-child(6),.tgrid>*:nth-child(6){animation-delay:.25s}
.sumgrid .sum:nth-child(7),.tgrid>*:nth-child(7){animation-delay:.3s}
.sumgrid .sum:nth-child(8),.tgrid>*:nth-child(8){animation-delay:.35s}
.grp-h{position:relative;overflow:hidden}
.grp-h::after{content:"";position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(255,184,28,.14),transparent);animation:scanX 4.5s linear infinite}

/* ===== Toasts ===== */
#toastHost{position:fixed;bottom:56px;left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--navy-grad);color:#fff;border-radius:14px;padding:14px 22px;font-size:15px;font-weight:700;box-shadow:0 10px 34px rgba(4,10,20,.4);opacity:0;transform:translateY(16px) scale(.97);transition:opacity .3s,transform .3s;max-width:92vw;text-align:center;border:1px solid rgba(255,255,255,.14)}
.toast.show{opacity:1;transform:none}
.toast.t-green{background:linear-gradient(135deg,#27a04a,#0f6f32);border-color:rgba(255,255,255,.25)}
.toast.t-orange{background:linear-gradient(135deg,#f5821f,#c95f05)}
.toast.t-red{background:linear-gradient(135deg,#e4453a,#b3140a)}
.toast.t-blue{background:linear-gradient(135deg,#3585f2,#174ea6)}

/* ===== Aging / escalation chips ===== */
.age{display:inline-flex;align-items:center;font-size:12px;font-weight:800;border-radius:99px;padding:4px 10px;white-space:nowrap;letter-spacing:.2px}
.age.ok{background:#e6f0e9;color:#1e6b38}
.age.neu{background:#eef1f5;color:#5b6773}
.age.sch{background:#e2edfd;color:#174ea6}
.age.yel{background:#fff3cd;color:#8a6400;animation:agePulse 2.2s infinite}
.age.red{background:var(--red);color:#fff;animation:agePulse 1.2s infinite}
@keyframes agePulse{0%,100%{opacity:1}50%{opacity:.65}}
tr.row-warn td{background:#fffaf0!important}
tr.row-urgent td{background:#fff2f1!important}
tr.row-urgent td:first-child{box-shadow:inset 4px 0 0 var(--red)}
.pcard.pc-row-warn{border:2px solid #f5b400;background:#fffdf5}
.pcard.pc-row-urgent{border:2px solid var(--red);background:#fff7f6;box-shadow:0 4px 18px rgba(217,48,37,.18)}
a.btn{text-decoration:none}

/* ===== Ticket (confirmation) ===== */
.ticket{background:var(--navy-grad);border-radius:18px;padding:20px 16px 18px;position:relative;overflow:hidden;border:1px solid rgba(255,184,28,.3)}
.ticket::after{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--gold-grad)}
.ticket .tk-lbl{font-size:11px;font-weight:800;color:#9fb0c6;text-transform:uppercase;letter-spacing:1.6px}
.ticket .tk-num{font-size:38px;color:var(--yellow);text-shadow:0 2px 14px rgba(255,184,28,.35);margin:4px 0 10px}

/* ===== Misc ===== */
.big-icon{font-size:52px;margin-bottom:8px}
.center{text-align:center}
.pill-hint{background:#eef4ff;color:var(--blue-d);border-radius:10px;padding:11px 14px;font-size:13.5px;font-weight:600;margin-bottom:14px}
.warn-hint{background:#fff8e6;color:#7a5b00;border-radius:10px;padding:11px 14px;font-size:13.5px;font-weight:600}
.audit{border-left:3px solid var(--gray-l);padding-left:14px}
.audit .ev{margin-bottom:12px;position:relative}
.audit .ev::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--navy);position:absolute;left:-20.5px;top:4px;border:2px solid #fff}
.audit .ev b{font-size:14px}
.audit .ev .when{font-size:12px;color:var(--muted)}
.audit .ev .det{font-size:13.5px;color:#44505c;margin-top:2px;white-space:pre-wrap}
.tag{display:inline-block;background:#eef1f5;border-radius:6px;font-size:12px;font-weight:700;padding:2px 8px;margin:2px 3px 2px 0;color:#44505c}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty .big-icon{opacity:.6}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(19,34,56,.08);padding:8px 14px;text-align:center;font-size:11.8px;color:var(--muted);z-index:40}
.modal-bk{position:fixed;inset:0;background:rgba(10,18,30,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:22px;max-height:88vh;overflow-y:auto}
.modal h3{font-size:18px;margin-bottom:10px}
.qrbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.qrcell{background:#fff;border:2px solid #e3e8ee;border-radius:12px;padding:14px;text-align:center}
.qrcell img{width:150px;height:150px;margin:6px auto}
.qrcell b{font-size:14px;display:block}
.qrcell .lnk{font-size:10.5px;color:var(--muted);word-break:break-all;margin-top:6px}
.admin-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.admin-tabs button{border:2px solid #d5dbe3;background:#fff;border-radius:99px;padding:9px 16px;font-weight:700;font-size:13.5px;color:var(--muted)}
.admin-tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.list-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid #eef1f5;flex-wrap:wrap}
.list-row:first-child{border-top:none}
.list-row .grow{flex:1;min-width:150px}
.list-row b{font-size:14.5px}
.list-row small{display:block;color:var(--muted);font-size:12.5px}
.off{opacity:.45}
.grp-h{background:var(--navy2);color:#fff;font-weight:800;font-size:13px;padding:8px 12px;border-radius:8px;margin:16px 0 8px;letter-spacing:.4px}
/* ===== DARK MODE ===== */
body.dark{--bg:#0b1220;--card:#152238;--text:#e8eef7;--muted:#9db0c8;--gray-l:#26364d;
  background:
    radial-gradient(1200px 500px at 85% -10%, #10203a 0%, transparent 60%),

<body>
<header>

<script>
"use strict";
/* ============================================================
   PROJECT PERMIT PORTAL — Pilot / Beta
   Single-file app. Data persists in this browser (localStorage).
   ============================================================ */

/* ---------- Safety question sets (aligned with Project Aura HSE Plan Rev 2 / Master SSOW) ---------- */
const QSETS={
HW:["Will sparks, heat, or open flame be generated?","Has the area been inspected for combustibles?","Is a fire extinguisher available?","Is fire watch required?","Has fire watch been assigned?"],
CS:["Has the space been evaluated?","Is atmospheric monitoring required?","Is rescue planning required?","Is an attendant assigned?"],
NCS:["Has the space been evaluated and classified non-permit?","Could conditions change during the work?","Is ventilation adequate?","Is communication established with workers inside?"],
LOTO:["Has the energy source been identified?","Has an isolation plan been reviewed?","Is verification of zero energy required?","Are all affected parties notified?"],
ES:["Is the energized work justified (no de-energized option)?","Are only qualified electrical workers performing the task?","Is arc-flash PPE selected for the incident energy?","Are barriers and approach boundaries established?"],
EXC:["Have utilities been located and marked (811 / scans)?","Is a protective system (sloping, shoring, box) in place?","Is a competent person on site?","Are spoil piles at least 2 ft from the edge?","Is ladder access within 25 ft of workers?"],
OHPL:["Has the minimum approach distance been established?","Is a dedicated spotter assigned?","Are the lines de-energized or insulated/guarded?","Has equipment reach/height been checked against clearances?"],
OP:["Has the area been scanned or reviewed?","Have drawings been reviewed?","Are barricades required?","Are exposed edges or floor openings protected?"],
RA:["Is roof access authorized and controlled?","Is fall protection in place for work near edges?","Are weather conditions acceptable?","Is a warning line / perimeter established?"],
GFG:["Is the area below and around barricaded?","Is fall protection in use while the surface is removed?","Will the opening be covered or guarded when unattended?","Will reinstallation be verified before closing the permit?"],
LB:["Has the line been identified?","Has pressure been relieved?","Has the system been drained or flushed?","Are chemical or stored-energy hazards present?"],
CL:["Has the lift plan been reviewed and approved?","Is the crane inspection current?","Has all rigging been inspected?","Is an exclusion zone established under the load path?","Are wind and weather within limits?"],
PT:["Is the correct gauge installed (right range, current calibration)?","Is a pressure relief valve installed and set correctly?","Is the test area barricaded off?","Have Jacobs and the client been notified?","Has the test procedure been reviewed?"],
PAT:["Is the operator trained and certified for the tool?","Has the tool been inspected before use?","Is the correct charge/load selected for the material?","Is the area behind and adjacent to the work clear?"],
RAD:["Is the controlled area barricaded and posted?","Has the RSO / Jacobs been notified?","Are warning signals and lights working?","Have non-essential personnel been cleared?"],
WC:["Has the walkable vs non-walkable area been verified on the plan?","Are weight limits confirmed for the work?","Is fall protection in place where required?","Are ceiling openings protected?"],
BP:["Is the blast plan approved?","Have warning signals been communicated to the site?","Is the exclusion zone cleared and controlled?","Is the blaster licensed and authorized?"],
ELEV:["Is fall protection required for this task?","Will workers be tied off 100% at height?","Is the equipment inspection current (MEWP / scaffold tag)?","Are ground conditions and outriggers verified?","Is a rescue plan in place for workers at height?"],
EL:["Is fall protection maintained 100% during the transfer?","Is the landing point rated and safe to step onto?","Is the basket secured against movement?","Is a rescue plan in place?"],
EL_NEW:["Is fall protection maintained 100% during the transfer?","Is the landing point rated and safe to step onto?","Is the basket secured against movement?","Is a rescue plan in place?"],
BR:["Has the rigging plan been reviewed?","Is all rigging gear inspected and tagged?","Is the load path clear of personnel?","Are attachment points rated for the load?"]
};

/* ---------- Seed data (from real DSM-4 master permit log) ---------- */
const SEED = {
  settings:{ pin:"1234", project:"DSM Project", remind1:15, remind2:30, adminName:"Permit Office", adminEmail:"", adminPhone:"", alerts:false },
  buildings:[
    {code:"D4", name:"DSM-4", active:true},
    {code:"D3", name:"DSM-3", active:true},
    {code:"HB", name:"Head Block", active:true},
    {code:"CUB", name:"CUB", active:true}
  ],
  floors:[
    {id:"f1", b:"D4", name:"Ground Floor (GF)", active:true},
    {id:"f2", b:"D4", name:"First Floor (FF)", active:true},
    {id:"f3", b:"D4", name:"Second Floor (SF)", active:true},
    {id:"f4", b:"D4", name:"Roof", active:true},
    {id:"f5", b:"D4", name:"Waste Pit", active:true},
    {id:"f6", b:"D4", name:"Exterior / Site", active:true},
    {id:"f7", b:"D3", name:"Ground Floor (GF)", active:true},
    {id:"f8", b:"D3", name:"First Floor (FF)", active:true},
    {id:"f9", b:"D3", name:"Second Floor (SF)", active:true},
    {id:"f10", b:"D3", name:"Roof", active:true},
    {id:"f11", b:"HB", name:"All Levels", active:true},
    {id:"f12", b:"CUB", name:"All Levels", active:true}
  ],
  contractors:[
    "DH Griffin","Wayne Brothers","SIC","Amico","Merit","PureClean","InServ","FPI",
    "Graycor","BMWC","UPSI","Ameco"
  ].map((n,i)=>({id:"c"+(i+1), name:n, contact:"", phone:"", email:"", active:true})),
  reviewers:[
    "JJ Jaramillo","Lorena Vickery","Drew Foster","Mike Fitzpatrick","Gary Workman","Shawn Patterson","Building HSE/CM (any available)"
  ].map((n,i)=>({id:"r"+(i+1), name:n, email:"", phone:"", active:true})),
  permitTypes:[ // one type per real permit form in the w4rw4 folder
    {code:"HW", name:"Hot Work Permit", ico:"🔥", hr:true, desc:"Sparks, open flame, welding, cutting, grinding, or any spark-producing work."},
    {code:"CS", name:"Confined Space Permit", ico:"🕳️", hr:true, desc:"Entry into tanks, pits, vessels, or excavations over 4 ft deep."},
    {code:"NCS", name:"Non-Permit CSE (Data Sheet)", ico:"📋", hr:false, desc:"Entry into a space evaluated as non-permit confined space."},
    {code:"LOTO", name:"Lockout / Tagout Permit", ico:"🔒", hr:true, desc:"Isolating or shutting off electrical, mechanical, pneumatic, or hydraulic energy."},
    {code:"ES", name:"Energized Electrical Permit", ico:"⚡", hr:true, desc:"Work on or near energized electrical equipment or live exposure."},
    {code:"EXC", name:"Excavation and Trenching", ico:"⛏️", hr:false, desc:"Digging, trenching, grading, or any soil disturbance."},
    {code:"OP", name:"Opening and Penetration Permit", ico:"🧱", hr:true, desc:"Core drilling, cutting, or penetrating floors, walls, or ceilings."},
    {code:"RA", name:"Roof Access Permit", ico:"🏠", hr:false, desc:"Accessing the roof or performing work on roof areas."},
    {code:"GFG", name:"Grating / Floor Plate / Guardrail Removal", ico:"🚧", hr:false, desc:"Removing grating, floor plates, guardrails, or other walking/fall protection."},
    {code:"LB", name:"Line Break Permit", ico:"🔧", hr:true, desc:"Opening pipes, tubing, hoses, or vessels that may hold pressure or chemicals."},

    {code:"ELEV", name:"Elevated Work Permit", ico:"🧗", hr:true, desc:"Work at height on scaffolds, platforms, MEWPs, or elevated surfaces."},
    {code:"EL", name:"Man-Basket Exiting Permit", ico:"🧺", hr:true, desc:"Exiting a man basket / aerial platform at height onto a structure."},
    {code:"BR", name:"Bull Rigging Lift Permit", ico:"⛓️", hr:false, desc:"Rigging and moving loads without a crane — bull rigging operations."}
  ].map(t=>({...t, q:QSETS[t.code]||[], active:true})),
  permits:[], counters:{}

/* ---------- Owner: delete permits to trash / restore ---------- */
function ownerDeletePermit(id){
  if(!IS_OWNER){ toast("Only the Owner can delete permits.","t-red"); return; }
  const i=DB.permits.findIndex(x=>x.id===id); if(i<0) return;
  const p=DB.permits[i];
  if(!confirm("Move permit "+p.number+" to the Trash?\n\nYou can restore it any time from Admin → 🗑 Trash. Its number will NOT be reused.")) return;
  p.deletedAt=new Date().toISOString(); p.deletedBy=currentActor(); p._u=Date.now();
  DB.trash.unshift(p); DB.permits.splice(i,1);
  logChange("🗑 Permit moved to Trash: "+p.number, typeOf(p.typeCode).name+" · "+p.company);
  saveDB(); toast("🗑 <b>"+esc(p.number)+"</b> moved to Trash — restore it from Admin → Trash.","t-dark");
  go("status"); route();
}
function trashRestore(i){
  const p=DB.trash[i]; if(!p) return;
  delete p.deletedAt; delete p.deletedBy; p._u=Date.now();
  DB.permits.unshift(p); DB.trash.splice(i,1);
  logChange("♻ Permit restored from Trash: "+p.number,"");
  saveDB(); toast("♻ <b>"+esc(p.number)+"</b> restored.","t-green"); route();
}
function trashForever(i){
  const p=DB.trash[i]; if(!p) return;
  if(!confirm("Permanently delete "+p.number+"? This cannot be undone. (The permit number will still never be reused.)")) return;
  DB.trash.splice(i,1); logChange("Permit permanently deleted: "+p.number,"");
  cloudDeleteRow(p.id);
  saveDB(); route();
}
function trashEmpty(){
  if(!DB.trash.length) return;
  if(prompt('Type DELETE to permanently empty the Trash ('+DB.trash.length+' permits). This cannot be undone.')!=="DELETE") return;
  logChange("Trash emptied","Permanently removed "+DB.trash.length+" permits");
  DB.trash.forEach(p=>cloudDeleteRow(p.id));
  DB.trash=[]; saveDB(); route();
}

/* ---------- Permit numbering: BUILDING-TYPE-### (never reused) ---------- */
function nextPermitNumber(bCode,tCode){
  const k=bCode+"-"+tCode;
  const used = DB.permits.filter(p=>p.number&&p.number.startsWith(k+"-")).map(p=>parseInt(p.number.split("-").pop(),10)||0);
  const cur = Math.max(DB.counters[k]||0, ...(used.length?used:[0]));
  DB.counters[k]=cur+1;
  return k+"-"+String(cur+1).padStart(3,"0");
}

/* ---------- Audit trail (system-written, never editable) ---------- */
function audit(p,action,detail){
  p.audit=p.audit||[];
  p.audit.push({at:new Date().toISOString(), by:currentActor(), role:ROLE, action, detail:detail||""});
  p._u=Date.now(); // marks the permit changed → cloud sync picks it up
}
function setStatus(p,st,detail){
  const old=p.status; p.status=st;
  audit(p, "Status: "+old+" → "+st, detail);
  if(st==="Approved"||(st==="Active"&&!p.approvedBy)){ p.approvedAt=new Date().toISOString(); p.approvedBy=currentActor(); }
  if(["Completed","Void","Lost","Rejected"].includes(st)) p.closedAt=new Date().toISOString();
  saveDB();
}

/* ---------- Auto-expiration (daily permits) ---------- */
function expireSweep(){
  const t=today(); let n=0;
  DB.permits.forEach(p=>{
    if(["Approved","Active"].includes(p.status) && p.goodThrough && p.goodThrough < t){
      p.status="Expired";
      p.audit.push({at:new Date().toISOString(), by:"System", role:"system", action:"Status: auto-expired", detail:"Permit good-through date "+p.goodThrough+" passed without completion."});
      p._u=Date.now();
      n++;
    }
  });
  if(n) saveDB();
  return n;
}

/* Escalation timers — clock starts at scheduled work start (or submission, whichever is later) */
function notifyActive(){
  const s=DB.settings;
  if(!s.notifyOn) return false;
  return (s.notifyDays||[0,1,2,3,4,5,6]).includes(new Date().getDay());
}
function escBase(p){
  if(!p.submittedAt) return null;
  let base=new Date(p.submittedAt);
  if(p.startDate){
    const st=new Date(p.startDate+"T"+(p.startTime&&/^\d\d:\d\d/.test(p.startTime)?p.startTime:"07:00"));
    if(!isNaN(st)&&st>base) base=st;
  }
  return base;
}
function ageMin(p){ const b=escBase(p); return b? Math.max(0,Math.floor((Date.now()-b.getTime())/60000)) : 0; }
function ageChip(p){
  if(!["Submitted","Under Review"].includes(p.status)) return "";
  const b=escBase(p); if(!b) return "";
  if(b.getTime()>Date.now()) return `<span class="age sch">🕐 Clock starts ${fmtDT(b.toISOString())}</span>`;
  const m=ageMin(p), r1=+DB.settings.remind1||15, r2=+DB.settings.remind2||30;
  const lbl=m>=60? Math.floor(m/60)+"h "+(m%60)+"m" : m+" min";
  if(!notifyActive()) return `<span class="age neu">⏱ ${lbl}</span>`;
  if(m>=r2) return `<span class="age red">⏱ ${lbl} — URGENT</span>`;
  if(m>=r1) return `<span class="age yel">⏱ ${lbl} — reminder</span>`;
  return `<span class="age ok">⏱ ${lbl}</span>`;
}
/* Toasts — instant feedback for every action */
function toast(msg,kind){
  let h=document.getElementById("toastHost");
  if(!h){ h=document.createElement("div"); h.id="toastHost"; document.body.appendChild(h); }
  const t=document.createElement("div"); t.className="toast "+(kind||"t-dark"); t.innerHTML=msg;
  h.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{ t.classList.remove("show"); setTimeout(()=>t.remove(),450); },4500);
}
function enableAlerts(){
  if(!("Notification" in window)){ alert("This browser doesn't support pop-up alerts."); return; }
  Notification.requestPermission().then(perm=>{
    if(perm==="granted"){ DB.settings.alerts=true; saveDB();
      new Notification("Permit Portal alerts on ✔",{body:"Keep this tab open — you'll get pop-ups for new and overdue permits."});
      route();
    } else alert("Alerts were blocked. Allow notifications for this site in your browser settings.");
  });
}
function alertSweep(){
  if(!notifyActive()) return;
  if(!DB.settings.alerts||!("Notification" in window)||Notification.permission!=="granted") return;
  const r1=+DB.settings.remind1||15, r2=+DB.settings.remind2||30; let dirty=false;
  DB.permits.forEach(p=>{
    if(!["Submitted","Under Review"].includes(p.status)) return;
    const m=ageMin(p);
    const rv=DB.reviewers.find(x=>x.name===p.reviewer)||{};
    if(m>=r2&&!p.n2){ p.n2=1; dirty=true; new Notification("🚨 URGENT — "+p.number+" waiting "+m+" min",{body:"Notify the permit office. "+typeOf(p.typeCode).name+" · "+p.company+" · reviewer "+p.reviewer,tag:p.id+"u"}); }
    else if(m>=r1&&!p.n1){ p.n1=1; dirty=true; new Notification("⏰ Escalate — "+p.number+" waiting "+m+" min",{body:(p.reviewer||"Reviewer")+" hasn't approved."+(rv.supName?" Text supervisor "+rv.supName+" from the permit page.":""),tag:p.id+"r"}); }
  });
  if(dirty) saveDB();
}

/* ---------- Router ---------- */
const VIEWS={};
function go(view,arg){ location.hash = "#/"+view+(arg?("/"+encodeURIComponent(arg)):""); }
function route(){
  const h=location.hash.replace(/^#\/?/,"");
  const [v,arg]=h.split("/");
  const qs=new URLSearchParams(location.search);
  expireSweep();
  const fn=VIEWS[v||"home"]||VIEWS.home;
  // role guards
  if(["dashboard","review","board","myreviews","forms"].includes(v) && ROLE==="contractor"){ openRoleModal("Jacobs sign-in required for that page."); return; }
  if(["dashboard","review","myreviews","types","form"].includes(v) && ROLE==="safety"){ openRoleModal("Safety managers have view access — permits are submitted by supervisors."); return; }
  // equipment is open to every role — anyone on site can look up a machine
  if(["admin","reports"].includes(v) && ROLE!=="admin"){ openRoleModal("Admin sign-in required for that page."); return; }
  const keep=window._keepScroll; window._keepScroll=false;
  const y=window.scrollY;
  document.getElementById("app").innerHTML = fn(decodeURIComponent(arg||""), qs);
  if(keep) window.scrollTo(0,y); else { window.scrollTo(0,0); animateNums(); }
  const NAV_ALIAS={form:"types",help:"types",confirm:"status",view:"status",copy:"home",review:"dashboard",howto:ROLE==="contractor"?"howto":"dashboard"};
  renderNav(NAV_ALIAS[v]||v||"home");
  if(window._afterRender){ const f=window._afterRender; window._afterRender=null; f(); }
}
window.addEventListener("hashchange",route);

/* ---------- Animated counters (futuristic count-up) ---------- */
function animateNums(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll("[data-cnt]").forEach(el=>{
    const end=+el.dataset.cnt; if(isNaN(end)||end<=0) return;
    const t0=performance.now(), dur=650;
    const step=n=>{ const p=Math.min(1,(n-t0)/dur);
      el.textContent=Math.round(end*(1-Math.pow(1-p,3)));
      if(p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

function validateStep(){
  const errs=[];
  const need=(v,l)=>{ if(!v||!String(v).trim()) errs.push(l); };
  if(F.step===1){ need(F.building,"Building"); need(F.floor,"Floor / Level"); need(F.location,"Specific Work Location"); }
  if(F.step===2){ need(F.company,"Contractor Company"); need(F.requestedBy,"Requested By"); need(F.phone,"Requester Phone"); }
  if(F.step===3){ need(F.startDate,"Start Date"); need(F.goodThrough,"Permit Good Through"); need(F.description,"What work are you doing?");
    if(F.startDate&&F.goodThrough&&F.goodThrough<F.startDate) errs.push("Permit Good Through cannot be before the Start Date"); }
  if(F.step===4){ need(F.paperwork,"Required paperwork submitted?"); need(F.jha,"JHA / SSOW available?");
    const t=typeOf(F.typeCode); (t.q||[]).forEach((q,i)=>{ if(!F.answers["q:"+i]) errs.push("Safety question: "+q); }); }
  if(F.step===5){ need(F.reviewer,"Requested Jacobs Reviewer"); }
  return errs;
}
function stepGo(d){
  if(d>0){ const errs=validateStep();
    if(errs.length){ const b=document.getElementById("errBox"); b.style.display="block";
      b.innerHTML="Please complete: "+errs.map(esc).join(" · "); window.scrollTo(0,0); return; } }
  F.step=Math.min(5,Math.max(1,F.step+d));
  document.getElementById("app").innerHTML=VIEWS.form(); window.scrollTo(0,0);
}
function saveDraft(){
  const p=persistForm("Draft");
  alert("Draft saved. Find it under My Permits → Draft. Reference: "+(p.number||"(number assigned at submission)"));
  F=null; go("status");
}
function persistForm(status){
  let p;
  if(F.editingId){
    p=DB.permits.find(x=>x.id===F.editingId);
    const fields=["building","floor","area","location","company","requestedBy","phone","email","foreman","foremanPhone","shift","startDate","goodThrough","startTime","endTime","description","equipment","workers","paperwork","jha","permitDocs","reviewer","notes"];
    fields.forEach(k=>p[k]=F[k]); p.answers={...F.answers};
    audit(p,"Permit updated by contractor","Resubmitted after Needs Update.");
    if(status==="Submitted") setStatus(p,"Under Review","Updated information provided — back with Jacobs.");
  } else {
    p={ id:uid(), ...F }; delete p.step; delete p.editingId;
    p.submittedBy=currentActor(); p.createdAt=new Date().toISOString();
    p.status = status==="Submitted" ? "Under Review" : status; // one step: submit lands straight in Jacobs review
    p.audit=[];
    p.number = p.number || nextPermitNumber(F.building,F.typeCode);
    audit(p, status==="Draft"?"Draft created":"Permit request created","");
    if(status==="Submitted"){ p.submittedAt=new Date().toISOString(); audit(p,"Status: Submitted → Under Review","Sent straight to Jacobs for review."); }
    DB.permits.unshift(p);
  }
  saveDB(); return p;
}
function submitForm(){
  for(let s=1;s<=5;s++){ F.step=s; const errs=validateStep();
    if(errs.length){ rerenderForm(); const b=document.getElementById("errBox"); b.style.display="block";
      b.innerHTML="Please complete: "+errs.map(esc).join(" · "); window.scrollTo(0,0); return; } }
  const p=persistForm("Submitted");
  if(!p.submittedAt){ p.submittedAt=new Date().toISOString(); saveDB(); }
  // companion permits — same task, same info, each with its own number
  if(F.needLinked==="Yes"&&F.linkedTypes.length){
    p.groupId=p.id;
    F.linkedTypes.forEach(code=>{
      const c=JSON.parse(JSON.stringify(p));
      c.id=uid(); c.typeCode=code; c.answers={}; c.groupId=p.id;
      c.number=nextPermitNumber(p.building,code);
      c.audit=[{at:new Date().toISOString(),by:currentActor(),role:ROLE,action:"Companion permit created",
        detail:"Created together with "+p.number+" — same task, location, personnel, and dates. Type-specific safety questions to be confirmed with Jacobs."},
        {at:new Date().toISOString(),by:currentActor(),role:ROLE,action:"Status: Submitted → Under Review",detail:"Sent straight to Jacobs for review."}];
      DB.permits.unshift(c);
    });
    audit(p,"Linked permits created",F.linkedTypes.map(code=>typeOf(code).name).join(", "));
    saveDB();
  }
  if(DB.settings.alerts&&"Notification" in window&&Notification.permission==="granted")
    new Notification("📥 New permit "+p.number,{body:typeOf(p.typeCode).name+" · "+p.company+" · for "+p.reviewer,tag:p.id});
  const id=p.id; F=null; go("confirm",id);
}

function trackerHtml(p){
  if(DEAD.includes(p.status)){

  }).join("")}</div>

}

let DASH_SEL="today";
function dashShow(f){ DASH_SEL=f; route();

function renderDashHist(){
  const t=today(); let list,title;
  if(DASH_SEL==="today"){ list=DB.permits.filter(p=>p.submittedAt&&p.submittedAt.slice(0,10)===t); title="everything submitted today (any current status)"; }
  else if(DASH_SEL==="DEAD"){ list=DB.permits.filter(p=>["Rejected","Void","Lost"].includes(p.status)); title="Rejected / Void / Lost"; }
  else { list=DB.permits.filter(p=>p.status===DASH_SEL); title=DASH_SEL; }
  const tt=document.getElementById("histTitle"); if(tt) tt.textContent=title+" ("+list.length+")";
  const tb=document.getElementById("histBody"); if(!tb) return;
  tb.innerHTML=list.length? list.map(p=>{const x=typeOf(p.typeCode);return `<tr class="${urgCls(p)}">
    <td class="pnum">${esc(p.number)}</td><td>${x.ico} ${esc(x.code)}</td><td>${esc(p.company)}</td>
    <td>${esc(p.building)}</td><td>${esc(p.floor)}</td><td>${fmtDT(p.submittedAt)}</td>
    <td>${esc(p.approvedBy||"—")}</td><td>${p.closedAt?fmtDT(p.closedAt):"—"}</td><td>${badge(p.status)} ${ageChip(p)}</td>
    <td><button class="btn btn-line btn-sm" onclick="go('review','${p.id}')">Open</button></td></tr>`;}).join("")
  : `<tr><td colspan="10" class="empty">No permits in this category yet.</td></tr>`;
}
function dashType(c){ go("status"); setTimeout(()=>{const s=document.getElementById("fT"); if(s){s.value=c;applyStatusFilters();}},50); }
function applyDashFilters(){
  const q=(document.getElementById("dQ")?.value||"").toLowerCase();
  const b=document.getElementById("dB")?.value||"", tp=document.getElementById("dT")?.value||"";
  const co=document.getElementById("dCo")?.value||"", sh=document.getElementById("dSh")?.value||"", rv=document.getElementById("dRv")?.value||"";
  let list=DB.permits.filter(p=>["Submitted","Under Review","Needs Update"].includes(p.status));
  if(b) list=list.filter(p=>p.building===b);
  if(tp) list=list.filter(p=>p.typeCode===tp);
  if(co) list=list.filter(p=>p.company===co);
  if(sh) list=list.filter(p=>p.shift===sh);
  if(rv) list=list.filter(p=>p.reviewer===rv);
  if(q) list=list.filter(p=>[p.number,p.requestedBy,p.location,p.description,p.company].join(" ").toLowerCase().includes(q));
  const tb=document.getElementById("dashBody"); if(!tb) return;
  const r2=+DB.settings.remind2||30, r1=+DB.settings.remind1||15;
  list.sort((a,b)=>ageMin(b)-ageMin(a));
  const nAct=notifyActive();
  tb.innerHTML = list.length? list.map(p=>{const x=typeOf(p.typeCode);const m=ageMin(p);
    const started=escBase(p)&&escBase(p).getTime()<=Date.now();
    const rowCls=nAct&&started&&["Submitted","Under Review"].includes(p.status)?(m>=r2?"row-urgent":m>=r1?"row-warn":""):"";
    return `<tr class="${rowCls}">
    <td>${ageChip(p)||"—"}</td>
    <td class="pnum">${esc(p.number)}</td><td>${x.ico} ${esc(x.name)}</td><td>${esc(p.company)}</td>
    <td>${esc(p.building)}</td><td>${esc(p.floor)}${p.area?" · "+esc(p.area):""}</td><td>${esc(p.shift)}</td>
    <td>${fmtDT(p.submittedAt)}</td><td>${esc(p.reviewer)}</td><td>${badge(p.status)}</td>
    <td><button class="btn btn-b btn-sm" onclick="go('review','${p.id}')">Review</button></td></tr>`;}).join("")
  : `<tr><td colspan="11" class="empty">🎉 Nothing waiting on Jacobs right now.</td></tr>`;
}
function dashBreakdowns(){
  const groups=[["Trade Partner",p=>p.company],["Permit Type",p=>typeOf(p.typeCode).name],["Building",p=>bldOf(p.building).name],["Floor",p=>p.floor],["Shift",p=>p.shift],["Jacobs Reviewer",p=>p.reviewer]];
  const open=DB.permits.filter(p=>OPEN_STATUSES.includes(p.status));
  return groups.map(([label,fn])=>{
    const m={}; open.forEach(p=>{const k=fn(p)||"—"; m[k]=(m[k]||0)+1;});
    const items=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8);
    return `<div style="margin-bottom:10px"><b style="font-size:13px">${label}:</b> ${items.length?items.map(([k,v])=>`<span class="tag">${esc(k)} · ${v}</span>`).join(""):'<span class="tag">no open permits</span>'}</div>`;
  }).join("");
}

function grabReview(p){
  p.paperworkSubmitted=document.getElementById("rvPS")?.value||p.paperworkSubmitted;
  p.paperworkApproved=document.getElementById("rvPA")?.value||p.paperworkApproved;
  p.reviewComments=document.getElementById("rvC")?.value??p.reviewComments;
  p.approvalConditions=document.getElementById("rvCond")?.value??p.approvalConditions;
}
function rerenderReview(){ window._keepScroll=true; route(); }
function saveReviewNotes(id){ const p=DB.permits.find(x=>x.id===id); grabReview(p);
  audit(p,"Review notes saved",""); saveDB(); toast("💾 Review notes saved for <b>"+esc(p.number)+"</b>","t-blue"); rerenderReview(); }
function actStatus(id,st,detail){ const p=DB.permits.find(x=>x.id===id); grabReview(p); setStatus(p,st,detail||"");
  toast((st==="Active"?"🟢":"👀")+" <b>"+esc(p.number)+"</b> is now "+st.toUpperCase(),st==="Active"?"t-green":"t-blue"); rerenderReview(); }
function actApprove(id){
  const p=DB.permits.find(x=>x.id===id); grabReview(p);
  if(["Approved","Active"].includes(p.status)){ toast("Already approved — <b>"+esc(p.number)+"</b> is "+p.status,"t-dark"); return; }
  if(p.paperworkSubmitted!=="Yes"){ if(!confirm("Paperwork is not marked as submitted. Approve anyway?")) return; }
  setStatus(p,"Active",(p.approvalConditions?("Approved & activated. Conditions: "+p.approvalConditions):"Approved & activated — work may proceed."));
  toast("✅ <b>"+esc(p.number)+"</b> APPROVED &amp; ACTIVE — work may proceed. Notify the contractor below.","t-green");
  rerenderReview();
}
function foremanComplete(id){
  const p=DB.permits.find(x=>x.id===id); if(!p) return;
  if(!confirm("Confirm the work on "+p.number+" is finished? This closes the permit.")) return;
  setStatus(p,"Completed","Work finished — marked complete by foreman/requester in the field.");
  toast("🏁 <b>"+esc(p.number)+"</b> "+T("Completed").toUpperCase()+" — "+T("thank you"),"t-blue");
  route();
}
function actNeedsUpdate(id){
  const p=DB.permits.find(x=>x.id===id); grabReview(p);
  if(!p.reviewComments||!p.reviewComments.trim()){ toast("✏️ Enter Review Comments first — tell the contractor exactly what to fix.","t-orange");
    document.getElementById("rvC")?.focus(); return; }
  setStatus(p,"Needs Update","Jacobs: "+p.reviewComments);
  toast("✏️ <b>"+esc(p.number)+"</b> sent back — NEEDS UPDATE","t-orange"); rerenderReview();
}
function actComplete(id){
  if(!confirm("Mark this permit as Completed? This closes the permit.")) return;
  const p=DB.permits.find(x=>x.id===id); grabReview(p); setStatus(p,"Completed","Work complete — permit closed.");
  toast("🏁 <b>"+esc(p.number)+"</b> COMPLETED — permit closed","t-blue"); rerenderReview();
}
function actReason(id,st,label){
  const r=prompt(label); if(r===null) return;
  if(!r.trim()){ toast("A reason is required.","t-red"); return; }
  const p=DB.permits.find(x=>x.id===id); grabReview(p);
  if(st==="Rejected") p.rejectReason=r;
  setStatus(p,st,r);
  toast((st==="Rejected"?"❌":st==="Void"?"⛔":"⚠️")+" <b>"+esc(p.number)+"</b> marked "+st.toUpperCase(),"t-red"); rerenderReview();
}

/* ---- SIMOPS: other work in the same area, same dates ---- */
function simopsPanel(p){
  if(DEAD.includes(p.status)||p.status==="Completed") return "";
  const overlap=DB.permits.filter(o=>o.id!==p.id && o.building===p.building && o.floor===p.floor
    && OPEN_STATUSES.includes(o.status)
    && o.startDate&&p.startDate && o.startDate<=p.goodThrough && o.goodThrough>=p.startDate);
  if(!overlap.length) return `<div class="pill-hint">🗺️ SIMOPS check: no other open permits on ${esc(bldOf(p.building).name)} · ${esc(p.floor)} for these dates.</div>`;
  const risky=overlap.some(o=>typeOf(o.typeCode).hr)||typeOf(p.typeCode).hr;
  return `<div class="card" style="border:2px solid ${risky?"var(--red)":"var(--orange)"}">
    <div class="section-t">${risky?"🚨":"⚠️"} SIMOPS Check — other work in this area, same dates</div>
    <p style="font-size:14px;margin-bottom:10px">${overlap.length} other open permit${overlap.length>1?"s":""} on <b>${esc(bldOf(p.building).name)} · ${esc(p.floor)}</b> overlapping these dates. Confirm the activities are compatible before approving${risky?" — <b style='color:var(--red)'>high-risk combination present</b>":""}.</p>

function applyBoardFilters(){
  const t=today();
  const g=document.getElementById("bG")?.value||"";
  const st=document.getElementById("bSt")?.value||"";
  let list=DB.permits.slice();
  if(ROLE==="safety") list=list.filter(p=>p.company===MYCO); // safety managers see ONLY their own company
  if(st==="LIVE") list=list.filter(p=>["Approved","Active"].includes(p.status)&&(!p.goodThrough||p.goodThrough>=t));
  else if(st) list=list.filter(p=>p.status===st);
  const f=(id,fn)=>{const v=document.getElementById(id)?.value||""; if(v) list=list.filter(p=>fn(p)===v);};
  f("bB",p=>p.building); f("bF",p=>p.floor); f("bCo",p=>p.company); f("bT",p=>p.typeCode); f("bSh",p=>p.shift);
  const host=document.getElementById("boardHost"); if(!host) return;
  if(!list.length){ host.innerHTML=`<div class="empty"><div class="big-icon">📋</div>No permits match these filters.</div>`; return; }
  const rows=l=>`<div class="tblwrap"><table class="tbl"><thead><tr>
    <th>Permit #</th><th>Type</th><th>Trade Partner</th><th>Bldg</th><th>Floor / Area</th><th>Shift</th><th>Start</th><th>Good Through</th><th>Reviewer</th><th>Status</th><th></th></tr></thead>
    <tbody>${l.map(p=>{const x=typeOf(p.typeCode);return `<tr class="${urgCls(p)}">
      <td class="pnum">${esc(p.number)}</td><td>${x.ico} ${esc(x.name)}</td><td>${esc(p.company)}</td>
      <td>${esc(p.building)}</td><td>${esc(p.floor)}${p.area?" · "+esc(p.area):""}</td><td>${esc(p.shift)}</td>
      <td>${fmtD(p.startDate)}</td><td>${fmtD(p.goodThrough)}</td><td>${esc(p.reviewer)}</td><td>${badge(p.status)} ${ageChip(p)}</td>
      <td><button class="btn ${urgCls(p)==="row-urgent"?"btn-r":"btn-line"} btn-sm" onclick="go('${ROLE==="jacobs"||ROLE==="admin"?"review":"view"}','${p.id}')">View</button></td></tr>`;}).join("")}</tbody></table></div>`;
  if(!g){ host.innerHTML=rows(list); return; }
  const keyFn={building:p=>bldOf(p.building).name,floor:p=>p.floor,type:p=>typeOf(p.typeCode).name,company:p=>p.company}[g];
  const m={}; list.forEach(p=>{const k=keyFn(p)||"—";(m[k]=m[k]||[]).push(p);});
  host.innerHTML=Object.keys(m).sort().map(k=>`<div class="grp-h">${esc(k)} — ${m[k].length} permit${m[k].length>1?"s":""}</div>${rows(m[k])}`).join("");
}

function promptFields(title,fields,cb){

    :`<input class="f-in" id="pf_${f.key}" value="${esc(f.value||"")}">`}
    ${f.hint?`<div class="hint">${f.hint}</div>`:""}</div>`).join("")}
    <div class="btnrow"><button class="btn btn-g" id="pfOk">✓ Save</button><button class="btn btn-line btn-cancel" onclick="closeModal()">Cancel</button></div>
    <div class="hint center" style="margin-top:8px">Press <b>Enter</b> to save.</div>`);
  const ok=()=>{
    const out={}; fields.forEach(f=>out[f.key]=document.getElementById("pf_"+f.key).value.trim());

function toggleDay(i){
  const d=DB.settings.notifyDays||(DB.settings.notifyDays=[]);

function backupJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  dl(blob,"PermitPortal_Backup_"+today()+".json");
}
function restoreJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.permits) throw 0; DB=d; saveDB(); alert("Backup restored."); route(); }catch(e){ alert("That file doesn't look like a Permit Portal backup."); } };
  r.readAsText(f);
}
function wipeAll(){
  if(!IS_OWNER){ toast("Only the Owner can do a fresh start.","t-red"); return; }
  if(prompt('Type ERASE to delete ALL permits and empty the Trash.\n\nBuildings, floors, trade partners, permit types, reviewers, PINs, and settings are all KEPT.')==="ERASE"){
    logChange("🧹 Fresh start — all permits deleted","Removed "+DB.permits.length+" permits and "+DB.trash.length+" trashed permits");
    [...DB.permits,...DB.trash].forEach(p=>cloudDeleteRow(p.id));
    DB.permits=[]; DB.trash=[]; DB.counters={}; saveDB();
    toast("🧹 Fresh start — all permits cleared. Setup and PINs kept.","t-blue"); route();
  }
}

function applyEqSearch(){
  const host=document.getElementById("eqList"); if(!host) return;
  const q=(document.getElementById("eqQ")?.value||"").trim().toLowerCase();
  const co=document.getElementById("eqCo")?.value||"", tp=document.getElementById("eqT")?.value||"", st=document.getElementById("eqS")?.value||"";
  let list=(DB.equipment||[]).slice();
  if(co) list=list.filter(e=>e.company===co);
  if(tp) list=list.filter(e=>e.type===tp);
  if(st) list=list.filter(e=>e.status===st);
  if(q) list=list.filter(e=>[e.serial,e.name,e.company,e.responsible,e.type,e.location].join(" ").toLowerCase().includes(q));
  // exact serial match floats to top with a FOUND flash
  list.sort((a,b)=>{
    const am=q&&(a.serial||"").toLowerCase()===q?-1:0, bm=q&&(b.serial||"").toLowerCase()===q?-1:0;
    return am-bm || (a.company||"").localeCompare(b.company||"");
  });
  if(!list.length){
    host.innerHTML=`<div class="empty"><div class="big-icon">🛰️</div>${q?T("No match — that serial isn't registered yet. Add it so next time it takes 5 seconds."):T("No equipment registered yet. Tap + Add Equipment to start the registry.")}</div>`;
    return;
  }
  host.innerHTML=list.map(e=>{
    const hit=q&&(e.serial||"").toLowerCase()===q;
    const od=e.inspDue&&e.inspDue<today();
    return `<div class="pcard eq-card ${hit?"eq-hit":""}">
      ${hit?`<div class="eq-found">✔ ${T("FOUND — this is your machine")}</div>`:""}
      <div class="top">
        <div style="display:flex;align-items:center;gap:10px"><span style="font-size:24px">${eqIco(e.type)}</span>
          <div><b style="font-size:16px">${esc(e.name||e.type)}</b>
          <div style="font-size:12.5px;color:var(--muted);font-weight:700">${esc(e.type)} · <span class="pnum">SN ${esc(e.serial)}</span></div></div></div>
        <span class="badge ${e.status==="Out of Service"?"st-Rejected":"st-Active"}">${esc(T(e.status||"In Service"))}</span>
      </div>
      <div class="meta">
        <div>${T("Belongs to")}: <b>${esc(e.company)}</b></div>
        <div>${T("Responsible")}: <b>${esc(e.responsible||"—")}</b></div>
        <div>${T("Location")}: <b>${esc(e.location||"—")}</b></div>
        <div>${T("Inspection due")}: <b style="${od?"color:var(--red)":""}">${e.inspDue?fmtD(e.inspDue):"—"}${od?" ⚠ "+T("OVERDUE"):""}</b></div>
      </div>
      <div class="btnrow" style="margin-top:12px">
        ${e.phone?`<a class="btn btn-dark btn-sm" href="tel:${esc(e.phone)}">📞 ${T("Call")} ${esc(e.responsible||e.company)}</a>`:""}
        ${e.phone?`<a class="btn btn-line btn-sm" href="${smsHref(e.phone,T("Your equipment needs to be moved")+": "+(e.name||e.type)+" (SN "+e.serial+") — "+(e.location||""))}">📱 ${T("Text: please move it")}</a>`:""}
        <button class="btn btn-line btn-sm" onclick="eqTag('${e.id}')">🏷️ ${T("QR Tag")}</button>
        ${canEditEq(e)?`<button class="btn btn-line btn-sm" onclick="eqEdit('${e.id}')">Edit</button>
        <button class="btn btn-line btn-sm btn-cancel" onclick="eqDel('${e.id}')">Delete</button>`:""}
      </div>
    </div>`;
  }).join("");
}
const EQ_FIELDS=e=>[
  {key:"type",label:"Equipment Type",type:"select",opts:EQUIP_TYPES.map(t=>t[0]),value:e?.type},
  {key:"name",label:"Make / Model (e.g., Genie GS-1930)",value:e?.name},
  {key:"serial",label:"Serial Number",value:e?.serial,hint:"The number on the machine's plate or sticker — this is how people will find it."},
  {key:"company",label:"Trade Partner (owner)",type:"select",opts:DB.contractors.map(c=>c.name),value:e?.company||((ROLE==="contractor"||ROLE==="safety")?MYCO:"")},
  {key:"responsible",label:"Person Responsible",value:e?.responsible},
  {key:"phone",label:"Their Cell Phone",value:e?.phone},
  {key:"location",label:"Usual Location (building / floor / area)",value:e?.location},
  {key:"status",label:"Status",type:"select",opts:["In Service","Out of Service"],value:e?.status||"In Service"},
  {key:"inspDue",label:"Next Inspection Due (YYYY-MM-DD, optional)",value:e?.inspDue},
  {key:"notes",label:"Notes",type:"textarea",value:e?.notes}];
function eqTouch(){ DB.cfgU=Date.now(); }
function eqAdd(){
  promptFields("Add Equipment",EQ_FIELDS(),o=>{
    if(!o.serial||!o.company){ toast("Serial number and trade partner are required.","t-red"); return; }
    const dup=(DB.equipment||[]).find(x=>x.serial.toLowerCase()===o.serial.toLowerCase());
    if(dup){ toast("⚠ SN "+esc(o.serial)+" is already registered to "+esc(dup.company)+".","t-orange"); return; }
    DB.equipment.push({id:uid(),...o,addedBy:currentActor(),addedAt:new Date().toISOString()});
    eqTouch(); toast("🏗️ "+esc(o.name||o.type)+" (SN "+esc(o.serial)+") registered for "+esc(o.company),"t-green");
  });
}
function eqEdit(id){
  const e=DB.equipment.find(x=>x.id===id); if(!e||!canEditEq(e)) return;
  promptFields("Edit Equipment — SN "+e.serial,EQ_FIELDS(e),o=>{ Object.assign(e,o); eqTouch(); });
}
function eqDel(id){
  const e=DB.equipment.find(x=>x.id===id); if(!e||!canEditEq(e)) return;
  if(!confirm("Remove "+(e.name||e.type)+" (SN "+e.serial+") from the registry?")) return;
  DB.equipment=DB.equipment.filter(x=>x.id!==id);
  eqTouch(); if(ROLE==="admin") logChange("Equipment removed: SN "+e.serial,e.company);
  saveDB(); route();
}
function eqTag(id){
  const e=DB.equipment.find(x=>x.id===id); if(!e) return;
  const base=location.origin==="null"||location.protocol==="file:"? location.href.split("#")[0].split("?")[0] : location.origin+location.pathname;
  const url=base+"?eq="+encodeURIComponent(e.serial)+"#/equipment";
  modal(`<h3 style="display:flex;justify-content:space-between;align-items:center">🏷️ ${T("Equipment QR Tag")}
    <button class="btn btn-line btn-sm" onclick="closeModal()">✕</button></h3>
    <div class="qrcell" style="border:none">
      <b style="font-size:16px">${eqIco(e.type)} ${esc(e.name||e.type)}</b>
      <div class="pnum" style="font-size:20px;margin:4px 0">SN ${esc(e.serial)}</div>
      <div style="font-size:13px;font-weight:700">${esc(e.company)} · ${esc(e.responsible||"")}</div>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=340x340&data=${encodeURIComponent(url)}" alt="QR" style="width:220px;height:220px">
      <div class="lnk">${T("Scan to see who owns this machine")}</div>
    </div>
    <div class="btnrow"><button class="btn btn-dark" onclick="window.print()">🖨️ ${T("Print sticker")}</button></div>`);
}

let REPORT_LIST=[];
function reportFilter(){
  let list=DB.permits.slice().filter(p=>p.status!=="Draft"||true);
  const v=id=>document.getElementById(id)?.value||"";
  if(v("rFrom")) list=list.filter(p=>(p.startDate||"")>=v("rFrom"));
  if(v("rTo")) list=list.filter(p=>(p.startDate||"")<=v("rTo"));
  if(v("rB")) list=list.filter(p=>p.building===v("rB"));
  if(v("rCo")) list=list.filter(p=>p.company===v("rCo"));
  if(v("rT")) list=list.filter(p=>p.typeCode===v("rT"));
  if(v("rS")) list=list.filter(p=>p.status===v("rS"));
  if(v("rSh")) list=list.filter(p=>p.shift===v("rSh"));
  if(v("rRv")) list=list.filter(p=>p.reviewer===v("rRv"));
  return list;
}
function applyReport(){
  const list=REPORT_LIST=reportFilter();
  const cnt=s=>list.filter(p=>p.status===s).length;
  const typeCount={}; list.forEach(p=>typeCount[p.typeCode]=(typeCount[p.typeCode]||0)+1);
  const coCount={}; list.forEach(p=>coCount[p.company]=(coCount[p.company]||0)+1);
  const topT=Object.entries(typeCount).sort((a,b)=>b[1]-a[1])[0];
  const topC=Object.entries(coCount).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById("rSum").innerHTML=[
    ["Total Permits",list.length,"#1a73e8"],["Active",cnt("Active"),"#e8710a"],["Completed",cnt("Completed"),"#1e8e3e"],
    ["Expired",cnt("Expired"),"#8a94a0"],["Needs Update",cnt("Needs Update"),"#d93025"],
    ["Rejected / Void / Lost",cnt("Rejected")+cnt("Void")+cnt("Lost"),"#b3140a"],
    ["Top Permit Type",topT?typeOf(topT[0]).code+" · "+topT[1]:"—","#7c4dff"],
    ["Top Trade Partner",topC?topC[0]:"—","#00897b"]
  ].map(([l,v,c])=>`<div class="sum" style="cursor:default;border-top:4px solid ${c}"><b style="font-size:${String(v).length>6?"15":"26"}px;color:${c}">${esc(String(v))}</b><span>${l}</span><i class="tick" style="background:${c}"></i></div>`).join("");
  document.getElementById("rTbl").innerHTML=`<div class="tblwrap"><table class="tbl"><thead><tr>
    <th>Start</th><th>Good Through</th><th>Permit #</th><th>Type</th><th>Company</th><th>Requested By</th><th>Bldg</th><th>Floor / Location</th><th>Shift</th><th>Status</th><th>Approved By</th></tr></thead>
    <tbody>${list.map(p=>`<tr class="${urgCls(p)}"><td>${fmtD(p.startDate)}</td><td>${fmtD(p.goodThrough)}</td><td class="pnum">${esc(p.number)}</td>
      <td>${esc(typeOf(p.typeCode).code)}</td><td>${esc(p.company)}</td><td>${esc(p.requestedBy)}</td><td>${esc(p.building)}</td>
      <td>${esc(p.floor)}${p.location?" · "+esc(p.location):""}</td><td>${esc(p.shift)}</td><td>${badge(p.status)} ${ageChip(p)}</td><td>${esc(p.approvedBy||"")}</td></tr>`).join("")
      ||'<tr><td colspan="11" class="empty">No permits match these filters.</td></tr>'}</tbody></table></div>`;
}
function exportCSV(excel){
  const list=REPORT_LIST.length?REPORT_LIST:reportFilter();
  const H=["Start Date","Expiration Date","Permit Number","Permit Type","Company","Requested By","Building","Floor / Location","Shift","Description","Jacobs Reviewer","Paperwork Submitted","Paperwork Approved","Status","Approval Date","Approved By","Closed Date","Comments"];
  const rows=list.map(p=>[p.startDate,p.goodThrough,p.number,typeOf(p.typeCode).name+" ("+p.typeCode+")",p.company,p.requestedBy,
    bldOf(p.building).name,[p.floor,p.area,p.location].filter(Boolean).join(" - "),p.shift,p.description,p.reviewer,
    p.paperworkSubmitted||p.paperwork||"",p.paperworkApproved||"",p.status,
    p.approvedAt?p.approvedAt.slice(0,10):"",p.approvedBy||"",p.closedAt?p.closedAt.slice(0,10):"",
    [p.reviewComments,p.approvalConditions,p.rejectReason].filter(Boolean).join(" | ")]);
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const csv="﻿"+[H,...rows].map(r=>r.map(q).join(",")).join("\r\n");
  dl(new Blob([csv],{type:excel?"application/vnd.ms-excel":"text/csv"}),"Permit_Log_"+today()+(excel?".xls.csv":".csv"));
}
function exportByType(){
  const list=REPORT_LIST.length?REPORT_LIST:reportFilter();
  const H=["Start Date","Expiration Date","Permit Number","Company","Requested By","Building","Floor / Location","Shift","Description","Jacobs Reviewer","Paperwork Submitted","Paperwork Approved","Status","Approval Date","Approved By","Closed Date","Comments"];
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const groups={}; list.forEach(p=>{(groups[p.typeCode]=groups[p.typeCode]||[]).push(p);});
  let out=["﻿"];
  DB.permitTypes.forEach(t=>{
    const g=groups[t.code]; if(!g||!g.length) return;
    out.push(""); out.push(q("=== "+t.name.toUpperCase()+" ("+t.code+") — "+g.length+" permits ==="));
    out.push(H.map(q).join(","));
    g.forEach(p=>out.push([p.startDate,p.goodThrough,p.number,p.company,p.requestedBy,bldOf(p.building).name,
      [p.floor,p.area,p.location].filter(Boolean).join(" - "),p.shift,p.description,p.reviewer,
      p.paperworkSubmitted||p.paperwork||"",p.paperworkApproved||"",p.status,
      p.approvedAt?p.approvedAt.slice(0,10):"",p.approvedBy||"",p.closedAt?p.closedAt.slice(0,10):"",
      [p.reviewComments,p.approvalConditions,p.rejectReason].filter(Boolean).join(" | ")].map(q).join(",")));
  });
  dl(new Blob([out.join("\r\n")],{type:"application/vnd.ms-excel"}),"Permit_Log_ByType_"+today()+".csv");
}

/* ============================================================
   LIVE CLOUD SYNC — every device sees the same permits
   (Supabase REST; localStorage stays as the offline cache)
   ============================================================ */
const CLOUD={ url:"https://ltjvpodpdlmwvjmwuygm.supabase.co", key:"sb_publishable_DiH5dXOI8BpuPIvtClmZhg_ZDZjVTi3" };
const cloudOn=()=> CLOUD.url.startsWith("https://");
const sbH=()=>({apikey:CLOUD.key,Authorization:"Bearer "+CLOUD.key,"Content-Type":"application/json"});
let lastPush=+(localStorage.getItem("ppp_lastpush")||0);
let SYNC_STATE=cloudOn()?"sync":"off";
let syncTimer=null, syncBusy=false;
function scheduleSync(){ if(!cloudOn()) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(), 1200); }
function updateSyncBadge(){
  const el=document.getElementById("syncBadge"); if(!el) return;
  el.innerHTML = SYNC_STATE==="ok" ? '<span style="color:var(--green)">🟢 Live — synced across all devices</span>'
    : SYNC_STATE==="sync" ? '⏳ Syncing…'
    : SYNC_STATE==="err" ? '<span style="color:var(--red)">🔴 Sync issue — retrying (changes saved on this device)</span>'
    : '⚪ Offline mode — data saved on this device only';
}
function mergeLogs(a,b,cap){
  const seen=new Set(), out=[];
  [...(a||[]),...(b||[])].forEach(e=>{ const k=JSON.stringify([e.at,e.action||e.role,e.name||e.by]); if(!seen.has(k)){seen.add(k);out.push(e);} });
  out.sort((x,y)=> (y.at||"").localeCompare(x.at||""));
  return out.slice(0,cap);
}
async function syncPush(){
  const rows=[
    ...DB.permits.filter(p=>(p._u||0)>lastPush).map(p=>({id:p.id,updated:p._u||Date.now(),deleted:false,data:p})),
    ...DB.trash.filter(p=>(p._u||0)>lastPush).map(p=>({id:p.id,updated:p._u||Date.now(),deleted:true,data:p}))
  ];
  if(rows.length){
    const r=await fetch(CLOUD.url+"/rest/v1/permits",{method:"POST",
      headers:{...sbH(),Prefer:"resolution=merge-duplicates"},body:JSON.stringify(rows)});
    if(!r.ok) throw new Error("push "+r.status);
  }
  if((DB.cfgU||0)>lastPush){
    const cfg={cfg:JSON.parse(configSnapshot()),counters:DB.counters,accessLog:DB.accessLog.slice(0,300),adminLog:DB.adminLog};
    const r=await fetch(CLOUD.url+"/rest/v1/portal_config",{method:"POST",
      headers:{...sbH(),Prefer:"resolution=merge-duplicates"},body:JSON.stringify([{id:1,updated:DB.cfgU,data:cfg}])});
    if(!r.ok) throw new Error("cfg push "+r.status);
  }
  lastPush=Date.now(); localStorage.setItem("ppp_lastpush",String(lastPush));
}
async function syncPull(){
  const r=await fetch(CLOUD.url+"/rest/v1/permits?select=id,updated,deleted,data",{headers:sbH()});
  if(!r.ok) throw new Error("pull "+r.status);
  const rows=await r.json();
  let changed=false;
  rows.forEach(row=>{
    const lu=(DB.permits.find(p=>p.id===row.id)?._u)||(DB.trash.find(p=>p.id===row.id)?._u)||0;
    if((row.updated||0)>lu){
      changed=true;
      DB.permits=DB.permits.filter(p=>p.id!==row.id);
      DB.trash=DB.trash.filter(p=>p.id!==row.id);
      if(row.deleted) DB.trash.unshift(row.data); else DB.permits.unshift(row.data);
    }
  });
  const rc=await fetch(CLOUD.url+"/rest/v1/portal_config?select=updated,data&id=eq.1",{headers:sbH()});
  if(rc.ok){
    const cfgRow=(await rc.json())[0];
    if(cfgRow&&(cfgRow.updated||0)>(DB.cfgU||0)){
      changed=true;
      const c=cfgRow.data||{};
      if(c.cfg){ Object.assign(DB,{buildings:c.cfg.buildings,floors:c.cfg.floors,contractors:c.cfg.contractors,
        permitTypes:c.cfg.permitTypes,reviewers:c.cfg.reviewers,permitDocs:c.cfg.permitDocs,safetyUsers:c.cfg.safetyUsers||[],
        equipment:c.cfg.equipment||DB.equipment||[]});
        DB.settings={...DB.settings,...c.cfg.settings}; }
      Object.entries(c.counters||{}).forEach(([k,v])=>{ DB.counters[k]=Math.max(DB.counters[k]||0,v); });
      DB.accessLog=mergeLogs(DB.accessLog,c.accessLog,500);
      DB.adminLog=mergeLogs(DB.adminLog,c.adminLog,40);
      DB.cfgU=cfgRow.updated;
    }
  }
  if(changed){
    saveDBLocal();
    // refresh the screen unless the user is mid-form or has a pop-up open
    if(!F&&!document.querySelector(".modal-bk")){ window._keepScroll=true; route(); }
  }
}
async function syncNow(){
  if(!cloudOn()||syncBusy) return;
  syncBusy=true; SYNC_STATE="sync"; updateSyncBadge();
  try{ await syncPull(); await syncPush(); SYNC_STATE="ok"; }
  catch(e){ SYNC_STATE="err"; }
  syncBusy=false; updateSyncBadge();
}
async function cloudDeleteRow(id){
  if(!cloudOn()) return;
  try{ await fetch(CLOUD.url+"/rest/v1/permits?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:sbH()}); }catch(e){}
}

function showIntro(){
  if(sessionStorage.getItem("ppp_intro")) return;
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){ sessionStorage.setItem("ppp_intro","1"); return; }
  sessionStorage.setItem("ppp_intro","1");
  const words=[
    `${T("WE BUILD")} <em>${T("BOLD")}</em>.`,
    `${T("WE BUILD")} <em>${T("SAFE")}</em>.`,
    `${T("WE BUILD")} <em>${T("TOGETHER")}</em>.`,
    `${T("ONE PERMIT")} <em>${T("AT A TIME")}</em>.`];
  const d=document.createElement("div"); d.id="intro";
  d.innerHTML=`${SKYLINE_SVG("intro-sky","rgba(255,184,28,.55)")}
    ${words.map((w,i)=>`<div class="intro-word" id="iw${i}">${w}</div>`).join("")}
    <div class="intro-brand" id="ibrand"><div class="ib-badge">PP</div>
      <h1>Project Permit Portal</h1><p>${T("Request. Review. Approve. Track.")}</p>
      <button class="btn btn-y" style="margin-top:22px;min-width:250px" id="introGo">🚀 ${T("Start Permit Request")}</button></div>
    <button id="introSkip">${T("Skip intro")} ⏭</button>`;
  document.body.appendChild(d);
  let done=false;
  const end=(dest)=>{ if(done) return; done=true;
    d.classList.add("lift"); setTimeout(()=>d.remove(),900);
    if(dest) go(dest); };
  document.getElementById("introSkip").onclick=()=>end();
  document.getElementById("introGo").onclick=()=>end("types");
  // unhurried pace — each statement breathes ~5s, brand holds, ~32s total, skip any time
  const STEP=5200, HOLD=3400;
  const step=(i)=>{ const el=document.getElementById("iw"+i); if(!el) return;
    el.classList.add("in"); setTimeout(()=>el.classList.add("gone"),HOLD+900); };
  words.forEach((w,i)=>setTimeout(()=>step(i),400+i*STEP));
  setTimeout(()=>document.getElementById("ibrand")?.classList.add("in"),400+words.length*STEP);
  setTimeout(()=>end(),400+words.length*STEP+10500);
}
